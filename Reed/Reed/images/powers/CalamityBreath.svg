<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'>
  <defs>
    <radialGradient id='cbGlow' cx='50%' cy='60%' r='55%'>
      <stop offset='0%' stop-color='#4a7a3a' stop-opacity='0.35'/>
      <stop offset='50%' stop-color='#1a3a0a' stop-opacity='0.15'/>
      <stop offset='100%' stop-color='#1a0d08' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='cbCloud' cx='40%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#3a6a2a' stop-opacity='0.9'/>
      <stop offset='40%' stop-color='#2a4a1a' stop-opacity='0.85'/>
      <stop offset='80%' stop-color='#1a2a0a' stop-opacity='0.7'/>
      <stop offset='100%' stop-color='#0a1a05' stop-opacity='0.3'/>
    </radialGradient>
    <linearGradient id='cbFlame' x1='50%' y1='100%' x2='50%' y2='0%'>
      <stop offset='0%' stop-color='#ff6b1a' stop-opacity='0.8'/>
      <stop offset='50%' stop-color='#c43d0e' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#4a2a05' stop-opacity='0'/>
    </linearGradient>
    <radialGradient id='cbCorrode' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#7acc33' stop-opacity='0.7'/>
      <stop offset='60%' stop-color='#4a8a1a' stop-opacity='0.3'/>
      <stop offset='100%' stop-color='#2a4a0a' stop-opacity='0'/>
    </radialGradient>
  </defs>
  <rect width='64' height='64' fill='#1a0d08' rx='8'/>
  <rect width='64' height='64' fill='url(#cbGlow)' rx='8'/>
  <!-- Flame at bottom -->
  <path d='M24 54 C22 48 26 42 32 44 C38 42 42 48 40 54 C38 56 34 56 32 54 C30 56 26 56 24 54 Z' fill='url(#cbFlame)'/>
  <path d='M28 50 C27 46 30 43 32 45 C34 43 37 46 36 50 C35 52 33 52 32 50 C31 52 29 52 28 50 Z' fill='#ff9d3a' opacity='0.6'/>
  <!-- Breath cloud -->
  <ellipse cx='32' cy='28' rx='20' ry='14' fill='url(#cbCloud)'/>
  <ellipse cx='26' cy='24' rx='12' ry='9' fill='url(#cbCloud)' opacity='0.8'/>
  <ellipse cx='40' cy='26' rx='10' ry='8' fill='url(#cbCloud)' opacity='0.7'/>
  <ellipse cx='34' cy='32' rx='14' ry='7' fill='url(#cbCloud)' opacity='0.6'/>
  <!-- Corrosive droplets -->
  <circle cx='22' cy='38' r='2.5' fill='url(#cbCorrode)'/>
  <circle cx='22' cy='38' r='1' fill='#9ade42' opacity='0.8'/>
  <circle cx='42' cy='40' r='2' fill='url(#cbCorrode)'/>
  <circle cx='42' cy='40' r='0.8' fill='#9ade42' opacity='0.8'/>
  <circle cx='32' cy='42' r='1.5' fill='url(#cbCorrode)'/>
  <circle cx='32' cy='42' r='0.6' fill='#9ade42' opacity='0.7'/>
  <!-- Wisps rising from cloud -->
  <path d='M28 20 C27 16 29 12 31 10' fill='none' stroke='#4a8a1a' stroke-width='1.5' stroke-opacity='0.4' stroke-linecap='round'/>
  <path d='M36 22 C37 17 35 13 33 11' fill='none' stroke='#4a8a1a' stroke-width='1.5' stroke-opacity='0.4' stroke-linecap='round'/>
  <path d='M32 18 C32 14 33 10 34 8' fill='none' stroke='#5a9a2a' stroke-width='1' stroke-opacity='0.3' stroke-linecap='round'/>
  <!-- Small ember in cloud -->
  <circle cx='30' cy='26' r='1.2' fill='#ff8a2a' opacity='0.5'/>
  <circle cx='37' cy='29' r='0.8' fill='#ff9d3a' opacity='0.4'/>
</svg>