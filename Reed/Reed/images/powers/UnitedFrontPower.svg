<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'>
  <defs>
    <radialGradient id='ufpGlow' cx='50%' cy='50%' r='55%'>
      <stop offset='0%' stop-color='#ff8800' stop-opacity='0.35'/>
      <stop offset='50%' stop-color='#c41a05' stop-opacity='0.15'/>
      <stop offset='100%' stop-color='#1a0d08' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='ufpCore' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='30%' stop-color='#ffe060'/>
      <stop offset='70%' stop-color='#ff6b1a' stop-opacity='0.6'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='ufpFlame' x1='50%' y1='100%' x2='50%' y2='0%'>
      <stop offset='0%' stop-color='#ff6b1a' stop-opacity='0.7'/>
      <stop offset='50%' stop-color='#e6591a' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#4a2a05' stop-opacity='0'/>
    </linearGradient>
  </defs>

  <rect width='64' height='64' fill='#1a0d08' rx='8'/>
  <rect width='64' height='64' fill='url(#ufpGlow)' rx='8'/>

  <!-- Three converging flame pillars -->
  <g>
    <path d='M14 54 C12 44 14 34 18 26 C20 22 22 20 22 20 C21 26 23 32 26 35 C27 29 28 26 30 22 C29 30 30 40 27 48 C25 52 20 56 16 56 Z' fill='url(#ufpFlame)' opacity='0.6'/>
    <path d='M50 54 C52 44 50 34 46 26 C44 22 42 20 42 20 C43 26 41 32 38 35 C37 29 36 26 34 22 C35 30 34 40 37 48 C39 52 44 56 48 56 Z' fill='url(#ufpFlame)' opacity='0.6'/>
    <path d='M32 56 C29 46 31 36 34 28 C36 24 38 20 38 18 C37 24 39 30 42 34 C43 28 44 24 46 20 C45 30 45 42 42 50 C39 54 35 58 32 58 Z' fill='url(#ufpFlame)' opacity='0.75'/>
  </g>

  <!-- Central united core -->
  <circle cx='32' cy='30' r='10' fill='url(#ufpCore)'/>
  <circle cx='32' cy='30' r='4' fill='#fff8e0' opacity='0.85'/>

  <!-- Convergence lines -->
  <g stroke='#ff8800' stroke-width='1' opacity='0.4' stroke-linecap='round'>
    <line x1='22' y1='28' x2='28' y2='30'/>
    <line x1='42' y1='28' x2='36' y2='30'/>
  </g>

  <!-- Small embers -->
  <circle cx='12' cy='14' r='1.5' fill='#ffe060' opacity='0.6'/>
  <circle cx='52' cy='14' r='1.5' fill='#ffaa30' opacity='0.6'/>
  <circle cx='32' cy='8' r='1.5' fill='#ffe060' opacity='0.65'/>
  <circle cx='20' cy='40' r='1' fill='#ff8800' opacity='0.4'/>
  <circle cx='44' cy='40' r='1' fill='#ff8800' opacity='0.4'/>
</svg>
