  <line x1="64.0" y1="55.0" x2="70.4" y2="55.3" stroke="#ff8800" stroke-width="1.3" opacity="0.59" filter="url(#glow1)"/>
  <line x1="64.0" y1="55.0" x2="64.4" y2="62.0" stroke="#fff8e0" stroke-width="1.1" opacity="0.70"/>
  <line x1="64.0" y1="55.0" x2="66.2" y2="60.8" stroke="#ffe060" stroke-width="1.5" opacity="0.76"/>
