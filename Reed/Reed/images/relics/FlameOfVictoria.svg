  <circle cx="118.7" cy="118.9" r="1.8" fill="#ff7a1a" opacity="0.34" filter="url(#glow1)"/>
  <circle cx="20.5" cy="19.7" r="2.3" fill="#e6591a" opacity="0.62" filter="url(#glow1)"/>
