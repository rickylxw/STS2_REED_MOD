  <path d="M 64.0 95.0 Q 52.1 86.2 58.1 79.2 Q 62.0 72.2 62.7 60.0 Q 66.0 70.5 68.5 75.8 Q 72.8 84.5 64.0 95.0 Z" fill="#ffe060" opacity="0.5" filter="url(#glow1)"/>
  <path d="M 64.0 95.0 Q 56.1 90.0 62.9 86.0 Q 62.6 82.0 63.7 75.0 Q 65.4 81.0 65.2 84.0 Q 69.6 89.0 64.0 95.0 Z" fill="#fff8e0" opacity="0.4" filter="url(#glow1)"/>
