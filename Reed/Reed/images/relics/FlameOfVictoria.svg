  <circle cx="102.8" cy="22.0" r="0.7" fill="#c41a05" opacity="0.67" filter="url(#glow1)"/>
  <circle cx="81.4" cy="93.2" r="1.7" fill="#ffe060" opacity="0.53" filter="url(#glow1)"/>
  <circle cx="118.3" cy="81.0" r="2.5" fill="#ffe060" opacity="0.35" filter="url(#glow1)"/>
