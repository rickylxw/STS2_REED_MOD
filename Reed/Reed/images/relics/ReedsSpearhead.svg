<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="30%" stop-color="#ffe060"/>
      <stop offset="60%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#8a2a05"/>
    </linearGradient>
    <radialGradient id="rad5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#e6591a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" fill="url(#bg3)" rx="8"/>
  <ellipse cx="64.0" cy="64.0" rx="61.4" ry="53.8" fill="#e6591a" opacity="0.06"/>
  <circle cx="92.5" cy="92.6" r="1.0" fill="#e6591a" opacity="0.46" filter="url(#glow1)"/>
  <circle cx="27.4" cy="116.5" r="1.5" fill="#ffe060" opacity="0.27" filter="url(#glow1)"/>
  <circle cx="39.4" cy="79.3" r="1.0" fill="#ffcc40" opacity="0.25"/>
  <circle cx="67.8" cy="30.4" r="1.3" fill="#ff8800" opacity="0.24" filter="url(#glow1)"/>
  <circle cx="104.1" cy="54.1" r="1.0" fill="#ffcc40" opacity="0.68"/>
  <circle cx="110.1" cy="109.4" r="1.8" fill="#ff8800" opacity="0.64"/>
  <circle cx="99.7" cy="83.3" r="1.2" fill="#ff7a1a" opacity="0.38"/>
  <circle cx="13.5" cy="109.7" r="0.9" fill="#ffe060" opacity="0.21"/>
  <ellipse cx="64" cy="64" rx="40" ry="40" fill="url(#rad5)" filter="url(#soft2)"/>
  <!-- Spearhead -->
  <path d="M 64 20 L 50 50 Q 48 70 52 85 L 64 100 L 76 85 Q 80 70 78 50 Z" fill="url(#lin4)" filter="url(#glow1)"/>
  <!-- Spear midrib -->
  <line x1="64" y1="24" x2="64" y2="96" stroke="#c41a05" stroke-width="1" opacity="0.5"/>
  <!-- Spear highlight -->
  <path d="M 64 20 L 57 50 Q 55 70 58 85 L 64 100 L 61 85 Q 58 70 60 50 Z" fill="#fff8e0" opacity="0.3"/>
