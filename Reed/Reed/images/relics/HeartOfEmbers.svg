<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg-ember" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a1208" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0e0500" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="heart-grad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5a2010" stop-opacity="1"/>
      <stop offset="60%" stop-color="#3a1005" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0800" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ff8800" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#e6591a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e6591a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crack-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8a0" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffcc40" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ff6600" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e6591a" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="ember-particle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="url(#bg-ember)" rx="8"/>

  <!-- Decorative ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#e6591a" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Outer glow -->
  <ellipse cx="64" cy="62" rx="38" ry="36" fill="url(#core-glow)"/>

  <!-- Heart shape (charcoal/dark, cracked) -->
  <path d="M 64 92 C 64 92 100 72 100 48 C 100 32 88 24 76 28 C 70 30 64 36 64 42 C 64 36 58 30 52 28 C 40 24 28 32 28 48 C 28 72 64 92 64 92 Z" fill="url(#heart-grad)" stroke="#5a2010" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Heart inner glow (the fire within) -->
  <path d="M 64 85 C 64 85 92 68 92 50 C 92 38 84 32 76 35 C 70 37 64 42 64 47 C 64 42 58 37 52 35 C 44 32 36 38 36 50 C 36 68 64 85 64 85 Z" fill="url(#core-glow)" opacity="0.6"/>

  <!-- Cracks of fire (lava-like fissures) -->
  <!-- Main vertical crack -->
  <path d="M 64 88 L 63 78 L 65 70 L 62 60 L 64 50 L 63 42" fill="none" stroke="url(#crack-grad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Left branch crack 1 -->
  <path d="M 63 78 L 55 72 L 48 68" fill="none" stroke="url(#crack-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Left branch crack 2 -->
  <path d="M 62 60 L 54 56 L 46 54" fill="none" stroke="url(#crack-grad)" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Right branch crack 1 -->
  <path d="M 65 70 L 74 66 L 82 64" fill="none" stroke="url(#crack-grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Right branch crack 2 -->
  <path d="M 64 50 L 72 48 L 80 50" fill="none" stroke="url(#crack-grad)" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Small crack at top -->
  <path d="M 63 42 L 60 38" fill="none" stroke="url(#crack-grad)" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M 64 42 L 67 38" fill="none" stroke="url(#crack-grad)" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Crack highlights (bright centers) -->
  <path d="M 64 85 L 63 75 L 65 65 L 62 55 L 64 45" fill="none" stroke="#fff8a0" stroke-width="0.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Central core (brightest point) -->
  <ellipse cx="64" cy="62" rx="6" ry="8" fill="url(#ember-particle)" opacity="0.8"/>
  <ellipse cx="64" cy="62" rx="2" ry="3" fill="#fff8a0" opacity="0.9"/>

  <!-- Floating ember particles rising from heart -->
  <circle cx="60" cy="30" r="1.5" fill="#ffcc40" opacity="0.7"/>
  <circle cx="68" cy="25" r="1" fill="#ff8800" opacity="0.5"/>
  <circle cx="55" cy="18" r="0.8" fill="#ffcc40" opacity="0.4"/>
  <circle cx="72" cy="16" r="1.2" fill="#ffaa30" opacity="0.5"/>
  <circle cx="64" cy="12" r="0.8" fill="#ffe060" opacity="0.3"/>
  <circle cx="48" cy="22" r="0.6" fill="#ff6600" opacity="0.3"/>
  <circle cx="80" cy="20" r="0.8" fill="#ffaa30" opacity="0.3"/>
  <circle cx="76" cy="30" r="0.5" fill="#ffcc40" opacity="0.4"/>

  <!-- Small glow spots on heart surface -->
  <circle cx="50" cy="55" r="2" fill="url(#ember-particle)" opacity="0.5"/>
  <circle cx="78" cy="52" r="1.5" fill="url(#ember-particle)" opacity="0.4"/>
  <circle cx="56" cy="70" r="1.5" fill="url(#ember-particle)" opacity="0.3"/>
  <circle cx="72" cy="72" r="1.2" fill="url(#ember-particle)" opacity="0.3"/>
</svg>
