      <stop offset="40%" stop-color="#e6591a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lin5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc40"/>
      <stop offset="40%" stop-color="#ff8800"/>
      <stop offset="80%" stop-color="#e6591a"/>
      <stop offset="100%" stop-color="#8a2a05"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="url(#bg3)" rx="8"/>
