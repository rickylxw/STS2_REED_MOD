<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg2" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3a2a"/>
      <stop offset="30%" stop-color="#3a2a20"/>
      <stop offset="60%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0d08"/>
    </linearGradient>
    <linearGradient id="lin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="30%" stop-color="#ffcc40"/>
      <stop offset="70%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#8a2a05"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg2)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.06"/>
  <circle cx="157.6" cy="82.1" r="0.6" fill="#ffe060" opacity="0.61"/>
  <circle cx="169.3" cy="53.4" r="0.5" fill="#c41a05" opacity="0.38" filter="url(#glow1)"/>
  <circle cx="72.0" cy="160.0" r="0.6" fill="#ff7a1a" opacity="0.38"/>
  <circle cx="31.1" cy="47.1" r="1.7" fill="#c41a05" opacity="0.64"/>
  <circle cx="107.8" cy="127.1" r="0.9" fill="#fff8e0" opacity="0.51"/>
  <circle cx="174.9" cy="137.8" r="0.6" fill="#ff8800" opacity="0.24"/>
  <circle cx="226.8" cy="81.6" r="1.6" fill="#e6591a" opacity="0.56"/>
  <circle cx="190.1" cy="35.5" r="0.8" fill="#ff6600" opacity="0.49" filter="url(#glow1)"/>
  <circle cx="133.0" cy="92.5" r="0.8" fill="#ffcc40" opacity="0.27" filter="url(#glow1)"/>
  <circle cx="110.6" cy="47.5" r="1.8" fill="#ffcc40" opacity="0.33" filter="url(#glow1)"/>
  <!-- Fortress wall -->
  <rect x="30" y="50" width="190" height="120" fill="url(#lin3)" rx="2"/>
  <!-- Battlements -->
  <rect x="30" y="35" width="30" height="20" fill="url(#lin3)" rx="2"/>
  <rect x="80" y="35" width="30" height="20" fill="url(#lin3)" rx="2"/>
  <rect x="130" y="35" width="30" height="20" fill="url(#lin3)" rx="2"/>
  <rect x="180" y="35" width="30" height="20" fill="url(#lin3)" rx="2"/>
  <!-- Scorch marks -->
  <ellipse cx="80" cy="120" rx="30" ry="21.0" fill="url(#lin4)" opacity="0.3" filter="url(#glow1)"/>
  <ellipse cx="160" cy="100" rx="25" ry="17.5" fill="url(#lin4)" opacity="0.3" filter="url(#glow1)"/>
  <ellipse cx="120" cy="150" rx="35" ry="24.5" fill="url(#lin4)" opacity="0.3" filter="url(#glow1)"/>
  <!-- Glowing cracks -->
  <path d="M 50 80 L 70 100 L 60 120 L 80 140 L 75 165" fill="none" stroke="url(#lin4)" stroke-width="2" opacity="0.7" filter="url(#glow1)"/>
  <path d="M 200 80 L 180 100 L 190 120 L 170 140 L 175 165" fill="none" stroke="url(#lin4)" stroke-width="2" opacity="0.6" filter="url(#glow1)"/>
  <path d="M 125 55 L 120 80 L 130 110 L 125 140 L 130 165" fill="none" stroke="url(#lin4)" stroke-width="1.5" opacity="0.5" filter="url(#glow1)"/>
  <!-- Ember spots -->
  <circle cx="60" cy="90" r="2" fill="#ff8800" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="100" cy="70" r="2" fill="#ff8800" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="150" cy="80" r="2" fill="#ff8800" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="180" cy="110" r="2" fill="#ff8800" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="70" cy="130" r="2" fill="#ff8800" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="140" cy="120" r="2" fill="#ff8800" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="190" cy="140" r="2" fill="#ff8800" opacity="0.5" filter="url(#glow1)"/>
</svg>
