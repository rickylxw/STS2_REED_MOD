  <path d="M 40.0 95.0 Q 30.1 81.2 33.7 70.2 Q 37.6 59.2 37.8 40.0 Q 42.4 56.5 44.8 64.8 Q 53.6 78.5 40.0 95.0 Z" fill="url(#lin4)" opacity="0.8" filter="url(#glow1)"/>
