<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgPT' cx='50%' cy='48%' r='75%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='55%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <radialGradient id='flameGPT' cx='50%' cy='65%' r='55%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='15%' stop-color='#ffe060'/>
      <stop offset='40%' stop-color='#ff8800'/>
      <stop offset='75%' stop-color='#e6591a'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='torchHPT' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#4a2818'/>
      <stop offset='50%' stop-color='#5a3020'/>
      <stop offset='100%' stop-color='#2a1810'/>
    </linearGradient>
    <linearGradient id='handLPT' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#2a1008'/>
      <stop offset='60%' stop-color='#3a1810'/>
      <stop offset='100%' stop-color='#5a2818'/>
    </linearGradient>
    <linearGradient id='handRPT' x1='100%' y1='0%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#2a1008'/>
      <stop offset='60%' stop-color='#3a1810'/>
      <stop offset='100%' stop-color='#5a2818'/>
    </linearGradient>
    <filter id='glowPT' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur stdDeviation='3' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='bigGlowPT' x='-100%' y='-100%' width='300%' height='300%'>
      <feGaussianBlur stdDeviation='12'/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width='250' height='190' fill='url(#bgPT)' rx='8'/>

  <!-- Ambient glow behind torch -->
  <ellipse cx='125' cy='50' rx='65' ry='60' fill='#e6591a' opacity='0.16' filter='url(#bigGlowPT)'/>
  <ellipse cx='125' cy='45' rx='42' ry='40' fill='#ff8800' opacity='0.14' filter='url(#bigGlowPT)'/>

  <!-- Ground shadow -->
  <ellipse cx='125' cy='155' rx='50' ry='6' fill='#0a0503' opacity='0.5'/>

  <!-- Left hand (giving) -->
  <g>
    <path d='M 0,76 L 0,104 Q 18,107 35,105 Q 48,103 55,99 Q 58,96 57,91 Q 59,86 56,83 Q 42,79 25,79 Q 12,78 0,76 Z' fill='url(#handLPT)'/>
    <path d='M 52,83 Q 50,77 54,74 Q 59,73 61,77 Q 60,81 56,83 Z' fill='#3a1810'/>
    <path d='M 55,84 Q 67,81 79,84 Q 81,86 79,88 Q 67,90 55,88 Z' fill='#3a1810'/>
    <path d='M 55,88 Q 68,85 82,88 Q 84,90 82,92 Q 68,94 55,92 Z' fill='#3a1810'/>
    <path d='M 55,92 Q 66,89 78,93 Q 80,95 78,97 Q 66,98 55,96 Z' fill='#3a1810'/>
    <path d='M 55,96 Q 64,94 73,97 Q 75,99 73,101 Q 64,102 55,100 Z' fill='#3a1810'/>
    <path d='M 55,84 Q 67,81 79,84 Q 81,86 79,88' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.4'/>
    <path d='M 55,88 Q 68,85 82,88 Q 84,90 82,92' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.4'/>
    <path d='M 55,92 Q 66,89 78,93 Q 80,95 78,97' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.3'/>
    <path d='M 55,96 Q 64,94 73,97 Q 75,99 73,101' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.25'/>
  </g>

  <!-- Right hand (receiving) -->
  <g>
    <path d='M 250,76 L 250,104 Q 232,107 215,105 Q 202,103 195,99 Q 192,96 193,91 Q 191,86 194,83 Q 208,79 225,79 Q 238,78 250,76 Z' fill='url(#handRPT)'/>
    <path d='M 198,83 Q 200,77 196,74 Q 191,73 189,77 Q 190,81 194,83 Z' fill='#3a1810'/>
    <path d='M 195,84 Q 183,81 171,84 Q 169,86 171,88 Q 183,90 195,88 Z' fill='#3a1810'/>
    <path d='M 195,88 Q 182,85 168,88 Q 166,90 168,92 Q 182,94 195,92 Z' fill='#3a1810'/>
    <path d='M 195,92 Q 184,89 172,93 Q 170,95 172,97 Q 184,98 195,96 Z' fill='#3a1810'/>
    <path d='M 195,96 Q 186,94 177,97 Q 175,99 177,101 Q 186,102 195,100 Z' fill='#3a1810'/>
    <path d='M 195,84 Q 183,81 171,84 Q 169,86 171,88' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.4'/>
    <path d='M 195,88 Q 182,85 168,88 Q 166,90 168,92' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.4'/>
    <path d='M 195,92 Q 184,89 172,93 Q 170,95 172,97' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.3'/>
    <path d='M 195,96 Q 186,94 177,97 Q 175,99 177,101' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.25'/>
  </g>

  <!-- Torch handle -->
  <rect x='119' y='92' width='12' height='55' fill='url(#torchHPT)' rx='2'/>
  <rect x='119' y='92' width='3' height='55' fill='#6a3828' opacity='0.4' rx='2'/>
  <rect x='114' y='85' width='22' height='12' fill='#2a1008' rx='3'/>
  <rect x='116' y='87' width='18' height='3' fill='#5a3020' opacity='0.5'/>
  <rect x='116' y='93' width='18' height='2' fill='#1a0804' opacity='0.6'/>

  <!-- Flame outer glow -->
  <ellipse cx='125' cy='50' rx='34' ry='40' fill='url(#flameGPT)' opacity='0.35' filter='url(#bigGlowPT)'/>

  <!-- Outer flame (red) -->
  <path d='M 108,88 Q 96,70 102,52 Q 106,42 114,44 Q 110,30 118,22 Q 125,15 132,22 Q 140,30 136,44 Q 144,42 148,52 Q 154,70 142,88 Z' fill='#c41a05' opacity='0.85'/>

  <!-- Mid flame (orange) -->
  <path d='M 112,85 Q 103,70 107,55 Q 111,46 117,48 Q 114,35 120,28 Q 125,23 130,28 Q 136,35 133,48 Q 139,46 143,55 Q 147,70 138,85 Z' fill='#e6591a' opacity='0.85'/>

  <!-- Inner flame (bright orange) -->
  <path d='M 116,82 Q 110,70 113,58 Q 117,50 121,52 Q 119,40 123,34 Q 125,30 127,34 Q 131,40 129,52 Q 133,50 137,58 Q 140,70 134,82 Z' fill='#ff8800' opacity='0.9'/>

  <!-- Core (yellow-white) -->
  <path d='M 119,78 Q 116,68 118,60 Q 121,53 124,55 Q 122,45 124,40 Q 125,37 126,40 Q 128,45 126,55 Q 129,53 132,60 Q 134,68 131,78 Z' fill='#ffaa30'/>
  <ellipse cx='125' cy='58' rx='5' ry='12' fill='#ffe060' opacity='0.85'/>
  <ellipse cx='125' cy='55' rx='3' ry='7' fill='#fff8e0' opacity='0.9'/>

  <!-- Flame transfer trail toward right hand -->
  <path d='M 142,62 Q 155,54 170,58 Q 180,61 188,66 Q 182,62 174,60 Q 162,57 152,61 Q 146,64 142,62 Z' fill='#ff8800' opacity='0.4' filter='url(#glowPT)'/>
  <path d='M 145,57 Q 160,50 175,54 Q 183,57 185,60 Q 178,56 168,54 Q 155,52 148,56 Q 144,58 145,57 Z' fill='#ffaa30' opacity='0.28' filter='url(#glowPT)'/>

  <!-- Transfer embers -->
  <circle cx='155' cy='59' r='2' fill='#ffe060' opacity='0.8' filter='url(#glowPT)'/>
  <circle cx='170' cy='58' r='1.5' fill='#ffaa30' opacity='0.7' filter='url(#glowPT)'/>
  <circle cx='182' cy='62' r='1.5' fill='#ff8800' opacity='0.6'/>
  <circle cx='148' cy='56' r='1' fill='#fff8e0' opacity='0.6'/>
  <circle cx='178' cy='54' r='1' fill='#ffe060' opacity='0.5'/>

  <!-- Sparks -->
  <circle cx='105' cy='35' r='1' fill='#ffe060' opacity='0.7'/>
  <circle cx='148' cy='30' r='0.8' fill='#ff8800' opacity='0.6'/>
  <circle cx='130' cy='12' r='0.8' fill='#ffe060' opacity='0.5'/>
  <circle cx='115' cy='18' r='0.6' fill='#ffaa30' opacity='0.5'/>
  <circle cx='155' cy='42' r='0.8' fill='#ffe060' opacity='0.6'/>
  <circle cx='100' cy='50' r='0.6' fill='#ff8800' opacity='0.4'/>
  <circle cx='160' cy='20' r='0.6' fill='#fff8e0' opacity='0.4'/>
  <circle cx='95' cy='25' r='0.5' fill='#ffaa30' opacity='0.4'/>
  <circle cx='140' cy='15' r='0.5' fill='#ffe060' opacity='0.4'/>
</svg>
