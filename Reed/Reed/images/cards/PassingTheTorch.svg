  <circle cx="104.8" cy="128.0" r="2.2" fill="#ff6600" opacity="0.40"/>
  <circle cx="233.5" cy="175.3" r="1.7" fill="#ffcc40" opacity="0.51" filter="url(#glow1)"/>
  <circle cx="165.3" cy="140.4" r="2.1" fill="#fff8e0" opacity="0.56"/>
  <circle cx="99.3" cy="140.4" r="2.1" fill="#ffcc40" opacity="0.52"/>
  <circle cx="100.5" cy="47.9" r="2.0" fill="#ffcc40" opacity="0.51" filter="url(#glow1)"/>
