<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg2" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="50%" stop-color="#5a3a2a"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
    <linearGradient id="lin4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a2a05" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#e6591a" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#ff8800" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe060" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="lin5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2a05" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe060" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg2)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.05"/>
  <circle cx="58.6" cy="45.8" r="1.4" fill="#ff6600" opacity="0.60"/>
