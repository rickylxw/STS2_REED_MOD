<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <radialGradient id="bgSpark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="50%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </radialGradient>
    <radialGradient id="coreSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="10%" stop-color="#ffe060" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#ffaa30" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#ff8800" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#e6591a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameBurst" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffe060" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ff8800" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c41a05" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSpark">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlowSpark">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="250" height="190" fill="url(#bgSpark)" rx="8"/>

  <!-- Vignette darkening -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="250" height="190" fill="url(#vignette)" rx="8"/>

  <!-- Atmospheric darkness -->
  <ellipse cx="125" cy="100" rx="90" ry="70" fill="#1a0d08" opacity="0.3"/>

  <!-- Radiating heat lines from center -->
  <line x1="125" y1="95" x2="80" y2="50" stroke="#ff8800" stroke-width="0.8" opacity="0.15"/>
  <line x1="125" y1="95" x2="55" y2="80" stroke="#e6591a" stroke-width="0.6" opacity="0.12"/>
  <line x1="125" y1="95" x2="45" y2="100" stroke="#ff8800" stroke-width="0.8" opacity="0.1"/>
  <line x1="125" y1="95" x2="55" y2="130" stroke="#e6591a" stroke-width="0.6" opacity="0.12"/>
  <line x1="125" y1="95" x2="80" y2="155" stroke="#ff8800" stroke-width="0.8" opacity="0.15"/>
  <line x1="125" y1="95" x2="120" y2="170" stroke="#e6591a" stroke-width="0.6" opacity="0.1"/>
  <line x1="125" y1="95" x2="170" y2="155" stroke="#ff8800" stroke-width="0.8" opacity="0.15"/>
  <line x1="125" y1="95" x2="200" y2="130" stroke="#e6591a" stroke-width="0.6" opacity="0.12"/>
  <line x1="125" y1="95" x2="210" y2="100" stroke="#ff8800" stroke-width="0.8" opacity="0.1"/>
  <line x1="125" y1="95" x2="200" y2="80" stroke="#e6591a" stroke-width="0.6" opacity="0.12"/>
  <line x1="125" y1="95" x2="170" y2="50" stroke="#ff8800" stroke-width="0.8" opacity="0.15"/>
  <line x1="125" y1="95" x2="125" y2="40" stroke="#e6591a" stroke-width="0.6" opacity="0.1"/>

  <!-- Outer glow halo -->
  <circle cx="125" cy="95" r="50" fill="url(#coreSpark)" opacity="0.3" filter="url(#bigGlowSpark)"/>

  <!-- Flame burst base (wide, low) -->
  <ellipse cx="125" cy="100" rx="22" ry="14" fill="url(#flameBurst)" filter="url(#glowSpark)"/>

  <!-- Tiny flame tongues rising -->
  <path d="M 115 95 Q 112 80 116 68 Q 119 58 117 50 Q 121 62 118 75 Q 116 85 119 93 Z"
        fill="#ff8800" opacity="0.6" filter="url(#glowSpark)"/>
  <path d="M 125 95 Q 122 75 127 60 Q 130 48 126 38 Q 131 52 128 68 Q 125 80 128 92 Z"
        fill="#ffaa30" opacity="0.7" filter="url(#glowSpark)"/>
  <path d="M 135 95 Q 132 82 137 68 Q 139 58 135 50 Q 139 62 136 75 Q 134 85 137 93 Z"
        fill="#ff8800" opacity="0.5" filter="url(#glowSpark)"/>

  <!-- Inner brighter flames -->
  <path d="M 122 93 Q 120 78 124 65 Q 126 55 124 45 Q 128 58 126 72 Q 123 82 126 90 Z"
        fill="#ffe060" opacity="0.7" filter="url(#glowSpark)"/>
  <path d="M 128 93 Q 126 80 130 68 Q 132 58 128 48 Q 132 60 130 72 Q 127 82 130 90 Z"
        fill="#ffe060" opacity="0.6" filter="url(#glowSpark)"/>

  <!-- Bright core glow -->
  <circle cx="125" cy="93" r="10" fill="url(#coreSpark)" filter="url(#glowSpark)"/>

  <!-- White-hot center -->
  <circle cx="125" cy="92" r="4" fill="#fff8e0" filter="url(#glowSpark)"/>
  <circle cx="125" cy="92" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- Scattered ember particles -->
  <circle cx="70" cy="60" r="1.5" fill="#ff8800" opacity="0.6" filter="url(#glowSpark)"/>
  <circle cx="185" cy="65" r="1.2" fill="#ffaa30" opacity="0.5" filter="url(#glowSpark)"/>
  <circle cx="60" cy="110" r="1" fill="#e6591a" opacity="0.5" filter="url(#glowSpark)"/>
  <circle cx="190" cy="115" r="1.3" fill="#ff8800" opacity="0.5" filter="url(#glowSpark)"/>
  <circle cx="85" cy="145" r="1" fill="#ffaa30" opacity="0.4"/>
  <circle cx="165" cy="140" r="1.2" fill="#ff8800" opacity="0.4"/>
  <circle cx="50" cy="40" r="0.8" fill="#e6591a" opacity="0.4"/>
  <circle cx="200" cy="40" r="1" fill="#ff8800" opacity="0.4"/>
  <circle cx="40" cy="150" r="0.8" fill="#c41a05" opacity="0.3"/>
  <circle cx="210" cy="150" r="1" fill="#e6591a" opacity="0.3"/>

  <!-- Small sparks shooting outward -->
  <line x1="125" y1="92" x2="95" y2="55" stroke="#fff8e0" stroke-width="0.8" opacity="0.5"/>
  <line x1="125" y1="92" x2="155" y2="50" stroke="#ffe060" stroke-width="0.8" opacity="0.5"/>
  <line x1="125" y1="92" x2="60" y2="95" stroke="#ffaa30" stroke-width="0.6" opacity="0.3"/>
  <line x1="125" y1="92" x2="190" y2="90" stroke="#ff8800" stroke-width="0.6" opacity="0.3"/>
  <line x1="125" y1="92" x2="90" y2="140" stroke="#e6591a" stroke-width="0.6" opacity="0.3"/>
  <line x1="125" y1="92" x2="160" y2="145" stroke="#ff8800" stroke-width="0.6" opacity="0.3"/>

  <!-- Tiny bright dots (sparks) -->
  <circle cx="95" cy="55" r="1" fill="#fff8e0" opacity="0.8" filter="url(#glowSpark)"/>
  <circle cx="155" cy="50" r="1" fill="#ffe060" opacity="0.7" filter="url(#glowSpark)"/>
  <circle cx="65" cy="120" r="0.8" fill="#ffaa30" opacity="0.6"/>
  <circle cx="180" cy="125" r="1" fill="#ff8800" opacity="0.5"/>

  <!-- Ground level dark shadow -->
  <ellipse cx="125" cy="105" rx="15" ry="3" fill="#000000" opacity="0.4"/>
</svg>