<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <radialGradient id="bgBurst" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3a0d0a"/>
      <stop offset="40%" stop-color="#1f0604"/>
      <stop offset="100%" stop-color="#080202"/>
    </radialGradient>
    <radialGradient id="burstCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="12%" stop-color="#fff8e0" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#ffe060" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffaa30" stop-opacity="0.5"/>
      <stop offset="72%" stop-color="#ff8800" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c41a05" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burstCoreInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#ffe060" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffaa30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayFire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c41a05" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bodyBurst" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="50%" stop-color="#1a0404"/>
      <stop offset="100%" stop-color="#0a0202"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBurst">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlowBurst">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="250" height="190" fill="url(#bgBurst)" rx="8"/>

  <!-- Outer burst glow (huge, behind everything) -->
  <ellipse cx="125" cy="95" rx="110" ry="95" fill="url(#burstCore)" opacity="0.25" filter="url(#bigGlowBurst)"/>

  <!-- Radiating burst rays (long, from body center) -->
  <path d="M 125 95 L 50 20" stroke="url(#rayFire)" stroke-width="3" opacity="0.4" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 20 50" stroke="url(#rayFire)" stroke-width="3.5" opacity="0.45" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 10 95" stroke="url(#rayFire)" stroke-width="3" opacity="0.4" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 20 140" stroke="url(#rayFire)" stroke-width="3.5" opacity="0.45" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 50 175" stroke="url(#rayFire)" stroke-width="3" opacity="0.4" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 125 180" stroke="url(#rayFire)" stroke-width="3" opacity="0.4" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 200 175" stroke="url(#rayFire)" stroke-width="3" opacity="0.4" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 230 140" stroke="url(#rayFire)" stroke-width="3.5" opacity="0.45" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 240 95" stroke="url(#rayFire)" stroke-width="3" opacity="0.4" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 230 50" stroke="url(#rayFire)" stroke-width="3.5" opacity="0.45" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 200 20" stroke="url(#rayFire)" stroke-width="3" opacity="0.4" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 125 10" stroke="url(#rayFire)" stroke-width="3" opacity="0.4" filter="url(#glowBurst)"/>

  <!-- Secondary thinner rays -->
  <path d="M 125 95 L 80 25" stroke="#ffe060" stroke-width="1.5" opacity="0.3" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 35 75" stroke="#ffaa30" stroke-width="1.5" opacity="0.3" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 35 115" stroke="#ffaa30" stroke-width="1.5" opacity="0.3" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 80 170" stroke="#ff8800" stroke-width="1.5" opacity="0.3" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 170 170" stroke="#ff8800" stroke-width="1.5" opacity="0.3" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 215 115" stroke="#ffaa30" stroke-width="1.5" opacity="0.3" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 215 75" stroke="#ffaa30" stroke-width="1.5" opacity="0.3" filter="url(#glowBurst)"/>
  <path d="M 125 95 L 170 25" stroke="#ffe060" stroke-width="1.5" opacity="0.3" filter="url(#glowBurst)"/>

  <!-- Body silhouette (center, bursting from within) -->
  <!-- Head -->
  <ellipse cx="125" cy="40" rx="12" ry="14" fill="url(#bodyBurst)"/>
  <!-- Neck -->
  <rect x="120" y="52" width="10" height="7" fill="url(#bodyBurst)"/>
  <!-- Torso -->
  <path d="M 108 58 Q 104 68 102 82 L 100 120 Q 100 130 105 135 L 145 135 Q 150 130 150 120 L 148 82 Q 146 68 142 58 Z"
        fill="url(#bodyBurst)"/>
  <!-- Left arm (outstretched) -->
  <path d="M 108 62 Q 95 58 82 52 Q 72 48 65 45 L 68 52 Q 78 56 88 60 Q 98 64 108 66 Z"
        fill="url(#bodyBurst)"/>
  <!-- Right arm (outstretched) -->
  <path d="M 142 62 Q 155 58 168 52 Q 178 48 185 45 L 182 52 Q 172 56 162 60 Q 152 64 142 66 Z"
        fill="url(#bodyBurst)"/>
  <!-- Left leg -->
  <path d="M 105 135 Q 100 150 96 168 L 108 170 Q 110 155 113 142 Z"
        fill="url(#bodyBurst)"/>
  <!-- Right leg -->
  <path d="M 145 135 Q 150 150 154 168 L 142 170 Q 140 155 137 142 Z"
        fill="url(#bodyBurst)"/>

  <!-- Mid burst glow (over body) -->
  <ellipse cx="125" cy="90" rx="45" ry="50" fill="url(#burstCore)" opacity="0.6" filter="url(#glowBurst)"/>

  <!-- Burst flame petals (from chest) -->
  <path d="M 108 85 Q 98 70 100 50 Q 95 35 100 20 Q 108 15 112 25 Q 108 40 110 55 Q 115 70 112 85 Z"
        fill="url(#burstCore)" opacity="0.6" filter="url(#glowBurst)"/>
  <path d="M 142 85 Q 152 70 150 50 Q 155 35 150 20 Q 142 15 138 25 Q 142 40 140 55 Q 135 70 138 85 Z"
        fill="url(#burstCore)" opacity="0.6" filter="url(#glowBurst)"/>
  <path d="M 115 88 Q 110 70 113 52 Q 115 40 120 30 Q 125 25 125 20 Q 125 25 130 30 Q 135 40 137 52 Q 140 70 135 88 Z"
        fill="url(#burstCore)" opacity="0.7" filter="url(#glowBurst)"/>

  <!-- Bright inner burst core (chest center) -->
  <ellipse cx="125" cy="90" rx="22" ry="25" fill="url(#burstCoreInner)" opacity="0.85" filter="url(#glowBurst)"/>
  <ellipse cx="125" cy="90" rx="10" ry="12" fill="#ffffff" opacity="0.9" filter="url(#glowBurst)"/>

  <!-- Bright crack nodes -->
  <circle cx="125" cy="40" r="3" fill="url(#emberGlow)" filter="url(#glowBurst)"/>
  <circle cx="108" cy="100" r="3" fill="url(#emberGlow)" filter="url(#glowBurst)"/>
  <circle cx="142" cy="100" r="3" fill="url(#emberGlow)" filter="url(#glowBurst)"/>
  <circle cx="125" cy="115" r="3" fill="url(#emberGlow)" filter="url(#glowBurst)"/>

  <!-- Embers flying outward (radial) -->
  <circle cx="55" cy="30" r="2.5" fill="#fff8e0" opacity="0.75" filter="url(#glowBurst)"/>
  <circle cx="35" cy="60" r="2" fill="#ffe060" opacity="0.65" filter="url(#glowBurst)"/>
  <circle cx="20" cy="95" r="1.5" fill="#ffaa30" opacity="0.55" filter="url(#glowBurst)"/>
  <circle cx="35" cy="130" r="2" fill="#ff8800" opacity="0.6" filter="url(#glowBurst)"/>
  <circle cx="55" cy="165" r="2.5" fill="#ffe060" opacity="0.65" filter="url(#glowBurst)"/>
  <circle cx="100" cy="180" r="2" fill="#ff8800" opacity="0.55" filter="url(#glowBurst)"/>
  <circle cx="150" cy="180" r="2.5" fill="#fff8e0" opacity="0.65" filter="url(#glowBurst)"/>
  <circle cx="195" cy="165" r="2" fill="#ffe060" opacity="0.6" filter="url(#glowBurst)"/>
  <circle cx="215" cy="130" r="1.5" fill="#ffaa30" opacity="0.55" filter="url(#glowBurst)"/>
  <circle cx="220" cy="95" r="2" fill="#ff8800" opacity="0.6" filter="url(#glowBurst)"/>
  <circle cx="205" cy="60" r="2.5" fill="#ffe060" opacity="0.65" filter="url(#glowBurst)"/>
  <circle cx="175" cy="30" r="2" fill="#fff8e0" opacity="0.6" filter="url(#glowBurst)"/>
  <circle cx="125" cy="12" r="1.5" fill="#ff8800" opacity="0.5" filter="url(#glowBurst)"/>

  <!-- Ember streaks -->
  <line x1="125" y1="90" x2="60" y2="25" stroke="#ffe060" stroke-width="0.8" opacity="0.35"/>
  <line x1="125" y1="90" x2="30" y2="60" stroke="#ffaa30" stroke-width="0.8" opacity="0.3"/>
  <line x1="125" y1="90" x2="60" y2="160" stroke="#ff8800" stroke-width="0.8" opacity="0.35"/>
  <line x1="125" y1="90" x2="190" y2="160" stroke="#ffaa30" stroke-width="0.8" opacity="0.35"/>
  <line x1="125" y1="90" x2="220" y2="60" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="125" y1="90" x2="125" y2="15" stroke="#ffe060" stroke-width="0.8" opacity="0.3"/>

  <!-- Small scattered embers -->
  <circle cx="75" cy="45" r="1" fill="#ff8800" opacity="0.4"/>
  <circle cx="50" cy="110" r="0.8" fill="#e6591a" opacity="0.35"/>
  <circle cx="80" cy="155" r="1" fill="#ffaa30" opacity="0.4"/>
  <circle cx="170" cy="155" r="1" fill="#ff8800" opacity="0.4"/>
  <circle cx="200" cy="110" r="0.8" fill="#e6591a" opacity="0.35"/>
  <circle cx="175" cy="45" r="1" fill="#ffaa30" opacity="0.4"/>

  <!-- Ground shadow/glow -->
  <ellipse cx="125" cy="173" rx="55" ry="6" fill="#8a2a05" opacity="0.3" filter="url(#glowBurst)"/>
</svg>
