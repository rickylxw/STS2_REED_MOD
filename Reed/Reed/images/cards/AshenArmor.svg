<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <radialGradient id="bgArmor" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#241c1a"/>
      <stop offset="40%" stop-color="#16100e"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>
    <linearGradient id="ashArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a605a"/>
      <stop offset="40%" stop-color="#4a423c"/>
      <stop offset="70%" stop-color="#332c27"/>
      <stop offset="100%" stop-color="#1f1814"/>
    </linearGradient>
    <linearGradient id="ashDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a322c"/>
      <stop offset="50%" stop-color="#251e1a"/>
      <stop offset="100%" stop-color="#15100d"/>
    </linearGradient>
    <radialGradient id="emberCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ff8800" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#c41a05" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5a1a05" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ashParticle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a807a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#4a423c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#251e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emberCrack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c41a05" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glowArmor">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlowArmor">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="250" height="190" fill="url(#bgArmor)" rx="8"/>

  <!-- Faint ember glow behind armor (residual heat) -->
  <ellipse cx="125" cy="100" rx="70" ry="85" fill="url(#emberCore)" opacity="0.2" filter="url(#bigGlowArmor)"/>

  <!-- Shield/armor aura -->
  <ellipse cx="125" cy="95" rx="78" ry="80" fill="none" stroke="#4a423c" stroke-width="1" opacity="0.3" filter="url(#glowArmor)"/>
  <ellipse cx="125" cy="95" rx="68" ry="70" fill="none" stroke="#5a504a" stroke-width="0.8" opacity="0.25" filter="url(#glowArmor)"/>

  <!-- Ash particles forming the armor (swirling around) -->
  <circle cx="55" cy="50" r="3" fill="url(#ashParticle)" opacity="0.6"/>
  <circle cx="40" cy="80" r="2.5" fill="url(#ashParticle)" opacity="0.55"/>
  <circle cx="35" cy="110" r="3" fill="url(#ashParticle)" opacity="0.5"/>
  <circle cx="45" cy="140" r="2.5" fill="url(#ashParticle)" opacity="0.55"/>
  <circle cx="60" cy="165" r="3" fill="url(#ashParticle)" opacity="0.5"/>
  <circle cx="195" cy="50" r="3" fill="url(#ashParticle)" opacity="0.6"/>
  <circle cx="210" cy="80" r="2.5" fill="url(#ashParticle)" opacity="0.55"/>
  <circle cx="215" cy="110" r="3" fill="url(#ashParticle)" opacity="0.5"/>
  <circle cx="205" cy="140" r="2.5" fill="url(#ashParticle)" opacity="0.55"/>
  <circle cx="190" cy="165" r="3" fill="url(#ashParticle)" opacity="0.5"/>

  <!-- Ash streaks (coalescing toward armor) -->
  <path d="M 40 60 Q 70 65 95 75" stroke="#5a504a" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 35 100 Q 65 100 95 100" stroke="#4a423c" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 45 140 Q 70 135 95 125" stroke="#5a504a" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 210 60 Q 180 65 155 75" stroke="#5a504a" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 215 100 Q 185 100 155 100" stroke="#4a423c" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 205 140 Q 180 135 155 125" stroke="#5a504a" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Shoulder pauldrons (ash-formed armor) -->
  <!-- Left pauldron -->
  <path d="M 95 65 Q 85 60 80 70 Q 78 80 88 85 Q 98 83 100 75 Z"
        fill="url(#ashArmor)" stroke="#2a221c" stroke-width="0.8"/>
  <path d="M 90 68 Q 85 72 87 80" stroke="#6a605a" stroke-width="0.8" fill="none" opacity="0.6"/>
  <!-- Right pauldron -->
  <path d="M 155 65 Q 165 60 170 70 Q 172 80 162 85 Q 152 83 150 75 Z"
        fill="url(#ashArmor)" stroke="#2a221c" stroke-width="0.8"/>
  <path d="M 160 68 Q 165 72 163 80" stroke="#6a605a" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Breastplate (central, ash-formed) -->
  <path d="M 95 75 Q 90 90 92 110 Q 95 125 105 132 L 145 132 Q 155 125 158 110 Q 160 90 155 75 Q 145 70 125 70 Q 105 70 95 75 Z"
        fill="url(#ashArmor)" stroke="#2a221c" stroke-width="1"/>

  <!-- Breastplate plates (segmented) -->
  <path d="M 100 85 Q 125 82 150 85" stroke="#2a221c" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M 98 100 Q 125 98 152 100" stroke="#2a221c" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M 100 115 Q 125 113 150 115" stroke="#2a221c" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- Central crest/gem on breastplate -->
  <path d="M 118 95 L 125 88 L 132 95 L 125 108 Z" fill="url(#ashDark)" stroke="#4a423c" stroke-width="0.8"/>
  <circle cx="125" cy="98" r="4" fill="url(#emberCore)" opacity="0.8" filter="url(#glowArmor)"/>
  <circle cx="125" cy="98" r="1.5" fill="#ffe060" opacity="0.8" filter="url(#glowArmor)"/>

  <!-- Ember cracks in armor (faint residual heat) -->
  <path d="M 105 90 Q 110 100 108 112" stroke="url(#emberCrack)" stroke-width="1" fill="none" opacity="0.5" filter="url(#glowArmor)"/>
  <path d="M 145 90 Q 140 100 142 112" stroke="url(#emberCrack)" stroke-width="1" fill="none" opacity="0.5" filter="url(#glowArmor)"/>
  <path d="M 115 78 L 118 88" stroke="url(#emberCrack)" stroke-width="0.8" fill="none" opacity="0.4" filter="url(#glowArmor)"/>
  <path d="M 135 78 L 132 88" stroke="url(#emberCrack)" stroke-width="0.8" fill="none" opacity="0.4" filter="url(#glowArmor)"/>
  <path d="M 100 120 Q 110 125 115 128" stroke="url(#emberCrack)" stroke-width="0.8" fill="none" opacity="0.4" filter="url(#glowArmor)"/>
  <path d="M 150 120 Q 140 125 135 128" stroke="url(#emberCrack)" stroke-width="0.8" fill="none" opacity="0.4" filter="url(#glowArmor)"/>

  <!-- Ember glow nodes (faint residual) -->
  <circle cx="108" cy="100" r="2.5" fill="url(#emberCore)" opacity="0.6" filter="url(#glowArmor)"/>
  <circle cx="142" cy="100" r="2.5" fill="url(#emberCore)" opacity="0.6" filter="url(#glowArmor)"/>
  <circle cx="110" cy="120" r="2" fill="url(#emberCore)" opacity="0.5" filter="url(#glowArmor)"/>
  <circle cx="140" cy="120" r="2" fill="url(#emberCore)" opacity="0.5" filter="url(#glowArmor)"/>

  <!-- Ash dust drifting (small particles) -->
  <circle cx="70" cy="40" r="1" fill="#6a605a" opacity="0.5"/>
  <circle cx="90" cy="35" r="0.8" fill="#4a423c" opacity="0.4"/>
  <circle cx="160" cy="35" r="1" fill="#6a605a" opacity="0.5"/>
  <circle cx="180" cy="40" r="0.8" fill="#4a423c" opacity="0.4"/>
  <circle cx="50" cy="160" r="1" fill="#6a605a" opacity="0.5"/>
  <circle cx="200" cy="160" r="1" fill="#6a605a" opacity="0.5"/>
  <circle cx="125" cy="155" r="0.8" fill="#4a423c" opacity="0.4"/>

  <!-- Faint ember sparks (very subtle) -->
  <circle cx="75" cy="75" r="1" fill="#ff8800" opacity="0.35" filter="url(#glowArmor)"/>
  <circle cx="175" cy="75" r="1" fill="#ff8800" opacity="0.35" filter="url(#glowArmor)"/>
  <circle cx="95" cy="130" r="0.8" fill="#e6591a" opacity="0.3" filter="url(#glowArmor)"/>
  <circle cx="155" cy="130" r="0.8" fill="#e6591a" opacity="0.3" filter="url(#glowArmor)"/>

  <!-- Ground ash shadow -->
  <ellipse cx="125" cy="172" rx="50" ry="5" fill="#1a1410" opacity="0.5" filter="url(#glowArmor)"/>
</svg>
