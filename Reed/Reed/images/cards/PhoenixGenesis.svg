<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1518"/>
      <stop offset="60%" stop-color="#1a0810"/>
      <stop offset="100%" stop-color="#0d0408"/>
    </radialGradient>
    <radialGradient id="rad4" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="15%" stop-color="#ffd040" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ff6020" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#c41a05" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5a1004" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lin5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd040"/>
      <stop offset="50%" stop-color="#ff6020"/>
      <stop offset="100%" stop-color="#c41a05"/>
    </linearGradient>
    <radialGradient id="ashGrad" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ccc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#666" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg3)" rx="8"/>

  <!-- 背景粒子 -->
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#c41a05" opacity="0.05"/>
  <circle cx="65.3" cy="78.2" r="2.0" fill="#ffd040" opacity="0.23"/>
  <circle cx="139.0" cy="70.8" r="2.0" fill="#c41a05" opacity="0.30" filter="url(#glow1)"/>
  <circle cx="209.5" cy="139.9" r="2.1" fill="#ff7a1a" opacity="0.60"/>
  <circle cx="73.9" cy="20.5" r="2.4" fill="#c41a05" opacity="0.59" filter="url(#glow1)"/>
  <circle cx="172.8" cy="83.6" r="0.8" fill="#ff6020" opacity="0.63" filter="url(#glow1)"/>
  <circle cx="125.3" cy="133.6" r="1.2" fill="#ff4400" opacity="0.55" filter="url(#glow1)"/>
  <circle cx="177.1" cy="59.2" r="0.9" fill="#ff6020" opacity="0.45"/>
  <circle cx="204.3" cy="117.9" r="1.2" fill="#ff4400" opacity="0.51" filter="url(#glow1)"/>
  <circle cx="162.8" cy="87.2" r="0.8" fill="#fff8e0" opacity="0.45"/>
  <circle cx="208.0" cy="36.6" r="0.6" fill="#ff4400" opacity="0.32" filter="url(#glow1)"/>
  <circle cx="164.1" cy="90.9" r="2.2" fill="#c41a05" opacity="0.64"/>

  <!-- 外圈光环 -->
  <circle cx="125" cy="95" r="65" fill="none" stroke="url(#lin5)" stroke-width="1.5" opacity="0.25" filter="url(#soft2)"/>
  <circle cx="125" cy="95" r="45" fill="none" stroke="url(#lin5)" stroke-width="1.0" opacity="0.20"/>

  <!-- 灰烬粒子背景 -->
  <ellipse cx="125" cy="130" rx="50" ry="15" fill="url(#ashGrad)" filter="url(#soft2)"/>

  <!-- 凤凰翅膀 - 左翼 -->
  <path d="M 125 95 Q 95 75 75 55 Q 80 70 88 85 Q 72 80 60 95 Q 80 95 95 100 Q 80 110 72 125 Q 90 115 105 110 Q 100 120 95 135 Q 110 120 120 110 Z" fill="#ff6020" opacity="0.4" filter="url(#glow1)"/>
  <path d="M 125 95 Q 100 80 85 65 Q 88 78 93 88 Q 82 85 72 92 Q 85 93 95 98 Q 85 105 78 115 Q 92 110 103 108 Q 100 116 97 125 Q 108 118 118 112 Z" fill="#ffd040" opacity="0.3" filter="url(#glow1)"/>

  <!-- 凤凰翅膀 - 右翼 -->
  <path d="M 125 95 Q 155 75 175 55 Q 170 70 162 85 Q 178 80 190 95 Q 170 95 155 100 Q 170 110 178 125 Q 160 115 145 110 Q 150 120 155 135 Q 140 120 130 110 Z" fill="#ff6020" opacity="0.4" filter="url(#glow1)"/>
  <path d="M 125 95 Q 150 80 165 65 Q 162 78 157 88 Q 168 85 178 92 Q 165 93 155 98 Q 165 105 172 115 Q 158 110 147 108 Q 150 116 153 125 Q 142 118 132 112 Z" fill="#ffd040" opacity="0.3" filter="url(#glow1)"/>

  <!-- 凤凰身体 -->
  <ellipse cx="125" cy="95" rx="15" ry="25" fill="url(#rad4)" filter="url(#soft2)"/>

  <!-- 凤凰头部光球 -->
  <circle cx="125" cy="75" r="12" fill="url(#rad4)" filter="url(#soft2)"/>
  <circle cx="125" cy="75" r="7" fill="#ffd040" opacity="0.7" filter="url(#glow1)"/>
  <circle cx="125" cy="75" r="3" fill="#ffffff" opacity="0.95"/>

  <!-- 凤凰尾羽 -->
  <path d="M 125 120 Q 115 140 108 155 Q 118 145 123 135 Q 121 150 125 160 Q 129 150 127 135 Q 132 145 142 155 Q 135 140 125 120 Z" fill="#ff6020" opacity="0.5" filter="url(#glow1)"/>
  <path d="M 125 120 Q 120 135 116 148 Q 122 140 124 130 Q 126 140 128 148 Q 134 140 134 135 Q 130 125 125 120 Z" fill="#ffd040" opacity="0.4" filter="url(#glow1)"/>

  <!-- 灰烬粒子散落 -->
  <circle cx="80" cy="140" r="1.5" fill="#aaa" opacity="0.4"/>
  <circle cx="170" cy="145" r="1.2" fill="#999" opacity="0.35"/>
  <circle cx="100" cy="160" r="1.0" fill="#bbb" opacity="0.3"/>
  <circle cx="150" cy="155" r="1.3" fill="#888" opacity="0.4"/>
  <circle cx="120" cy="170" r="0.8" fill="#aaa" opacity="0.25"/>
  <circle cx="65" cy="120" r="1.0" fill="#999" opacity="0.3"/>
  <circle cx="185" cy="125" r="1.1" fill="#aaa" opacity="0.35"/>

  <!-- 连接线 -->
  <line x1="125.0" y1="75.0" x2="152.5" y2="77.8" stroke="#ffcc40" stroke-width="1.0" opacity="0.71" filter="url(#glow1)"/>
  <line x1="125.0" y1="75.0" x2="146.4" y2="93.4" stroke="#ffcc40" stroke-width="0.7" opacity="0.90" filter="url(#glow1)"/>
  <line x1="125.0" y1="75.0" x2="103.6" y2="93.4" stroke="#fff8e0" stroke-width="0.7" opacity="0.80" filter="url(#glow1)"/>
  <line x1="125.0" y1="75.0" x2="97.5" y2="77.8" stroke="#ffcc40" stroke-width="1.0" opacity="0.71" filter="url(#glow1)"/>
  <line x1="125.0" y1="75.0" x2="110.4" y2="72.9" stroke="#fff8e0" stroke-width="1.8" opacity="0.55" filter="url(#glow1)"/>
  <line x1="125.0" y1="75.0" x2="139.6" y2="72.9" stroke="#fff8e0" stroke-width="1.8" opacity="0.55" filter="url(#glow1)"/>
</svg>
