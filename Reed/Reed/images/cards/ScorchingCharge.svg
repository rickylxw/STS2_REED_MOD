<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <radialGradient id="bgCharge" cx="65%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2e1410"/>
      <stop offset="40%" stop-color="#1a0a06"/>
      <stop offset="100%" stop-color="#070302"/>
    </radialGradient>
    <radialGradient id="flameTrail" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#ffe060" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#ff8800" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#e6591a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyCharge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0d08"/>
      <stop offset="50%" stop-color="#0c0503"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>
    <linearGradient id="edgeFire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c41a05"/>
      <stop offset="40%" stop-color="#ff8800"/>
      <stop offset="70%" stop-color="#ffe060"/>
      <stop offset="100%" stop-color="#fff8e0"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowCharge">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlowCharge">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="250" height="190" fill="url(#bgCharge)" rx="8"/>

  <!-- Flame trail glow (behind everything) -->
  <ellipse cx="90" cy="95" rx="90" ry="55" fill="url(#flameTrail)" opacity="0.35" filter="url(#bigGlowCharge)"/>

  <!-- Flame trail streaks (flowing left from warrior) -->
  <path d="M 130 70 Q 100 65 70 75 Q 40 80 15 90 Q 40 88 70 85 Q 100 82 130 80 Z"
        fill="url(#flameTrail)" opacity="0.5" filter="url(#glowCharge)"/>
  <path d="M 135 100 Q 100 100 60 105 Q 30 108 10 110 Q 35 105 65 100 Q 100 95 135 95 Z"
        fill="url(#flameTrail)" opacity="0.6" filter="url(#glowCharge)"/>
  <path d="M 130 120 Q 100 125 70 130 Q 45 135 20 140 Q 50 132 80 125 Q 105 120 130 118 Z"
        fill="url(#flameTrail)" opacity="0.45" filter="url(#glowCharge)"/>

  <!-- Flame tongues trailing -->
  <path d="M 120 60 Q 95 50 70 55 Q 50 60 35 70 Q 55 58 78 55 Q 100 52 120 55 Z"
        fill="#ff8800" opacity="0.4" filter="url(#glowCharge)"/>
  <path d="M 125 135 Q 100 145 75 150 Q 55 153 35 150 Q 60 145 85 142 Q 105 138 125 138 Z"
        fill="#e6591a" opacity="0.35" filter="url(#glowCharge)"/>

  <!-- Speed lines (motion) -->
  <line x1="150" y1="40" x2="30" y2="40" stroke="#ff8800" stroke-width="1.2" opacity="0.3" filter="url(#glowCharge)"/>
  <line x1="160" y1="55" x2="20" y2="55" stroke="#ffaa30" stroke-width="1" opacity="0.25" filter="url(#glowCharge)"/>
  <line x1="150" y1="140" x2="20" y2="140" stroke="#ff8800" stroke-width="1.2" opacity="0.3" filter="url(#glowCharge)"/>
  <line x1="160" y1="155" x2="35" y2="155" stroke="#e6591a" stroke-width="1" opacity="0.25" filter="url(#glowCharge)"/>

  <!-- Warrior silhouette (charging right, leaning forward) -->
  <!-- Head (forward, tilted) -->
  <ellipse cx="178" cy="62" rx="11" ry="13" fill="url(#bodyCharge)" transform="rotate(-15 178 62)"/>

  <!-- Neck -->
  <rect x="173" y="73" width="9" height="7" fill="url(#bodyCharge)" transform="rotate(-15 177 76)"/>

  <!-- Torso (leaning forward) -->
  <path d="M 165 78 Q 158 88 150 100 Q 145 110 148 120 L 175 125 Q 182 115 185 100 Q 184 88 180 80 Z"
        fill="url(#bodyCharge)"/>

  <!-- Leading arm (extended forward-right) -->
  <path d="M 180 82 Q 192 78 205 72 Q 215 70 222 68 L 220 75 Q 212 78 202 82 Q 192 86 183 90 Z"
        fill="url(#bodyCharge)"/>

  <!-- Back arm (pumping back) -->
  <path d="M 165 85 Q 155 90 145 98 Q 138 103 133 108 L 140 112 Q 148 108 155 102 Q 162 95 168 92 Z"
        fill="url(#bodyCharge)"/>

  <!-- Leading leg (extended forward, charging stride) -->
  <path d="M 172 122 Q 180 130 192 138 Q 200 144 208 148 L 205 155 Q 195 152 185 145 Q 175 138 168 130 Z"
        fill="url(#bodyCharge)"/>

  <!-- Back leg (pushing off) -->
  <path d="M 150 122 Q 142 135 135 150 Q 132 160 130 168 L 140 170 Q 143 158 148 148 Q 153 138 158 130 Z"
        fill="url(#bodyCharge)"/>

  <!-- Fire edge along leading side of warrior (where air friction ignites) -->
  <path d="M 222 68 Q 215 78 205 82 Q 200 88 195 95 Q 192 102 188 110 Q 185 118 180 125"
        stroke="url(#edgeFire)" stroke-width="2" fill="none" opacity="0.8" filter="url(#glowCharge)"/>
  <path d="M 205 72 Q 210 82 205 90 Q 202 100 198 110"
        stroke="#ffe060" stroke-width="1.2" fill="none" opacity="0.6" filter="url(#glowCharge)"/>

  <!-- Fire on back leg trailing -->
  <path d="M 140 170 Q 145 160 150 150 Q 155 140 160 130"
        stroke="url(#edgeFire)" stroke-width="1.5" fill="none" opacity="0.5" filter="url(#glowCharge)"/>

  <!-- Bright crack nodes on body -->
  <circle cx="180" cy="65" r="3" fill="url(#emberGlow)" filter="url(#glowCharge)"/>
  <circle cx="180" cy="65" r="1.2" fill="#fff8e0" filter="url(#glowCharge)"/>
  <circle cx="170" cy="100" r="3" fill="url(#emberGlow)" filter="url(#glowCharge)"/>
  <circle cx="195" cy="78" r="2.5" fill="url(#emberGlow)" filter="url(#glowCharge)"/>

  <!-- Trailing embers flowing left -->
  <circle cx="50" cy="65" r="2" fill="#fff8e0" opacity="0.7" filter="url(#glowCharge)"/>
  <circle cx="35" cy="80" r="1.5" fill="#ffe060" opacity="0.6" filter="url(#glowCharge)"/>
  <circle cx="25" cy="95" r="1.2" fill="#ffaa30" opacity="0.5" filter="url(#glowCharge)"/>
  <circle cx="40" cy="110" r="1.5" fill="#ff8800" opacity="0.55" filter="url(#glowCharge)"/>
  <circle cx="55" cy="125" r="2" fill="#ffe060" opacity="0.6" filter="url(#glowCharge)"/>
  <circle cx="70" cy="138" r="1.5" fill="#ff8800" opacity="0.5" filter="url(#glowCharge)"/>
  <circle cx="45" cy="145" r="1.2" fill="#e6591a" opacity="0.4" filter="url(#glowCharge)"/>

  <!-- Ember trails (streaks flowing backward) -->
  <line x1="170" y1="65" x2="60" y2="55" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="170" y1="100" x2="40" y2="100" stroke="#ffaa30" stroke-width="0.8" opacity="0.25"/>
  <line x1="165" y1="125" x2="55" y2="130" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>

  <!-- Small scattered embers -->
  <circle cx="80" cy="60" r="1" fill="#ff8800" opacity="0.4"/>
  <circle cx="60" cy="85" r="0.8" fill="#e6591a" opacity="0.35"/>
  <circle cx="65" cy="115" r="1" fill="#ffaa30" opacity="0.4"/>
  <circle cx="85" cy="135" r="0.8" fill="#ff8800" opacity="0.35"/>

  <!-- Forward flame burst (front of charge) -->
  <path d="M 225 65 Q 232 70 240 75 Q 235 80 228 78 Q 230 72 225 70 Z"
        fill="url(#flameTrail)" opacity="0.6" filter="url(#glowCharge)"/>

  <!-- Ground shadow/glow -->
  <ellipse cx="140" cy="172" rx="55" ry="5" fill="#8a2a05" opacity="0.3" filter="url(#glowCharge)"/>
</svg>
