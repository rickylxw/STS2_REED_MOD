<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="50%" stop-color="#5a3a2a"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
    <linearGradient id="lin5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a2a05" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#e6591a" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ff8800" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe060" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg3)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.06"/>
  <circle cx="49.8" cy="28.7" r="0.5" fill="#ff8800" opacity="0.26" filter="url(#glow1)"/>
  <circle cx="58.6" cy="103.9" r="1.9" fill="#ff7a1a" opacity="0.48" filter="url(#glow1)"/>
  <circle cx="121.9" cy="42.2" r="1.9" fill="#ff6600" opacity="0.24"/>
  <circle cx="75.1" cy="42.3" r="2.4" fill="#e6591a" opacity="0.67" filter="url(#glow1)"/>
  <circle cx="124.9" cy="163.8" r="1.2" fill="#ff8800" opacity="0.36"/>
  <circle cx="185.8" cy="28.6" r="0.7" fill="#ff8800" opacity="0.65" filter="url(#glow1)"/>
  <circle cx="107.8" cy="13.5" r="2.3" fill="#fff8e0" opacity="0.28"/>
  <circle cx="180.6" cy="14.5" r="0.9" fill="#fff8e0" opacity="0.31" filter="url(#glow1)"/>
  <circle cx="98.7" cy="99.3" r="1.4" fill="#c41a05" opacity="0.45" filter="url(#glow1)"/>
  <circle cx="154.6" cy="77.1" r="0.7" fill="#ffe060" opacity="0.44" filter="url(#glow1)"/>
  <!-- Pyre logs -->
  <rect x="60" y="140" width="130" height="12" fill="url(#lin4)" rx="3" transform="rotate(-15 125 145)"/>
  <rect x="60" y="140" width="130" height="12" fill="url(#lin4)" rx="3" transform="rotate(0 125 145)"/>
  <rect x="60" y="140" width="130" height="12" fill="url(#lin4)" rx="3" transform="rotate(15 125 145)"/>
  <!-- Flames rising from pyre -->
  <path d="M 80.0 145.0 Q 65.8 125.0 72.8 109.0 Q 77.0 93.0 76.6 65.0 Q 83.0 89.0 86.4 101.0 Q 98.9 121.0 80.0 145.0 Z" fill="#ff8800" opacity="0.7" filter="url(#glow1)"/>
  <path d="M 100.0 145.0 Q 82.0 120.0 91.6 100.0 Q 96.4 80.0 103.3 45.0 Q 103.6 75.0 104.1 90.0 Q 118.5 115.0 100.0 145.0 Z" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
  <path d="M 125.0 145.0 Q 105.0 115.0 119.1 91.0 Q 120.6 67.0 125.4 25.0 Q 129.4 61.0 132.1 79.0 Q 149.0 109.0 125.0 145.0 Z" fill="#ff8800" opacity="0.8" filter="url(#glow1)"/>
  <path d="M 150.0 145.0 Q 129.7 120.0 146.0 100.0 Q 146.4 80.0 146.6 45.0 Q 153.6 75.0 157.2 90.0 Q 166.4 115.0 150.0 145.0 Z" fill="#e6591a" opacity="0.6" filter="url(#glow1)"/>
  <path d="M 170.0 145.0 Q 156.5 125.0 167.2 109.0 Q 167.0 93.0 173.2 65.0 Q 173.0 89.0 174.1 101.0 Q 187.1 121.0 170.0 145.0 Z" fill="#ff8800" opacity="0.7" filter="url(#glow1)"/>
  <!-- White-hot core -->
  <path d="M 125.0 145.0 Q 113.8 125.0 120.0 109.0 Q 123.0 93.0 124.6 65.0 Q 127.0 89.0 130.0 101.0 Q 133.7 121.0 125.0 145.0 Z" fill="#fff8e0" opacity="0.5" filter="url(#glow1)"/>
  <!-- Smoke rising -->
  <path d="M 90 60 Q 98 40 90 20 Q 82 10 90 0" stroke="#3a1f15" stroke-width="2" fill="none" opacity="0.2" filter="url(#soft2)"/>
  <path d="M 125 60 Q 133 40 125 20 Q 117 10 125 0" stroke="#3a1f15" stroke-width="2" fill="none" opacity="0.2" filter="url(#soft2)"/>
  <path d="M 160 60 Q 168 40 160 20 Q 152 10 160 0" stroke="#3a1f15" stroke-width="2" fill="none" opacity="0.2" filter="url(#soft2)"/>
  <!-- Ground scorch -->
  <ellipse cx="125" cy="155" rx="80" ry="6" fill="#8a2a05" opacity="0.4"/>
</svg>
