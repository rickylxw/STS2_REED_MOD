<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <radialGradient id="rad4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d0604" stop-opacity="0"/>
      <stop offset="55%" stop-color="#0d0604" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ff8800" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#c41a05" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg3)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.05"/>
  <!-- Expanding hollow blast ring -->
  <circle cx="125" cy="95" r="62" fill="url(#rad4)" filter="url(#glow1)"/>
  <circle cx="125" cy="95" r="46" fill="none" stroke="#ff8800" stroke-width="3" opacity="0.7" filter="url(#glow1)"/>
  <circle cx="125" cy="95" r="58" fill="none" stroke="#e6591a" stroke-width="2.5" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="125" cy="95" r="70" fill="none" stroke="#c41a05" stroke-width="2" opacity="0.3" filter="url(#glow1)"/>
  <circle cx="125" cy="95" r="82" fill="none" stroke="#8a2a05" stroke-width="1.5" opacity="0.18" filter="url(#glow1)"/>
  <!-- Outward streaks: force blowing away from center -->
  <line x1="136.5" y1="42.0" x2="143.2" y2="10.7" stroke="#e6591a" stroke-width="1.8" opacity="0.35" filter="url(#glow1)"/>
  <line x1="85.2" y1="139.8" x2="67.0" y2="160.3" stroke="#e6591a" stroke-width="1.3" opacity="0.55" filter="url(#glow1)"/>
  <line x1="111.6" y1="147.8" x2="105.7" y2="170.9" stroke="#e6591a" stroke-width="1.0" opacity="0.56" filter="url(#glow1)"/>
  <line x1="71.6" y1="100.0" x2="43.5" y2="102.6" stroke="#e6591a" stroke-width="1.6" opacity="0.47" filter="url(#glow1)"/>
  <line x1="77.1" y1="70.2" x2="53.4" y2="58.0" stroke="#e6591a" stroke-width="2.1" opacity="0.57" filter="url(#glow1)"/>
  <line x1="158.4" y1="54.6" x2="173.5" y2="36.3" stroke="#e6591a" stroke-width="1.7" opacity="0.35" filter="url(#glow1)"/>
  <line x1="82.5" y1="132.7" x2="67.2" y2="146.2" stroke="#e6591a" stroke-width="1.8" opacity="0.43" filter="url(#glow1)"/>
  <line x1="158.4" y1="54.9" x2="179.2" y2="30.0" stroke="#e6591a" stroke-width="1.2" opacity="0.52" filter="url(#glow1)"/>
  <line x1="96.1" y1="145.5" x2="85.8" y2="163.6" stroke="#e6591a" stroke-width="1.1" opacity="0.37" filter="url(#glow1)"/>
  <line x1="125.3" y1="149.9" x2="125.4" y2="172.6" stroke="#e6591a" stroke-width="2.0" opacity="0.39" filter="url(#glow1)"/>
  <line x1="89.8" y1="49.6" x2="76.3" y2="32.1" stroke="#e6591a" stroke-width="1.9" opacity="0.31" filter="url(#glow1)"/>
  <line x1="74.0" y1="68.6" x2="51.7" y2="57.1" stroke="#e6591a" stroke-width="1.2" opacity="0.42" filter="url(#glow1)"/>
  <line x1="91.4" y1="51.5" x2="79.5" y2="36.0" stroke="#e6591a" stroke-width="2.1" opacity="0.31" filter="url(#glow1)"/>
  <line x1="120.9" y1="44.3" x2="118.4" y2="13.6" stroke="#e6591a" stroke-width="1.4" opacity="0.48" filter="url(#glow1)"/>
  <line x1="116.8" y1="37.7" x2="112.6" y2="9.1" stroke="#e6591a" stroke-width="1.5" opacity="0.51" filter="url(#glow1)"/>
  <line x1="86.1" y1="138.9" x2="67.7" y2="159.8" stroke="#e6591a" stroke-width="2.2" opacity="0.40" filter="url(#glow1)"/>
  <!-- Hollow dark center (the counter being consumed) -->
  <circle cx="125" cy="95" r="34" fill="#0d0604" opacity="0.85"/>
  <circle cx="125" cy="95" r="30" fill="#1a0d08" opacity="0.9"/>
  <!-- Faint inward-sucked embers at rim -->
  <circle cx="147.6" cy="59.5" r="1.9" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="153.8" cy="121.8" r="1.8" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="169.1" cy="96.8" r="1.8" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="88.5" cy="68.2" r="1.3" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="164.4" cy="92.6" r="1.3" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="96.9" cy="130.2" r="1.8" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="165.5" cy="98.4" r="1.9" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="89.2" cy="75.6" r="1.6" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="83.0" cy="89.8" r="1.3" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="92.6" cy="72.0" r="1.3" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <ellipse cx="125.0" cy="178.0" rx="55.0" ry="8.0" fill="#8a2a05" opacity="0.2" filter="url(#soft2)"/>
</svg>
