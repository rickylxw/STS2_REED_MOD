<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg2" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2a05" stop-opacity="0"/>
      <stop offset="40%" stop-color="#e6591a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2a05" stop-opacity="0"/>
      <stop offset="40%" stop-color="#c41a05" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe060" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lin5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2a05" stop-opacity="0"/>
      <stop offset="40%" stop-color="#e6591a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffaa30" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="rad6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffe060" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ff8800" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg2)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.04"/>
  <circle cx="108.9" cy="59.3" r="1.7" fill="#ff6600" opacity="0.68" filter="url(#glow1)"/>
  <circle cx="235.2" cy="127.0" r="2.1" fill="#ff7a1a" opacity="0.39"/>
  <circle cx="160.8" cy="106.8" r="1.9" fill="#ffcc40" opacity="0.35" filter="url(#glow1)"/>
  <circle cx="174.2" cy="114.2" r="1.8" fill="#ff6600" opacity="0.62" filter="url(#glow1)"/>
  <circle cx="132.3" cy="59.7" r="1.9" fill="#ff6600" opacity="0.67" filter="url(#glow1)"/>
  <circle cx="141.3" cy="36.7" r="1.1" fill="#ff8800" opacity="0.52" filter="url(#glow1)"/>
  <circle cx="33.0" cy="135.1" r="2.5" fill="#fff8e0" opacity="0.55" filter="url(#glow1)"/>
  <circle cx="80.7" cy="113.4" r="2.2" fill="#ff8800" opacity="0.57" filter="url(#glow1)"/>
  <!-- Three converging streams -->
  <path d="M 10 30 Q 80 50 125 90" fill="none" stroke="url(#lin3)" stroke-width="8" filter="url(#glow1)"/>
  <path d="M 10 95 Q 80 95 125 95" fill="none" stroke="url(#lin4)" stroke-width="8" filter="url(#glow1)"/>
  <path d="M 10 160 Q 80 140 125 100" fill="none" stroke="url(#lin5)" stroke-width="8" filter="url(#glow1)"/>
  <!-- Convergence point -->
  <circle cx="125" cy="95" r="25" fill="url(#rad6)" filter="url(#glow1)"/>
  <circle cx="125" cy="95" r="8" fill="#fff8e0" opacity="0.9"/>
  <line x1="125.0" y1="95.0" x2="156.4" y2="92.1" stroke="#ffe060" stroke-width="1.1" opacity="0.43" filter="url(#glow1)"/>
  <line x1="125.0" y1="95.0" x2="104.7" y2="90.9" stroke="#ff8800" stroke-width="1.2" opacity="0.66" filter="url(#glow1)"/>
  <line x1="125.0" y1="95.0" x2="114.2" y2="70.1" stroke="#ffe060" stroke-width="1.6" opacity="0.73" filter="url(#glow1)"/>
  <line x1="125.0" y1="95.0" x2="162.6" y2="89.6" stroke="#ffcc40" stroke-width="1.1" opacity="0.57" filter="url(#glow1)"/>
  <line x1="125.0" y1="95.0" x2="139.2" y2="128.8" stroke="#ffcc40" stroke-width="1.1" opacity="0.48"/>
  <line x1="125.0" y1="95.0" x2="110.5" y2="82.1" stroke="#ffe060" stroke-width="0.8" opacity="0.81"/>
  <line x1="125.0" y1="95.0" x2="123.3" y2="112.5" stroke="#fff8e0" stroke-width="1.3" opacity="0.41"/>
  <line x1="125.0" y1="95.0" x2="164.4" y2="98.5" stroke="#ff8800" stroke-width="0.8" opacity="0.78" filter="url(#glow1)"/>
  <line x1="125.0" y1="95.0" x2="139.6" y2="79.2" stroke="#ff8800" stroke-width="1.4" opacity="0.76"/>
  <line x1="125.0" y1="95.0" x2="124.1" y2="111.8" stroke="#fff8e0" stroke-width="1.7" opacity="0.70"/>
  <line x1="125.0" y1="95.0" x2="113.8" y2="80.4" stroke="#ffcc40" stroke-width="1.0" opacity="0.85" filter="url(#glow1)"/>
  <line x1="125.0" y1="95.0" x2="107.1" y2="88.3" stroke="#fff8e0" stroke-width="1.4" opacity="0.72" filter="url(#glow1)"/>
  <!-- Stream embers -->
  <circle cx="40" cy="38" r="1.5" fill="#ff8800" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="70" cy="48" r="1.5" fill="#ffaa30" opacity="0.4" filter="url(#glow1)"/>
  <circle cx="40" cy="95" r="1.5" fill="#ffe060" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="70" cy="95" r="1.5" fill="#ff8800" opacity="0.4" filter="url(#glow1)"/>
  <circle cx="40" cy="158" r="1.5" fill="#ffaa30" opacity="0.5" filter="url(#glow1)"/>
  <circle cx="70" cy="142" r="1.5" fill="#e6591a" opacity="0.4" filter="url(#glow1)"/>
</svg>
