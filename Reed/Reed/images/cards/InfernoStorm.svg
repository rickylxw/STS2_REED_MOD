<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
<defs>
  <radialGradient id='bgIS' cx='50%' cy='45%' r='70%'>
    <stop offset='0%' stop-color='#3a1810'/>
    <stop offset='40%' stop-color='#2a1815'/>
    <stop offset='100%' stop-color='#1a0d08'/>
  </radialGradient>
  <radialGradient id='emberGlowIS' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#ffe060' stop-opacity='1'/>
    <stop offset='40%' stop-color='#ff8800' stop-opacity='0.6'/>
    <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
  </radialGradient>
  <linearGradient id='funnelIS' x1='0%' y1='0%' x2='0%' y2='100%'>
    <stop offset='0%' stop-color='#ff8800' stop-opacity='0.3'/>
    <stop offset='30%' stop-color='#e6591a' stop-opacity='0.5'/>
    <stop offset='60%' stop-color='#ff8800' stop-opacity='0.7'/>
    <stop offset='85%' stop-color='#ffaa30' stop-opacity='0.9'/>
    <stop offset='100%' stop-color='#ffe060' stop-opacity='1'/>
  </linearGradient>
  <radialGradient id='flameGIS' cx='50%' cy='40%' r='60%'>
    <stop offset='0%' stop-color='#fff8e0' stop-opacity='0.9'/>
    <stop offset='20%' stop-color='#ffe060' stop-opacity='0.8'/>
    <stop offset='45%' stop-color='#ffaa30' stop-opacity='0.7'/>
    <stop offset='70%' stop-color='#ff8800' stop-opacity='0.5'/>
    <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
  </radialGradient>
  <radialGradient id='glowIS' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#ff8800' stop-opacity='0.5'/>
    <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
  </radialGradient>
  <radialGradient id='bigGlowIS' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#ffaa30' stop-opacity='0.3'/>
    <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
  </radialGradient>
  <filter id='blurIS' x='-20%' y='-20%' width='140%' height='140%'>
    <feGaussianBlur stdDeviation='3'/>
  </filter>
  <filter id='bigBlurIS' x='-30%' y='-30%' width='160%' height='160%'>
    <feGaussianBlur stdDeviation='8'/>
  </filter>
</defs>

<!-- Background -->
<rect width='250' height='190' fill='url(#bgIS)' rx='8'/>

<!-- Outer ambient glow -->
<ellipse cx='125' cy='100' rx='100' ry='85' fill='url(#bigGlowIS)'/>

<!-- Ground fire glow at base -->
<ellipse cx='125' cy='175' rx='90' ry='25' fill='url(#glowIS)' opacity='0.8'/>

<!-- Top fire cloud -->
<ellipse cx='125' cy='25' rx='70' ry='30' fill='url(#flameGIS)' opacity='0.5' filter='url(#blurIS)'/>
<ellipse cx='100' cy='28' rx='35' ry='20' fill='#c41a05' opacity='0.3' filter='url(#blurIS)'/>
<ellipse cx='150' cy='30' rx='30' ry='18' fill='#8a2a05' opacity='0.35' filter='url(#blurIS)'/>

<!-- Funnel column - outer widest layer -->
<path d='M 60 35 Q 65 80 55 110 Q 48 140 70 170 Q 100 180 125 178 Q 150 180 180 170 Q 202 140 195 110 Q 185 80 190 35 Q 160 50 125 45 Q 90 50 60 35 Z' fill='url(#funnelIS)' opacity='0.5' filter='url(#blurIS)'/>

