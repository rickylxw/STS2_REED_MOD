<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgEF' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <radialGradient id='eternalFlame' cx='50%' cy='60%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='20%' stop-color='#ffe060'/>
      <stop offset='50%' stop-color='#ff8800'/>
      <stop offset='80%' stop-color='#c41a05' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='flameBody' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#ff8800'/>
      <stop offset='40%' stop-color='#ffaa30'/>
      <stop offset='70%' stop-color='#ffe060'/>
      <stop offset='100%' stop-color='#fff8e0'/>
    </linearGradient>
    <radialGradient id='impactEF' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0' stop-opacity='0.9'/>
      <stop offset='20%' stop-color='#ffe060' stop-opacity='0.5'/>
      <stop offset='50%' stop-color='#ff8800' stop-opacity='0.2'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowEF'>
      <feGaussianBlur stdDeviation='4' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='softEF'>
      <feGaussianBlur stdDeviation='8' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='bigSoftEF'>
      <feGaussianBlur stdDeviation='12' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>

  <rect width='250' height='190' fill='url(#bgEF)' rx='8'/>

  <!-- Atmospheric heat haze layers -->
  <ellipse cx='125' cy='95' rx='120' ry='80' fill='#e6591a' opacity='0.05' filter='url(#bigSoftEF)'/>
  <ellipse cx='125' cy='30' rx='80' ry='20' fill='#ff8800' opacity='0.04'/>
  <ellipse cx='125' cy='160' rx='80' ry='20' fill='#c41a05' opacity='0.04'/>

  <!-- eternal flame aura -->
  <ellipse cx='125' cy='100' rx='80' ry='100' fill='url(#eternalFlame)' filter='url(#softEF)' opacity='0.5'/>

  <!-- Background ember particles -->
  <circle cx='30' cy='35' r='1.5' fill='#ff8800' opacity='0.5' filter='url(#glowEF)'/>
  <circle cx='55' cy='20' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='200' cy='30' r='1.2' fill='#ff8800' opacity='0.5'/>
  <circle cx='220' cy='60' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='15' cy='90' r='1' fill='#e6591a' opacity='0.3'/>
  <circle cx='235' cy='100' r='1' fill='#ff8800' opacity='0.3'/>
  <circle cx='20' cy='160' r='1' fill='#c41a05' opacity='0.3'/>
  <circle cx='225' cy='165' r='1' fill='#e6591a' opacity='0.3'/>
  <circle cx='90' cy='15' r='0.8' fill='#ffe060' opacity='0.4'/>
  <circle cx='160' cy='15' r='0.8' fill='#ffe060' opacity='0.4'/>
  <circle cx='45' cy='170' r='0.8' fill='#c41a05' opacity='0.25'/>
  <circle cx='205' cy='170' r='0.8' fill='#e6591a' opacity='0.25'/>

  <!-- Motion lines (energy rising, eternal cycle) -->
  <line x1='80' y1='165' x2='75' y2='110' stroke='#e6591a' stroke-width='1' opacity='0.2'/>
  <line x1='170' y1='165' x2='175' y2='110' stroke='#e6591a' stroke-width='1' opacity='0.2'/>
  <line x1='65' y1='145' x2='60' y2='90' stroke='#ff8800' stroke-width='0.8' opacity='0.15'/>
  <line x1='185' y1='145' x2='190' y2='90' stroke='#ff8800' stroke-width='0.8' opacity='0.15'/>
  <line x1='50' y1='120' x2='45' y2='65' stroke='#ffaa30' stroke-width='0.8' opacity='0.15'/>
  <line x1='200' y1='120' x2='205' y2='65' stroke='#ffaa30' stroke-width='0.8' opacity='0.15'/>

  <!-- protective ring (never extinguishes) -->
  <circle cx='125' cy='95' r='70' fill='none' stroke='#ff8800' stroke-width='1' stroke-dasharray='3 4' opacity='0.4' filter='url(#glowEF)'/>
  <circle cx='125' cy='95' r='80' fill='none' stroke='#e6591a' stroke-width='0.8' stroke-dasharray='2 6' opacity='0.3'/>

  <!-- central eternal flame -->
  <g filter='url(#glowEF)'>
    <!-- outer flame -->
    <path d='M 95 170 Q 85 130 90 90 Q 80 50 95 20 Q 105 5 115 15 Q 110 40 105 65 Q 115 40 118 15 Q 120 5 122 15 Q 120 40 118 65 Q 122 40 125 15 Q 128 40 132 65 Q 130 40 128 15 Q 130 5 132 15 Q 135 40 145 65 Q 140 40 135 15 Q 145 5 155 20 Q 170 50 160 90 Q 165 130 155 170 Z'
          fill='url(#flameBody)' opacity='0.7'/>

    <!-- inner flame -->
    <path d='M 108 170 Q 103 135 105 100 Q 100 65 108 35 Q 112 20 115 30 Q 113 50 110 70 Q 115 50 118 30 Q 120 20 122 30 Q 120 50 118 70 Q 120 50 122 30 Q 125 20 128 30 Q 130 50 132 70 Q 135 50 132 30 Q 135 20 138 30 Q 140 50 142 70 Q 145 50 142 30 Q 145 20 148 30 Q 150 50 152 35 Q 155 65 150 100 Q 152 135 147 170 Z'
          fill='#ffe060' opacity='0.6'/>

    <!-- white-hot core -->
    <path d='M 118 170 Q 116 140 117 110 Q 115 80 118 50 Q 120 35 122 45 Q 121 60 119 75 Q 120 60 122 45 Q 125 35 128 45 Q 129 60 127 75 Q 128 60 130 45 Q 132 35 135 45 Q 134 60 133 75 Q 132 60 132 50 Q 135 80 133 110 Q 134 140 132 170 Z'
          fill='#fff8e0' opacity='0.5'/>
  </g>

  <!-- impact glow at flame top -->
  <circle cx='125' cy='15' r='20' fill='url(#impactEF)' filter='url(#glowEF)'/>

  <!-- Spark burst at top of flame -->
  <g filter='url(#glowEF)'>
    <line x1='125' y1='12' x2='110' y2='-5' stroke='#fff8e0' stroke-width='1.2' opacity='0.7'/>
    <line x1='125' y1='12' x2='125' y2='-8' stroke='#ffe060' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='12' x2='140' y2='-5' stroke='#ffaa30' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='12' x2='115' y2='0' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='12' x2='135' y2='0' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
  </g>

  <!-- eternal flame base (brazier/altar) -->
  <ellipse cx='125' cy='175' rx='40' ry='8' fill='#3a1f15' opacity='0.7'/>
  <ellipse cx='125' cy='172' rx='30' ry='5' fill='#5a3828' opacity='0.5'/>
  <ellipse cx='125' cy='170' rx='20' ry='3' fill='#ff8800' opacity='0.3' filter='url(#glowEF)'/>

  <!-- rising eternal embers (never fade) -->
  <g filter='url(#glowEF)'>
    <circle cx='110' cy='10' r='1.5' fill='#fff8e0' opacity='0.8'/>
    <circle cx='125' cy='5' r='2' fill='#ffffff' opacity='0.9'/>
    <circle cx='140' cy='10' r='1.5' fill='#fff8e0' opacity='0.8'/>
    <circle cx='100' cy='25' r='1.2' fill='#ffe060' opacity='0.6'/>
    <circle cx='150' cy='25' r='1.2' fill='#ffe060' opacity='0.6'/>
    <circle cx='90' cy='45' r='1' fill='#ff8800' opacity='0.4'/>
    <circle cx='160' cy='45' r='1' fill='#ff8800' opacity='0.4'/>
    <circle cx='80' cy='65' r='0.8' fill='#ffaa30' opacity='0.35'/>
    <circle cx='170' cy='65' r='0.8' fill='#ffaa30' opacity='0.35'/>
  </g>

  <!-- orbiting sparkles (eternal cycle) -->
  <g filter='url(#glowEF)'>
    <circle cx='60' cy='95' r='1.5' fill='#ff8800' opacity='0.5'/>
    <circle cx='190' cy='95' r='1.5' fill='#ff8800' opacity='0.5'/>
    <circle cx='55' cy='60' r='1' fill='#ffe060' opacity='0.4'/>
    <circle cx='195' cy='60' r='1' fill='#ffe060' opacity='0.4'/>
    <circle cx='55' cy='130' r='1' fill='#e6591a' opacity='0.3'/>
    <circle cx='195' cy='130' r='1' fill='#e6591a' opacity='0.3'/>
    <circle cx='45' cy='80' r='0.8' fill='#c41a05' opacity='0.25'/>
    <circle cx='205' cy='110' r='0.8' fill='#c41a05' opacity='0.25'/>
  </g>

  <!-- Bottom ember glow -->
  <ellipse cx='125' cy='185' rx='45' ry='5' fill='#8a2a05' opacity='0.2'/>
  <circle cx='115' cy='183' r='1.2' fill='#ff8800' opacity='0.4'/>
  <circle cx='135' cy='184' r='1' fill='#ffaa30' opacity='0.3'/>

  <!-- Top ember glow -->
  <ellipse cx='125' cy='5' rx='35' ry='4' fill='#8a2a05' opacity='0.15'/>
</svg>
