<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgFI' cx='50%' cy='40%' r='80%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <radialGradient id='flameGFI' cx='50%' cy='70%' r='55%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='12%' stop-color='#ffe060'/>
      <stop offset='35%' stop-color='#ff8800'/>
      <stop offset='70%' stop-color='#e6591a'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='trailGFI' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#ffe060' stop-opacity='0.8'/>
      <stop offset='50%' stop-color='#ff8800' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#e6591a' stop-opacity='0.2'/>
    </linearGradient>
    <filter id='glowFI' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur stdDeviation='3' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='bigGlowFI' x='-100%' y='-100%' width='300%' height='300%'>
      <feGaussianBlur stdDeviation='10'/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width='250' height='190' fill='url(#bgFI)' rx='8'/>

  <!-- Ambient glow zones -->
  <ellipse cx='125' cy='45' rx='50' ry='45' fill='#e6591a' opacity='0.12' filter='url(#bigGlowFI)'/>
  <ellipse cx='75' cy='110' rx='35' ry='32' fill='#e6591a' opacity='0.1' filter='url(#bigGlowFI)'/>
  <ellipse cx='175' cy='110' rx='35' ry='32' fill='#e6591a' opacity='0.1' filter='url(#bigGlowFI)'/>

  <!-- Connecting flame trails -->
