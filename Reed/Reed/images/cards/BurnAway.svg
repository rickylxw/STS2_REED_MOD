<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a2a05" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#e6591a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#ff8800" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe060" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg3)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.05"/>
  <circle cx="226.5" cy="46.3" r="0.9" fill="#c41a05" opacity="0.57"/>
  <circle cx="215.0" cy="129.5" r="1.5" fill="#ff8800" opacity="0.61"/>
  <circle cx="8.9" cy="72.3" r="0.8" fill="#e6591a" opacity="0.21"/>
  <circle cx="203.1" cy="73.1" r="1.0" fill="#c41a05" opacity="0.42" filter="url(#glow1)"/>
  <circle cx="224.8" cy="30.2" r="2.4" fill="#c41a05" opacity="0.59" filter="url(#glow1)"/>
  <circle cx="66.9" cy="148.1" r="1.7" fill="#ff6600" opacity="0.58"/>
  <circle cx="192.6" cy="135.1" r="2.0" fill="#ff7a1a" opacity="0.58" filter="url(#glow1)"/>
  <circle cx="40.1" cy="118.2" r="1.2" fill="#ffe060" opacity="0.33" filter="url(#glow1)"/>
  <circle cx="11.1" cy="174.9" r="0.9" fill="#ff6600" opacity="0.60" filter="url(#glow1)"/>
  <circle cx="69.0" cy="174.0" r="1.3" fill="#ffcc40" opacity="0.47" filter="url(#glow1)"/>
  <!-- Dissolving flame (bottom solid, top wisps) -->
  <path d="M 70 170 Q 80 120 85 80 Q 90 50 95 20 Q 100 50 105 80 Q 110 120 115 170 Z" fill="url(#lin4)" filter="url(#glow1)"/>
  <path d="M 110 170 Q 115 130 120 90 Q 125 50 130 15 Q 135 50 140 90 Q 145 130 150 170 Z" fill="url(#lin4)" opacity="0.8" filter="url(#glow1)"/>
  <path d="M 145 170 Q 150 140 155 100 Q 160 60 165 25 Q 170 60 175 100 Q 180 140 180 170 Z" fill="url(#lin4)" opacity="0.6" filter="url(#glow1)"/>
  <!-- Wisps dissipating at top -->
  <path d="M 95 20 Q 100 10 95 0" stroke="#e6591a" stroke-width="1" fill="none" opacity="0.2" filter="url(#soft2)"/>
  <path d="M 130 20 Q 135 10 130 0" stroke="#e6591a" stroke-width="1" fill="none" opacity="0.2" filter="url(#soft2)"/>
  <path d="M 165 20 Q 170 10 165 0" stroke="#e6591a" stroke-width="1" fill="none" opacity="0.2" filter="url(#soft2)"/>
  <!-- Ash falling -->
  <circle cx="85" cy="135" r="1" fill="#7a7a7a" opacity="0.4"/>
  <circle cx="110" cy="110" r="1" fill="#7a7a7a" opacity="0.4"/>
  <circle cx="140" cy="140" r="1" fill="#7a7a7a" opacity="0.4"/>
  <circle cx="170" cy="120" r="1" fill="#7a7a7a" opacity="0.4"/>
</svg>
