<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <radialGradient id="bgHeart" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1010"/>
      <stop offset="40%" stop-color="#180806"/>
      <stop offset="100%" stop-color="#070202"/>
    </radialGradient>
    <radialGradient id="heartCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="15%" stop-color="#ffe060" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ff8800" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#e6591a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldenHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffaa30" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#e6591a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heartShape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="25%" stop-color="#ffe060"/>
      <stop offset="55%" stop-color="#ff8800"/>
      <stop offset="85%" stop-color="#e6591a"/>
      <stop offset="100%" stop-color="#8a2a05"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowHeart">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlowHeart">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="250" height="190" fill="url(#bgHeart)" rx="8"/>

  <!-- Large golden halo (warm aura) -->
  <ellipse cx="125" cy="95" rx="110" ry="90" fill="url(#goldenHalo)" opacity="0.5" filter="url(#bigGlowHeart)"/>

  <!-- Mid halo glow -->
  <ellipse cx="125" cy="95" rx="70" ry="65" fill="url(#heartCore)" opacity="0.35" filter="url(#glowHeart)"/>

  <!-- Warm light rays radiating from heart -->
  <path d="M 125 95 L 55 25" stroke="#ff8800" stroke-width="2" opacity="0.18" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 25 55" stroke="#ffe060" stroke-width="2.5" opacity="0.22" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 15 95" stroke="#ff8800" stroke-width="2" opacity="0.18" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 25 135" stroke="#ffaa30" stroke-width="2.5" opacity="0.22" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 55 170" stroke="#ff8800" stroke-width="2" opacity="0.18" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 125 175" stroke="#ffe060" stroke-width="2" opacity="0.18" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 195 170" stroke="#ff8800" stroke-width="2" opacity="0.18" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 225 135" stroke="#ffaa30" stroke-width="2.5" opacity="0.22" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 235 95" stroke="#ff8800" stroke-width="2" opacity="0.18" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 225 55" stroke="#ffe060" stroke-width="2.5" opacity="0.22" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 195 25" stroke="#ff8800" stroke-width="2" opacity="0.18" filter="url(#glowHeart)"/>
  <path d="M 125 95 L 125 15" stroke="#ffaa30" stroke-width="2" opacity="0.18" filter="url(#glowHeart)"/>

  <!-- Flame wisps around heart (outer flicker) -->
  <path d="M 80 95 Q 65 80 70 60 Q 75 45 85 55 Q 78 70 88 80 Z"
        fill="url(#heartCore)" opacity="0.4" filter="url(#glowHeart)"/>
  <path d="M 170 95 Q 185 80 180 60 Q 175 45 165 55 Q 172 70 162 80 Z"
        fill="url(#heartCore)" opacity="0.4" filter="url(#glowHeart)"/>
  <path d="M 125 50 Q 120 35 125 25 Q 130 35 125 50 Z"
        fill="url(#heartCore)" opacity="0.45" filter="url(#glowHeart)"/>
  <path d="M 95 140 Q 100 155 110 162 Q 115 150 108 140 Z"
        fill="url(#heartCore)" opacity="0.35" filter="url(#glowHeart)"/>
  <path d="M 155 140 Q 150 155 140 162 Q 135 150 142 140 Z"
        fill="url(#heartCore)" opacity="0.35" filter="url(#glowHeart)"/>

  <!-- Heart shape (glowing ember core) -->
  <path d="M 125 145 Q 80 120 80 90 Q 80 65 100 65 Q 115 65 125 80 Q 135 65 150 65 Q 170 65 170 90 Q 170 120 125 145 Z"
        fill="url(#heartShape)" filter="url(#glowHeart)"/>

  <!-- Heart inner highlight (bright core) -->
  <path d="M 125 130 Q 98 110 98 92 Q 98 75 108 75 Q 118 75 125 88 Q 132 75 142 75 Q 152 75 152 92 Q 152 110 125 130 Z"
        fill="url(#heartCore)" opacity="0.7" filter="url(#glowHeart)"/>

  <!-- Bright center of heart -->
  <ellipse cx="125" cy="100" rx="14" ry="16" fill="#fff8e0" opacity="0.85" filter="url(#glowHeart)"/>
  <ellipse cx="125" cy="100" rx="6" ry="7" fill="#ffffff" opacity="0.95" filter="url(#glowHeart)"/>

  <!-- Fire cracks on heart surface -->
  <path d="M 100 95 Q 110 100 108 110" stroke="#fff8e0" stroke-width="1" fill="none" opacity="0.6" filter="url(#glowHeart)"/>
  <path d="M 150 95 Q 140 100 142 110" stroke="#fff8e0" stroke-width="1" fill="none" opacity="0.6" filter="url(#glowHeart)"/>
  <path d="M 125 80 L 125 115" stroke="#ffe060" stroke-width="1.2" fill="none" opacity="0.7" filter="url(#glowHeart)"/>
  <path d="M 110 88 Q 115 95 113 105" stroke="#ffe060" stroke-width="0.8" fill="none" opacity="0.5" filter="url(#glowHeart)"/>
  <path d="M 140 88 Q 135 95 137 105" stroke="#ffe060" stroke-width="0.8" fill="none" opacity="0.5" filter="url(#glowHeart)"/>

  <!-- Bright crack nodes -->
  <circle cx="108" cy="100" r="2.5" fill="url(#emberGlow)" filter="url(#glowHeart)"/>
  <circle cx="142" cy="100" r="2.5" fill="url(#emberGlow)" filter="url(#glowHeart)"/>
  <circle cx="125" cy="88" r="2" fill="url(#emberGlow)" filter="url(#glowHeart)"/>
  <circle cx="125" cy="115" r="2" fill="url(#emberGlow)" filter="url(#glowHeart)"/>

  <!-- Embers floating outward -->
  <circle cx="60" cy="40" r="2" fill="#fff8e0" opacity="0.7" filter="url(#glowHeart)"/>
  <circle cx="40" cy="70" r="1.5" fill="#ffe060" opacity="0.6" filter="url(#glowHeart)"/>
  <circle cx="30" cy="100" r="1.2" fill="#ffaa30" opacity="0.5" filter="url(#glowHeart)"/>
  <circle cx="40" cy="130" r="1.5" fill="#ff8800" opacity="0.55" filter="url(#glowHeart)"/>
  <circle cx="60" cy="160" r="2" fill="#ffe060" opacity="0.6" filter="url(#glowHeart)"/>
  <circle cx="190" cy="40" r="2" fill="#fff8e0" opacity="0.7" filter="url(#glowHeart)"/>
  <circle cx="210" cy="70" r="1.5" fill="#ffe060" opacity="0.6" filter="url(#glowHeart)"/>
  <circle cx="220" cy="100" r="1.2" fill="#ffaa30" opacity="0.5" filter="url(#glowHeart)"/>
  <circle cx="210" cy="130" r="1.5" fill="#ff8800" opacity="0.55" filter="url(#glowHeart)"/>
  <circle cx="190" cy="160" r="2" fill="#ffe060" opacity="0.6" filter="url(#glowHeart)"/>
  <circle cx="125" cy="20" r="1.5" fill="#ff8800" opacity="0.5" filter="url(#glowHeart)"/>
  <circle cx="125" cy="170" r="1.5" fill="#ff8800" opacity="0.5" filter="url(#glowHeart)"/>

  <!-- Ember trails (streaks) -->
  <line x1="125" y1="95" x2="65" y2="35" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="125" y1="95" x2="35" y2="65" stroke="#ffaa30" stroke-width="0.8" opacity="0.25"/>
  <line x1="125" y1="95" x2="65" y2="160" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="125" y1="95" x2="185" y2="160" stroke="#ffaa30" stroke-width="0.8" opacity="0.3"/>
  <line x1="125" y1="95" x2="215" y2="65" stroke="#ff8800" stroke-width="0.8" opacity="0.25"/>
  <line x1="125" y1="95" x2="125" y2="20" stroke="#ffe060" stroke-width="0.8" opacity="0.25"/>

  <!-- Small scattered embers -->
  <circle cx="75" cy="50" r="1" fill="#ff8800" opacity="0.4"/>
  <circle cx="50" cy="115" r="0.8" fill="#e6591a" opacity="0.3"/>
  <circle cx="80" cy="145" r="1" fill="#ffaa30" opacity="0.4"/>
  <circle cx="170" cy="145" r="1" fill="#ff8800" opacity="0.4"/>
  <circle cx="200" cy="115" r="0.8" fill="#e6591a" opacity="0.3"/>
  <circle cx="175" cy="50" r="1" fill="#ffaa30" opacity="0.4"/>

  <!-- Ground shadow/glow -->
  <ellipse cx="125" cy="175" rx="55" ry="6" fill="#8a2a05" opacity="0.3" filter="url(#glowHeart)"/>
</svg>
