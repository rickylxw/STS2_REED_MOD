<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <radialGradient id="bgAwaken" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1408"/>
      <stop offset="40%" stop-color="#160a04"/>
      <stop offset="100%" stop-color="#070302"/>
    </radialGradient>
    <radialGradient id="powerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#ffe060" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#ff6600" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#c41a05" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5a1a05" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="energyStream" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffe060" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="muscleForm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c41a05" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3a1a0a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="ashParticleAwaken" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a807a" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#4a423c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#251e1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowAwaken">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlowAwaken">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="250" height="190" fill="url(#bgAwaken)" rx="8"/>

  <!-- Power aura -->
  <ellipse cx="125" cy="95" rx="65" ry="75" fill="url(#powerCore)" opacity="0.2" filter="url(#bigGlowAwaken)"/>

  <!-- Energy streams converging upward (scorch becoming power) -->
  <path d="M 70 160 Q 85 130 100 105 Q 112 90 120 80" stroke="url(#energyStream)" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#glowAwaken)"/>
  <path d="M 180 160 Q 165 130 150 105 Q 138 90 130 80" stroke="url(#energyStream)" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#glowAwaken)"/>
  <path d="M 55 130 Q 80 110 100 95 Q 112 88 118 82" stroke="url(#energyStream)" stroke-width="2" fill="none" opacity="0.5" filter="url(#glowAwaken)"/>
  <path d="M 195 130 Q 170 110 150 95 Q 138 88 132 82" stroke="url(#energyStream)" stroke-width="2" fill="none" opacity="0.5" filter="url(#glowAwaken)"/>
  <path d="M 90 165 Q 100 135 110 110 Q 118 95 122 85" stroke="url(#energyStream)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 160 165 Q 150 135 140 110 Q 132 95 128 85" stroke="url(#energyStream)" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Central power surge (upward explosion of energy) -->
  <path d="M 125 160 Q 120 130 122 100 Q 124 75 125 50 Q 126 75 128 100 Q 130 130 125 160 Z"
        fill="url(#powerCore)" opacity="0.5" filter="url(#bigGlowAwaken)"/>

  <!-- Humanoid silhouette bursting with power -->
  <ellipse cx="125" cy="60" rx="10" ry="12" fill="url(#muscleForm)" opacity="0.5" filter="url(#glowAwaken)"/>
  <path d="M 125 72 L 115 95 L 108 120 L 112 140 L 125 145 L 138 140 L 142 120 L 135 95 Z"
        fill="url(#muscleForm)" opacity="0.4" filter="url(#glowAwaken)"/>
  <!-- Arms raised -->
  <path d="M 115 80 L 95 55 L 90 40" stroke="url(#muscleForm)" stroke-width="3" fill="none" opacity="0.4" filter="url(#glowAwaken)"/>
  <path d="M 135 80 L 155 55 L 160 40" stroke="url(#muscleForm)" stroke-width="3" fill="none" opacity="0.4" filter="url(#glowAwaken)"/>

  <!-- Core power orb -->
  <ellipse cx="125" cy="85" rx="12" ry="15" fill="url(#powerCore)" opacity="0.8" filter="url(#glowAwaken)"/>
  <circle cx="125" cy="85" r="6" fill="#ffe060" opacity="0.7" filter="url(#glowAwaken)"/>
  <circle cx="125" cy="85" r="3" fill="#fff8e0" opacity="0.8" filter="url(#glowAwaken)"/>

  <!-- Power burst rays -->
  <line x1="125" y1="85" x2="125" y2="30" stroke="#ffe060" stroke-width="1.5" opacity="0.4" filter="url(#glowAwaken)"/>
  <line x1="125" y1="85" x2="80" y2="50" stroke="#ff8800" stroke-width="1.5" opacity="0.35" filter="url(#glowAwaken)"/>
  <line x1="125" y1="85" x2="170" y2="50" stroke="#ff8800" stroke-width="1.5" opacity="0.35" filter="url(#glowAwaken)"/>
  <line x1="125" y1="85" x2="60" y2="85" stroke="#ff6600" stroke-width="1.5" opacity="0.3" filter="url(#glowAwaken)"/>
  <line x1="125" y1="85" x2="190" y2="85" stroke="#ff6600" stroke-width="1.5" opacity="0.3" filter="url(#glowAwaken)"/>
  <line x1="125" y1="85" x2="85" y2="130" stroke="#c41a05" stroke-width="1.5" opacity="0.3" filter="url(#glowAwaken)"/>
  <line x1="125" y1="85" x2="165" y2="130" stroke="#c41a05" stroke-width="1.5" opacity="0.3" filter="url(#glowAwaken)"/>

  <!-- Ember sparks -->
  <circle cx="90" cy="40" r="2" fill="#ffe060" opacity="0.7" filter="url(#glowAwaken)"/>
  <circle cx="160" cy="40" r="2" fill="#ffe060" opacity="0.7" filter="url(#glowAwaken)"/>
  <circle cx="80" cy="70" r="1.5" fill="#ff8800" opacity="0.5" filter="url(#glowAwaken)"/>
  <circle cx="170" cy="70" r="1.5" fill="#ff8800" opacity="0.5" filter="url(#glowAwaken)"/>
  <circle cx="100" cy="50" r="1.5" fill="#ff8800" opacity="0.6" filter="url(#glowAwaken)"/>
  <circle cx="150" cy="50" r="1.5" fill="#ff8800" opacity="0.6" filter="url(#glowAwaken)"/>

  <!-- Ash remnants at base (being consumed) -->
  <circle cx="80" cy="160" r="2.5" fill="url(#ashParticleAwaken)" opacity="0.5"/>
  <circle cx="170" cy="160" r="2.5" fill="url(#ashParticleAwaken)" opacity="0.5"/>
  <circle cx="100" cy="170" r="2" fill="#5a504a" opacity="0.4"/>
  <circle cx="150" cy="170" r="2" fill="#5a504a" opacity="0.4"/>
  <circle cx="120" cy="165" r="1.5" fill="#4a423c" opacity="0.35"/>
  <circle cx="130" cy="165" r="1.5" fill="#4a423c" opacity="0.35"/>

  <!-- Ground glow -->
  <ellipse cx="125" cy="178" rx="50" ry="5" fill="#8a2a05" opacity="0.3" filter="url(#glowAwaken)"/>
</svg>
