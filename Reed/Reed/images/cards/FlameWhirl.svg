<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgFW' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <radialGradient id='vortexGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0' stop-opacity='0.9'/>
      <stop offset='30%' stop-color='#ffe060' stop-opacity='0.5'/>
      <stop offset='70%' stop-color='#ff8800' stop-opacity='0.2'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='impactFW' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0' stop-opacity='1'/>
      <stop offset='20%' stop-color='#ffe060' stop-opacity='0.7'/>
      <stop offset='50%' stop-color='#ff8800' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowFW'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='softFW'>
      <feGaussianBlur stdDeviation='5' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='bigSoftFW'>
      <feGaussianBlur stdDeviation='10' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>

  <rect width='250' height='190' fill='url(#bgFW)' rx='8'/>

  <!-- Atmospheric heat haze layers -->
  <ellipse cx='125' cy='95' rx='120' ry='80' fill='#e6591a' opacity='0.04' filter='url(#bigSoftFW)'/>
  <ellipse cx='125' cy='30' rx='80' ry='20' fill='#ff8800' opacity='0.03'/>
  <ellipse cx='125' cy='160' rx='80' ry='20' fill='#c41a05' opacity='0.03'/>

  <!-- central vortex glow -->
  <ellipse cx='125' cy='95' rx='80' ry='80' fill='url(#vortexGlow)' filter='url(#softFW)' opacity='0.6'/>

  <!-- Background ember particles -->
  <circle cx='30' cy='30' r='1.5' fill='#ff8800' opacity='0.5' filter='url(#glowFW)'/>
  <circle cx='55' cy='15' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='200' cy='25' r='1.2' fill='#ff8800' opacity='0.5'/>
  <circle cx='220' cy='55' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='15' cy='90' r='1' fill='#e6591a' opacity='0.3'/>
  <circle cx='235' cy='100' r='1' fill='#ff8800' opacity='0.3'/>
  <circle cx='20' cy='160' r='1' fill='#c41a05' opacity='0.3'/>
  <circle cx='225' cy='165' r='1' fill='#e6591a' opacity='0.3'/>
  <circle cx='90' cy='20' r='0.8' fill='#ffe060' opacity='0.4'/>
  <circle cx='160' cy='170' r='0.8' fill='#ff8800' opacity='0.3'/>

  <!-- spiral flame arms (whirling) -->
  <g filter='url(#glowFW)'>
    <!-- arm 1 (top-left to center) -->
    <path d='M 60 30 Q 80 50 90 70 Q 100 80 110 88 Q 120 92 125 95'
          stroke='#ff8800' stroke-width='5' fill='none' opacity='0.7'/>
    <path d='M 60 30 Q 80 50 90 70 Q 100 80 110 88 Q 120 92 125 95'
          stroke='#ffe060' stroke-width='2.5' fill='none' opacity='0.5'/>

    <!-- arm 2 (top-right to center) -->
    <path d='M 190 30 Q 170 50 160 70 Q 150 80 140 88 Q 130 92 125 95'
          stroke='#ff8800' stroke-width='5' fill='none' opacity='0.7'/>
    <path d='M 190 30 Q 170 50 160 70 Q 150 80 140 88 Q 130 92 125 95'
          stroke='#ffe060' stroke-width='2.5' fill='none' opacity='0.5'/>

    <!-- arm 3 (bottom-left to center) -->
    <path d='M 60 160 Q 80 140 90 120 Q 100 110 110 102 Q 120 98 125 95'
          stroke='#ff8800' stroke-width='5' fill='none' opacity='0.7'/>
    <path d='M 60 160 Q 80 140 90 120 Q 100 110 110 102 Q 120 98 125 95'
          stroke='#ffe060' stroke-width='2.5' fill='none' opacity='0.5'/>

    <!-- arm 4 (bottom-right to center) -->
    <path d='M 190 160 Q 170 140 160 120 Q 150 110 140 102 Q 130 98 125 95'
          stroke='#ff8800' stroke-width='5' fill='none' opacity='0.7'/>
    <path d='M 190 160 Q 170 140 160 120 Q 150 110 140 102 Q 130 98 125 95'
          stroke='#ffe060' stroke-width='2.5' fill='none' opacity='0.5'/>

    <!-- spiral rings -->
    <circle cx='125' cy='95' r='30' fill='none' stroke='#ff8800' stroke-width='1.5' stroke-dasharray='4 3' opacity='0.5'/>
    <circle cx='125' cy='95' r='45' fill='none' stroke='#e6591a' stroke-width='1.2' stroke-dasharray='3 5' opacity='0.4'/>
    <circle cx='125' cy='95' r='60' fill='none' stroke='#ffaa30' stroke-width='1' stroke-dasharray='2 6' opacity='0.3'/>
  </g>

  <!-- flame tips at arm ends -->
  <g filter='url(#glowFW)'>
    <path d='M 55 25 Q 50 15 55 5 Q 60 15 65 25 Q 60 30 55 25 Z' fill='#ff8800' opacity='0.7'/>
    <path d='M 185 25 Q 190 15 185 5 Q 180 15 175 25 Q 180 30 185 25 Z' fill='#ff8800' opacity='0.7'/>
    <path d='M 55 165 Q 50 175 55 185 Q 60 175 65 165 Q 60 160 55 165 Z' fill='#ff8800' opacity='0.7'/>
    <path d='M 185 165 Q 190 175 185 185 Q 180 175 175 165 Q 180 160 185 165 Z' fill='#ff8800' opacity='0.7'/>
  </g>

  <!-- Motion lines (swirling) -->
  <g opacity='0.2' filter='url(#glowFW)'>
    <path d='M 40 60 Q 55 75 50 90' stroke='#ff8800' stroke-width='1' fill='none'/>
    <path d='M 210 60 Q 195 75 200 90' stroke='#ff8800' stroke-width='1' fill='none'/>
    <path d='M 40 130 Q 55 115 50 100' stroke='#e6591a' stroke-width='1' fill='none'/>
    <path d='M 210 130 Q 195 115 200 100' stroke='#e6591a' stroke-width='1' fill='none'/>
  </g>

  <!-- Spark burst at center -->
  <g filter='url(#glowFW)'>
    <line x1='125' y1='95' x2='110' y2='80' stroke='#fff8e0' stroke-width='1.2' opacity='0.7'/>
    <line x1='125' y1='95' x2='140' y2='80' stroke='#ffe060' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='95' x2='108' y2='95' stroke='#ffaa30' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='95' x2='142' y2='95' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='95' x2='110' y2='110' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='95' x2='140' y2='110' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
  </g>

  <!-- impact glow at center -->
  <circle cx='125' cy='95' r='25' fill='url(#impactFW)' filter='url(#glowFW)'/>

  <!-- scattered embers in spiral -->
  <g>
    <circle cx='95' cy='50' r='1.5' fill='#ffe060' opacity='0.6' filter='url(#glowFW)'/>
    <circle cx='155' cy='50' r='1.2' fill='#ff8800' opacity='0.5'/>
    <circle cx='95' cy='140' r='1.2' fill='#ff8800' opacity='0.5'/>
    <circle cx='155' cy='140' r='1.5' fill='#ffe060' opacity='0.6' filter='url(#glowFW)'/>
    <circle cx='70' cy='95' r='1' fill='#e6591a' opacity='0.4'/>
    <circle cx='180' cy='95' r='1' fill='#e6591a' opacity='0.4'/>
    <circle cx='40' cy='60' r='0.8' fill='#c41a05' opacity='0.3'/>
    <circle cx='210' cy='60' r='0.8' fill='#c41a05' opacity='0.3'/>
    <circle cx='40' cy='130' r='0.8' fill='#c41a05' opacity='0.3'/>
    <circle cx='210' cy='130' r='0.8' fill='#c41a05' opacity='0.3'/>
    <circle cx='115' cy='30' r='1' fill='#ffaa30' opacity='0.4' filter='url(#glowFW)'/>
    <circle cx='135' cy='160' r='1' fill='#ff8800' opacity='0.4'/>
    <circle cx='80' cy='75' r='0.8' fill='#ffe060' opacity='0.35'/>
    <circle cx='170' cy='115' r='0.8' fill='#ffe060' opacity='0.35'/>
  </g>

  <!-- bright center -->
  <circle cx='125' cy='95' r='10' fill='url(#vortexGlow)' filter='url(#glowFW)' opacity='0.95'/>
  <circle cx='125' cy='95' r='4' fill='#fff8e0' opacity='0.9'/>
  <circle cx='125' cy='95' r='1.5' fill='#ffffff'/>

  <!-- Bottom ember glow -->
  <ellipse cx='125' cy='185' rx='45' ry='5' fill='#8a2a05' opacity='0.2'/>
  <circle cx='115' cy='183' r='1.2' fill='#ff8800' opacity='0.4'/>
  <circle cx='135' cy='184' r='1' fill='#ffaa30' opacity='0.3'/>

  <!-- Top ember glow -->
  <ellipse cx='125' cy='5' rx='35' ry='4' fill='#8a2a05' opacity='0.15'/>
</svg>
