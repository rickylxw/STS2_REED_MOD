<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg2" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2a05"/>
      <stop offset="20%" stop-color="#e6591a"/>
      <stop offset="50%" stop-color="#ff8800"/>
      <stop offset="80%" stop-color="#ffe060"/>
      <stop offset="100%" stop-color="#fff8e0"/>
    </linearGradient>
    <linearGradient id="lin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffe060" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg2)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.05"/>
  <circle cx="228.9" cy="176.8" r="0.9" fill="#ff7a1a" opacity="0.53"/>
  <circle cx="232.4" cy="148.7" r="1.8" fill="#ff8800" opacity="0.55"/>
  <circle cx="214.6" cy="67.6" r="1.7" fill="#ff8800" opacity="0.44" filter="url(#glow1)"/>
  <circle cx="114.9" cy="161.5" r="1.6" fill="#ffcc40" opacity="0.35" filter="url(#glow1)"/>
  <circle cx="87.3" cy="89.5" r="2.4" fill="#ff6600" opacity="0.47"/>
  <circle cx="41.8" cy="75.8" r="0.8" fill="#e6591a" opacity="0.64"/>
  <circle cx="113.6" cy="71.1" r="0.7" fill="#ff6600" opacity="0.24"/>
  <circle cx="169.8" cy="84.4" r="2.4" fill="#ffcc40" opacity="0.66"/>
  <!-- Blade (vertical, curved) -->
  <path d="M 120 20 Q 110 60 115 100 Q 120 140 125 170 L 135 170 Q 130 140 135 100 Q 140 60 130 20 Z" fill="url(#lin3)" filter="url(#glow1)"/>
  <!-- Blade edge highlight -->
  <path d="M 125 25 Q 118 60 122 100 Q 127 140 128 168" fill="none" stroke="url(#lin4)" stroke-width="2" opacity="0.7"/>
  <!-- Center groove -->
  <line x1="125" y1="30" x2="128" y2="165" stroke="#c41a05" stroke-width="1" opacity="0.5"/>
  <!-- Handle -->
  <rect x="115" y="168" width="20" height="8" fill="#3a1f15" rx="2"/>
  <rect x="110" y="174" width="30" height="4" fill="#4a2818" rx="1"/>
  <!-- Ember particles embedded in blade -->
  <circle cx="125" cy="40" r="2" fill="#fff8e0" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="125" cy="70" r="2" fill="#fff8e0" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="125" cy="100" r="2" fill="#fff8e0" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="125" cy="130" r="2" fill="#fff8e0" opacity="0.6" filter="url(#glow1)"/>
  <!-- Tip glow -->
  <circle cx="125" cy="20" r="6" fill="#fff8e0" opacity="0.8" filter="url(#glow1)"/>
</svg>
