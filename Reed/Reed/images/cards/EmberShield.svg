<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgES' cx='50%' cy='55%' r='70%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <linearGradient id='shieldGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#5a3828'/>
      <stop offset='30%' stop-color='#4a2818'/>
      <stop offset='70%' stop-color='#3a1f15'/>
      <stop offset='100%' stop-color='#2a1810'/>
    </linearGradient>
    <linearGradient id='shieldRim' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#ff8800'/>
      <stop offset='50%' stop-color='#e6591a'/>
      <stop offset='100%' stop-color='#8a2a05'/>
    </linearGradient>
    <linearGradient id='energyLine' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#ff8800' stop-opacity='0'/>
      <stop offset='50%' stop-color='#ffe060' stop-opacity='0.6'/>
      <stop offset='100%' stop-color='#ff8800' stop-opacity='0'/>
    </linearGradient>
    <radialGradient id='emberShieldGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0' stop-opacity='0.8'/>
      <stop offset='30%' stop-color='#ffe060' stop-opacity='0.5'/>
      <stop offset='70%' stop-color='#ff8800' stop-opacity='0.2'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowES'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='softES'>
      <feGaussianBlur stdDeviation='6' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>

  <rect width='250' height='190' fill='url(#bgES)' rx='8'/>

  <!-- Atmospheric heat haze layers -->
  <ellipse cx='125' cy='95' rx='120' ry='80' fill='#e6591a' opacity='0.04' filter='url(#softES)'/>
  <ellipse cx='125' cy='40' rx='90' ry='25' fill='#ff8800' opacity='0.03'/>
  <ellipse cx='125' cy='150' rx='90' ry='25' fill='#c41a05' opacity='0.03'/>

  <!-- ember glow behind shield -->
  <ellipse cx='125' cy='95' rx='80' ry='90' fill='url(#emberShieldGlow)' filter='url(#softES)' opacity='0.6'/>

  <!-- Background ember particles -->
  <circle cx='30' cy='40' r='1.5' fill='#ff8800' opacity='0.5' filter='url(#glowES)'/>
  <circle cx='55' cy='20' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='15' cy='70' r='1.2' fill='#e6591a' opacity='0.4'/>
  <circle cx='220' cy='35' r='1' fill='#ffaa30' opacity='0.5'/>
  <circle cx='235' cy='65' r='1.2' fill='#ff8800' opacity='0.4'/>
  <circle cx='200' cy='15' r='0.8' fill='#ffe060' opacity='0.4'/>
  <circle cx='20' cy='150' r='1.5' fill='#e6591a' opacity='0.4'/>
  <circle cx='230' cy='155' r='1' fill='#ff8800' opacity='0.4'/>
  <circle cx='10' cy='110' r='1' fill='#ffaa30' opacity='0.3'/>
  <circle cx='240' cy='120' r='1' fill='#ff8800' opacity='0.3'/>
  <circle cx='45' cy='175' r='1' fill='#c41a05' opacity='0.3'/>
  <circle cx='210' cy='170' r='0.8' fill='#e6591a' opacity='0.25'/>
  <circle cx='175' cy='180' r='0.8' fill='#c41a05' opacity='0.2'/>

  <!-- Energy radiating lines from shield center -->
  <g opacity='0.3' filter='url(#glowES)'>
    <line x1='125' y1='95' x2='125' y2='10' stroke='url(#energyLine)' stroke-width='1.5'/>
    <line x1='125' y1='95' x2='40' y2='50' stroke='url(#energyLine)' stroke-width='1'/>
    <line x1='125' y1='95' x2='210' y2='50' stroke='url(#energyLine)' stroke-width='1'/>
    <line x1='125' y1='95' x2='30' y2='120' stroke='url(#energyLine)' stroke-width='1'/>
    <line x1='125' y1='95' x2='220' y2='120' stroke='url(#energyLine)' stroke-width='1'/>
    <line x1='125' y1='95' x2='55' y2='175' stroke='url(#energyLine)' stroke-width='0.8'/>
    <line x1='125' y1='95' x2='195' y2='175' stroke='url(#energyLine)' stroke-width='0.8'/>
  </g>

  <!-- shield body -->
  <path d='M 125 25 L 195 50 L 195 100 Q 195 145 125 170 Q 55 145 55 100 L 55 50 Z'
        fill='url(#shieldGrad)' stroke='url(#shieldRim)' stroke-width='2.5'/>

  <!-- shield inner border -->
  <path d='M 125 35 L 185 55 L 185 100 Q 185 138 125 160 Q 65 138 65 100 L 65 55 Z'
        fill='none' stroke='#ff8800' stroke-width='1' opacity='0.4'/>

  <!-- central ember emblem -->
  <ellipse cx='125' cy='95' rx='40' ry='50' fill='url(#emberShieldGlow)' filter='url(#glowES)' opacity='0.5'/>

  <!-- flame motif on shield -->
  <path d='M 125 60 Q 110 80 115 100 Q 120 115 125 130 Q 130 115 135 100 Q 140 80 125 60 Z'
        fill='#ff8800' opacity='0.7' filter='url(#glowES)'/>
  <path d='M 125 70 Q 118 85 120 100 Q 123 115 125 125 Q 127 115 130 100 Q 132 85 125 70 Z'
        fill='#ffe060' opacity='0.6' filter='url(#glowES)'/>
  <path d='M 125 80 Q 122 92 124 105 Q 125 115 125 120 Q 125 115 126 105 Q 128 92 125 80 Z'
        fill='#fff8e0' opacity='0.5'/>

  <!-- shield rim glow points -->
  <circle cx='125' cy='25' r='3' fill='#fff8e0' opacity='0.8' filter='url(#glowES)'/>
  <circle cx='195' cy='50' r='2' fill='#ffe060' opacity='0.6'/>
  <circle cx='55' cy='50' r='2' fill='#ffe060' opacity='0.6'/>
  <circle cx='125' cy='170' r='2.5' fill='#ff8800' opacity='0.5'/>

  <!-- Spark burst at shield top -->
  <g filter='url(#glowES)'>
    <line x1='125' y1='25' x2='110' y2='10' stroke='#fff8e0' stroke-width='1.2' opacity='0.7'/>
    <line x1='125' y1='25' x2='125' y2='5' stroke='#ffe060' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='25' x2='140' y2='10' stroke='#ffaa30' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='25' x2='115' y2='12' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='25' x2='135' y2='12' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
  </g>

  <!-- Flame tongues at shield edges -->
  <path d='M 55 50 Q 45 40 48 25 Q 42 15 45 5 Q 52 20 55 35 Q 50 45 58 48 Z' fill='#ff8800' opacity='0.5' filter='url(#glowES)'/>
  <path d='M 195 50 Q 205 40 202 25 Q 208 15 205 5 Q 198 20 195 35 Q 200 45 192 48 Z' fill='#ff8800' opacity='0.5' filter='url(#glowES)'/>

  <!-- rising embers along shield edges -->
  <circle cx='80' cy='30' r='1.2' fill='#ff8800' opacity='0.5' filter='url(#glowES)'/>
  <circle cx='170' cy='28' r='1' fill='#ffaa30' opacity='0.5'/>
  <circle cx='60' cy='120' r='1' fill='#e6591a' opacity='0.4'/>
  <circle cx='190' cy='120' r='1.2' fill='#ff8800' opacity='0.4'/>
  <circle cx='100' cy='180' r='1' fill='#ffaa30' opacity='0.3'/>
  <circle cx='150' cy='178' r='1' fill='#ff8800' opacity='0.3'/>
  <circle cx='70' cy='85' r='0.8' fill='#ffe060' opacity='0.4' filter='url(#glowES)'/>
  <circle cx='180' cy='90' r='0.8' fill='#ffe060' opacity='0.4'/>
  <circle cx='90' cy='155' r='0.8' fill='#c41a05' opacity='0.25'/>
  <circle cx='160' cy='155' r='0.8' fill='#e6591a' opacity='0.3'/>

  <!-- Bottom ember glow -->
  <ellipse cx='125' cy='185' rx='45' ry='5' fill='#8a2a05' opacity='0.2'/>
  <circle cx='115' cy='183' r='1.2' fill='#ff8800' opacity='0.5'/>
  <circle cx='135' cy='184' r='1' fill='#ffaa30' opacity='0.4'/>

  <!-- Top ember glow -->
  <ellipse cx='125' cy='10' rx='30' ry='4' fill='#8a2a05' opacity='0.2'/>
  <circle cx='120' cy='8' r='1' fill='#ff8800' opacity='0.4'/>
</svg>
