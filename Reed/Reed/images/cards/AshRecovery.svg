<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgAR' cx='50%' cy='60%' r='80%'>
      <stop offset='0%' stop-color='#2a1505'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <linearGradient id='phoenixAR' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#c41a05'/>
      <stop offset='25%' stop-color='#e6591a'/>
      <stop offset='50%' stop-color='#ff8800'/>
      <stop offset='75%' stop-color='#ffaa00'/>
      <stop offset='100%' stop-color='#ffe060'/>
    </linearGradient>
    <linearGradient id='wingAR' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#8a2a05' stop-opacity='0.8'/>
      <stop offset='40%' stop-color='#e6591a' stop-opacity='0.7'/>
      <stop offset='70%' stop-color='#ff8800' stop-opacity='0.6'/>
      <stop offset='100%' stop-color='#ffaa00' stop-opacity='0.5'/>
    </linearGradient>
    <linearGradient id='flameAR' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='15%' stop-color='#ffe060'/>
      <stop offset='40%' stop-color='#ff8800'/>
      <stop offset='70%' stop-color='#c41a05'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </linearGradient>
    <radialGradient id='emberAR' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='35%' stop-color='#ffcc40'/>
      <stop offset='75%' stop-color='#e6591a'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='ashAR' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#7a7268' stop-opacity='0.6'/>
      <stop offset='60%' stop-color='#4a423c' stop-opacity='0.3'/>
      <stop offset='100%' stop-color='#2a2520' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowAR'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
    <filter id='bigAR'><feGaussianBlur stdDeviation='7'/></filter>
  </defs>

  <rect width='250' height='190' rx='8' fill='url(#bgAR)'/>

  <!-- rising fire glow behind phoenix -->
  <ellipse cx='125' cy='80' rx='55' ry='70' fill='url(#emberAR)' opacity='0.25' filter='url(#bigAR)'/>

  <!-- ash mound at bottom -->
  <ellipse cx='125' cy='178' rx='80' ry='14' fill='#3a3228' opacity='0.7'/>
  <ellipse cx='125' cy='175' rx='60' ry='10' fill='#4a423c' opacity='0.5'/>
  <ellipse cx='125' cy='172' rx='40' ry='7' fill='#5a5248' opacity='0.4'/>

  <!-- ash particles rising from mound -->
  <circle cx='70' cy='160' r='2' fill='url(#ashAR)' opacity='0.6'/>
  <circle cx='180' cy='158' r='2.5' fill='url(#ashAR)' opacity='0.55'/>
  <circle cx='55' cy='140' r='1.5' fill='#6a6258' opacity='0.45'/>
  <circle cx='195' cy='138' r='1.8' fill='#7a7268' opacity='0.45'/>
  <circle cx='85' cy='150' r='1.2' fill='url(#ashAR)' opacity='0.4'/>
  <circle cx='165' cy='148' r='1.5' fill='url(#ashAR)' opacity='0.4'/>

  <!-- trailing flames rising from ashes -->
  <path d='M 105,170 C 100,150 110,135 105,115 C 112,100 105,80 110,65' fill='none' stroke='url(#flameAR)' stroke-width='3' opacity='0.5' filter='url(#glowAR)'/>
  <path d='M 145,170 C 150,150 140,135 145,115 C 138,100 145,80 140,65' fill='none' stroke='url(#flameAR)' stroke-width='3' opacity='0.5' filter='url(#glowAR)'/>
  <path d='M 125,172 C 120,145 128,125 122,100 C 128,80 122,60 125,45' fill='none' stroke='url(#flameAR)' stroke-width='2.5' opacity='0.6' filter='url(#glowAR)'/>

  <!-- phoenix body (rising silhouette) -->
  <path d='M 125,25 C 120,28 117,35 118,42 C 112,40 106,42 102,48 L 108,52 C 108,48 112,46 116,48 C 114,55 112,62 115,68 C 108,72 103,80 100,88 C 95,96 92,104 95,112 L 102,108 C 100,100 105,94 110,90 C 108,98 108,106 112,114 C 116,108 120,102 122,96 C 124,102 128,108 132,114 C 136,106 136,98 134,90 C 139,94 144,100 142,108 L 149,112 C 152,104 149,96 144,88 C 141,80 136,72 129,68 C 132,62 130,55 128,48 C 132,46 136,48 136,52 L 142,48 C 138,42 132,40 126,42 C 127,35 124,28 125,25 Z' fill='url(#phoenixAR)' stroke='#c41a05' stroke-width='0.6' opacity='0.95'/>

  <!-- phoenix head crest -->
  <path d='M 125,25 L 120,12 L 124,18 L 125,8 L 126,18 L 130,12 Z' fill='#ffe060' opacity='0.8' filter='url(#glowAR)'/>

  <!-- phoenix eye -->
  <circle cx='122' cy='38' r='1.5' fill='#fff8e0' opacity='0.9' filter='url(#glowAR)'/>

  <!-- left wing (spread upward) -->
  <path d='M 102,48 C 85,40 65,35 48,30 C 40,35 35,45 30,55 C 40,50 50,48 60,50 C 50,58 42,65 38,75 C 50,68 62,65 72,62 C 65,70 60,78 58,88 C 70,78 82,72 95,68 C 88,75 85,82 85,90 C 95,80 102,72 105,65 L 102,48 Z' fill='url(#wingAR)' stroke='#8a2a05' stroke-width='0.5' opacity='0.85'/>

  <!-- right wing (spread upward, mirrored) -->
  <path d='M 148,48 C 165,40 185,35 202,30 C 210,35 215,45 220,55 C 210,50 200,48 190,50 C 200,58 208,65 212,75 C 200,68 188,65 178,62 C 185,70 190,78 192,88 C 180,78 168,72 155,68 C 162,75 165,82 165,90 C 155,80 148,72 145,65 L 148,48 Z' fill='url(#wingAR)' stroke='#8a2a05' stroke-width='0.5' opacity='0.85'/>

  <!-- wing feather details (left) -->
  <path d='M 40,50 L 70,55 M 50,65 L 75,65 M 60,75 L 80,72 M 70,85 L 90,80' fill='none' stroke='#1a0d08' stroke-width='0.4' opacity='0.4'/>
  <!-- wing feather details (right) -->
  <path d='M 210,50 L 180,55 M 200,65 L 175,65 M 190,75 L 170,72 M 180,85 L 160,80' fill='none' stroke='#1a0d08' stroke-width='0.4' opacity='0.4'/>

  <!-- tail flames trailing down -->
  <path d='M 112,114 C 108,125 112,140 108,155 C 112,148 115,135 114,120 Z' fill='url(#flameAR)' opacity='0.8'/>
  <path d='M 138,114 C 142,125 138,140 142,155 C 138,148 135,135 136,120 Z' fill='url(#flameAR)' opacity='0.8'/>

  <!-- glowing embers rising with phoenix -->
  <circle cx='110' cy='30' r='1.5' fill='#ffe060' opacity='0.7' filter='url(#glowAR)'/>
  <circle cx='140' cy='35' r='1.2' fill='#ffaa00' opacity='0.6'/>
  <circle cx='95' cy='50' r='1' fill='#ff8800' opacity='0.5' filter='url(#glowAR)'/>
  <circle cx='155' cy='45' r='1' fill='#ff8800' opacity='0.5'/>
  <circle cx='80' cy='65' r='0.8' fill='#e6591a' opacity='0.4'/>
  <circle cx='170' cy='60' r='0.8' fill='#e6591a' opacity='0.4'/>
  <circle cx='65' cy='85' r='0.8' fill='#c41a05' opacity='0.35'/>
  <circle cx='185' cy='80' r='0.8' fill='#c41a05' opacity='0.35'/>
  <circle cx='125' cy='15' r='1.2' fill='#fff8e0' opacity='0.55' filter='url(#glowAR)'/>

  <!-- rebirth glow at base -->
  <ellipse cx='125' cy='170' rx='25' ry='8' fill='url(#emberAR)' opacity='0.6' filter='url(#glowAR)'/>
  <ellipse cx='125' cy='172' rx='12' ry='4' fill='#fff8e0' opacity='0.5' filter='url(#glowAR)'/>

  <!-- top vignette -->
  <rect width='250' height='40' rx='8' fill='#1a0d08' opacity='0.25'/>
</svg>
