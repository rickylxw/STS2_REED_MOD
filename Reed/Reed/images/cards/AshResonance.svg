<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg3)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.05"/>
  <circle cx="186.2" cy="81.2" r="0.7" fill="#555555" opacity="0.37"/>
  <circle cx="37.0" cy="93.0" r="0.9" fill="#999999" opacity="0.37"/>
  <circle cx="211.7" cy="93.8" r="2.0" fill="#6a6a6a" opacity="0.57"/>
  <circle cx="28.8" cy="62.2" r="0.8" fill="#6a6a6a" opacity="0.57"/>
  <circle cx="171.3" cy="73.3" r="2.0" fill="#999999" opacity="0.51"/>
  <circle cx="8.6" cy="52.6" r="1.9" fill="#7a7a7a" opacity="0.26"/>
  <circle cx="85.2" cy="116.6" r="1.0" fill="#888888" opacity="0.39"/>
  <circle cx="208.9" cy="13.2" r="1.0" fill="#7a7a7a" opacity="0.47"/>
  <!-- Concentric resonating rings -->
  <circle cx="125" cy="95" r="20" fill="none" stroke="#6a6a6a" stroke-width="2" opacity="0.8" filter="url(#soft2)"/>
  <circle cx="125" cy="95" r="35" fill="none" stroke="#6a6a6a" stroke-width="2" opacity="0.6" filter="url(#soft2)"/>
  <circle cx="125" cy="95" r="50" fill="none" stroke="#6a6a6a" stroke-width="1.5" opacity="0.4" filter="url(#soft2)"/>
  <circle cx="125" cy="95" r="65" fill="none" stroke="#6a6a6a" stroke-width="1.5" opacity="0.3" filter="url(#soft2)"/>
  <circle cx="125" cy="95" r="80" fill="none" stroke="#6a6a6a" stroke-width="1" opacity="0.2" filter="url(#soft2)"/>
  <circle cx="125" cy="95" r="95" fill="none" stroke="#6a6a6a" stroke-width="1" opacity="0.15" filter="url(#soft2)"/>
  <!-- Glowing resonance core -->
  <circle cx="125" cy="95" r="12" fill="#ff8800" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="125" cy="95" r="4" fill="#fff8e0" opacity="0.9"/>
  <!-- Vibration lines -->
  <line x1="150.0" y1="95.0" x2="215.0" y2="95.0" stroke="#6a6a6a" stroke-width="0.5" opacity="0.2"/>
  <line x1="142.7" y1="112.7" x2="188.6" y2="158.6" stroke="#6a6a6a" stroke-width="0.5" opacity="0.2"/>
  <line x1="125.0" y1="120.0" x2="125.0" y2="185.0" stroke="#6a6a6a" stroke-width="0.5" opacity="0.2"/>
  <line x1="107.3" y1="112.7" x2="61.4" y2="158.6" stroke="#6a6a6a" stroke-width="0.5" opacity="0.2"/>
  <line x1="100.0" y1="95.0" x2="35.0" y2="95.0" stroke="#6a6a6a" stroke-width="0.5" opacity="0.2"/>
  <line x1="107.3" y1="77.3" x2="61.4" y2="31.4" stroke="#6a6a6a" stroke-width="0.5" opacity="0.2"/>
  <line x1="125.0" y1="70.0" x2="125.0" y2="5.0" stroke="#6a6a6a" stroke-width="0.5" opacity="0.2"/>
  <line x1="142.7" y1="77.3" x2="188.6" y2="31.4" stroke="#6a6a6a" stroke-width="0.5" opacity="0.2"/>
</svg>
