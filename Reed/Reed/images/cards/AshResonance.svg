<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgRad' cx='0.5' cy='0.5' r='0.7'>
      <stop offset='0' stop-color='#2a1815'/>
      <stop offset='0.5' stop-color='#1a0d08'/>
      <stop offset='1' stop-color='#0a0504'/>
    </radialGradient>
    <radialGradient id='coreGlow' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.3' stop-color='#ffe060'/>
      <stop offset='0.65' stop-color='#ff8800'/>
      <stop offset='1' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='ashRingGlow' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#ffcc40' stop-opacity='0'/>
      <stop offset='0.45' stop-color='#ff8800' stop-opacity='0.6'/>
      <stop offset='0.55' stop-color='#ffe060' stop-opacity='0.9'/>
      <stop offset='0.7' stop-color='#e6591a' stop-opacity='0.4'/>
      <stop offset='1' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='softBlur'><feGaussianBlur stdDeviation='2'/></filter>
    <filter id='bigBlur'><feGaussianBlur stdDeviation='5'/></filter>
  </defs>

  <!-- background -->
  <rect width='250' height='190' rx='8' fill='url(#bgRad)'/>

  <!-- soft halo behind rings -->
  <circle cx='125' cy='95' r='85' fill='url(#ashRingGlow)' filter='url(#bigBlur)' opacity='0.6'/>
  <circle cx='125' cy='95' r='95' fill='#2a1815' opacity='0.3'/>

  <!-- concentric wave rings (ash dust trails) -->
  <circle cx='125' cy='95' r='22' fill='none' stroke='#ff8800' stroke-width='0.8' stroke-dasharray='1.5 3' opacity='0.6'/>
  <circle cx='125' cy='95' r='34' fill='none' stroke='#e6591a' stroke-width='0.7' stroke-dasharray='2 4' opacity='0.55'/>
  <circle cx='125' cy='95' r='46' fill='none' stroke='#ffaa30' stroke-width='0.7' stroke-dasharray='1.5 3.5' opacity='0.5'/>
  <circle cx='125' cy='95' r='60' fill='none' stroke='#e6591a' stroke-width='0.6' stroke-dasharray='2 5' opacity='0.45'/>
  <circle cx='125' cy='95' r='75' fill='none' stroke='#ff8800' stroke-width='0.6' stroke-dasharray='1.5 4' opacity='0.4'/>
  <circle cx='125' cy='95' r='88' fill='none' stroke='#c41a05' stroke-width='0.5' stroke-dasharray='1 6' opacity='0.35'/>

  <!-- glowing ash ring band (the resonating ring) -->
  <circle cx='125' cy='95' r='46' fill='none' stroke='url(#ashRingGlow)' stroke-width='6' filter='url(#softBlur)' opacity='0.7'/>
  <circle cx='125' cy='95' r='46' fill='none' stroke='#fff8e0' stroke-width='1.2' opacity='0.5'/>
  <circle cx='125' cy='95' r='34' fill='none' stroke='#ffe060' stroke-width='1' opacity='0.4'/>

  <!-- ash particles on inner ring r=22 -->
  <g fill='#ffcc40'>
    <circle cx='147' cy='95' r='1.6'/>
    <circle cx='103' cy='95' r='1.6'/>
    <circle cx='125' cy='73' r='1.6'/>
    <circle cx='125' cy='117' r='1.6'/>
    <circle cx='140' cy='82' r='1.3'/>
    <circle cx='110' cy='108' r='1.3'/>
    <circle cx='140' cy='108' r='1.3'/>
    <circle cx='110' cy='82' r='1.3'/>
  </g>

  <!-- ash particles on ring r=34 -->
  <g fill='#ff8800'>
    <circle cx='159' cy='95' r='1.8'/>
    <circle cx='91' cy='95' r='1.8'/>
    <circle cx='125' cy='61' r='1.8'/>
    <circle cx='125' cy='129' r='1.8'/>
    <circle cx='149' cy='71' r='1.5'/>
    <circle cx='101' cy='119' r='1.5'/>
    <circle cx='149' cy='119' r='1.5'/>
    <circle cx='101' cy='71' r='1.5'/>
    <circle cx='155' cy='83' r='1.2'/>
    <circle cx='95' cy='107' r='1.2'/>
    <circle cx='155' cy='107' r='1.2'/>
    <circle cx='95' cy='83' r='1.2'/>
  </g>

  <!-- ash particles on main ring r=46 -->
  <g fill='#ffe060'>
    <circle cx='171' cy='95' r='2.2'/>
    <circle cx='79' cy='95' r='2.2'/>
    <circle cx='125' cy='49' r='2.2'/>
    <circle cx='125' cy='141' r='2.2'/>
    <circle cx='158' cy='62' r='2'/>
    <circle cx='92' cy='128' r='2'/>
    <circle cx='158' cy='128' r='2'/>
    <circle cx='92' cy='62' r='2'/>
    <circle cx='167' cy='74' r='1.7'/>
    <circle cx='83' cy='116' r='1.7'/>
    <circle cx='167' cy='116' r='1.7'/>
    <circle cx='83' cy='74' r='1.7'/>
    <circle cx='170' cy='85' r='1.5'/>
    <circle cx='80' cy='105' r='1.5'/>
    <circle cx='170' cy='105' r='1.5'/>
    <circle cx='80' cy='85' r='1.5'/>
  </g>

  <!-- ash particles on outer rings r=60, r=75 -->
  <g fill='#e6591a'>
    <circle cx='185' cy='95' r='1.8'/>
    <circle cx='65' cy='95' r='1.8'/>
    <circle cx='125' cy='35' r='1.8'/>
    <circle cx='125' cy='155' r='1.8'/>
    <circle cx='168' cy='52' r='1.5'/>
    <circle cx='82' cy='138' r='1.5'/>
    <circle cx='168' cy='138' r='1.5'/>
    <circle cx='82' cy='52' r='1.5'/>
  </g>
  <g fill='#c41a05'>
    <circle cx='200' cy='95' r='1.6'/>
    <circle cx='50' cy='95' r='1.6'/>
    <circle cx='125' cy='20' r='1.6'/>
    <circle cx='125' cy='170' r='1.6'/>
    <circle cx='178' cy='42' r='1.3'/>
    <circle cx='72' cy='148' r='1.3'/>
    <circle cx='178' cy='148' r='1.3'/>
    <circle cx='72' cy='42' r='1.3'/>
  </g>

  <!-- vibrating scattered ember dust between rings -->
  <g fill='#fff8e0'>
    <circle cx='136' cy='84' r='1' opacity='0.8'/>
    <circle cx='114' cy='106' r='1' opacity='0.7'/>
    <circle cx='142' cy='100' r='0.9' opacity='0.65'/>
    <circle cx='108' cy='88' r='0.9' opacity='0.65'/>
    <circle cx='130' cy='78' r='0.8' opacity='0.6'/>
    <circle cx='120' cy='112' r='0.8' opacity='0.6'/>
  </g>
  <g fill='#ffcc40'>
    <circle cx='150' cy='88' r='1.2' opacity='0.7'/>
    <circle cx='100' cy='102' r='1.2' opacity='0.7'/>
    <circle cx='145' cy='110' r='1.1' opacity='0.65'/>
    <circle cx='105' cy='80' r='1.1' opacity='0.65'/>
    <circle cx='160' cy='100' r='1' opacity='0.6'/>
    <circle cx='90' cy='90' r='1' opacity='0.6'/>
  </g>

  <!-- bright resonating core -->
  <circle cx='125' cy='95' r='14' fill='url(#coreGlow)' filter='url(#softBlur)' opacity='0.95'/>
  <circle cx='125' cy='95' r='6' fill='#fff8e0' filter='url(#softBlur)' opacity='0.9'/>
  <circle cx='125' cy='95' r='2.5' fill='#fff8e0'/>

  <!-- vignette -->
  <rect width='250' height='190' rx='8' fill='#1a0d08' opacity='0.18'/>
</svg>
