<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgBO' cx='50%' cy='80%' r='80%'>
      <stop offset='0%' stop-color='#2a1505'/>
      <stop offset='45%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#080302'/>
    </radialGradient>
    <linearGradient id='flameCoreBO' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='15%' stop-color='#ffe060'/>
      <stop offset='40%' stop-color='#ff8800'/>
      <stop offset='70%' stop-color='#c41a05'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='flameOuterBO' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#ffaa00' stop-opacity='0.9'/>
      <stop offset='50%' stop-color='#e6591a' stop-opacity='0.65'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='figureBO' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#1a0d08'/>
      <stop offset='40%' stop-color='#2a1815'/>
      <stop offset='80%' stop-color='#c41a05'/>
      <stop offset='100%' stop-color='#ffe060'/>
    </linearGradient>
    <radialGradient id='emberBO' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='35%' stop-color='#ffcc40'/>
      <stop offset='75%' stop-color='#e6591a'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='ashBO' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#8a807a' stop-opacity='0.7'/>
      <stop offset='60%' stop-color='#4a423c' stop-opacity='0.35'/>
      <stop offset='100%' stop-color='#251e1a' stop-opacity='0'/>
    </radialGradient>
    <filter id='softBO'><feGaussianBlur stdDeviation='2.5'/></filter>
    <filter id='bigBO'><feGaussianBlur stdDeviation='6'/></filter>
  </defs>

  <rect width='250' height='190' rx='8' fill='url(#bgBO)'/>

  <!-- outer fire haze -->
  <path d='M0,145 C30,105 60,130 95,85 C110,65 130,70 145,50 C160,35 175,50 185,65 C205,50 220,75 250,55 L250,190 L0,190 Z' fill='url(#flameOuterBO)' filter='url(#bigBO)' opacity='0.75'/>

  <!-- flame columns rising -->
  <path d='M20,155 C25,115 40,130 35,90 C45,105 50,75 55,95 C60,65 70,110 65,135 C75,125 80,145 60,165 Z' fill='url(#flameCoreBO)' opacity='0.85'/>
  <path d='M185,155 C190,120 200,135 198,90 C208,105 210,70 215,95 C220,65 230,110 225,135 C235,130 240,150 220,165 Z' fill='url(#flameCoreBO)' opacity='0.85'/>
  <path d='M105,165 C108,125 115,145 112,100 C120,115 122,80 128,105 C132,70 140,115 135,145 C145,135 148,160 128,175 Z' fill='url(#flameCoreBO)' opacity='0.9'/>

  <!-- dark figure silhouette (arms outstretched, dissolving) -->
  <path d='M125,40 C118,40 113,47 113,55 C100,50 85,52 75,58 C70,60 65,58 62,55 L58,62 L65,65 L73,63 C85,60 100,58 113,60 C108,68 104,78 107,82 C99,86 100,96 107,99 C103,106 106,116 113,117 C110,126 112,139 115,152 C118,162 122,170 125,174 C128,170 132,162 135,152 C138,139 140,126 137,117 C144,116 147,106 143,99 C150,96 151,86 145,82 C148,78 144,68 137,60 C150,58 165,60 177,63 L185,65 L192,62 L188,55 C185,58 180,60 175,58 C165,52 150,50 137,55 C137,47 132,40 125,40 Z' fill='url(#figureBO)' opacity='0.95'/>

  <!-- ember cracks through body -->
  <path d='M125,60 L123,75 L127,77 L125,60 Z' fill='#fff8e0' opacity='0.9'/>
  <path d='M120,85 L122,100 L119,103 L120,85 Z' fill='#ffe060' opacity='0.85'/>
  <path d='M130,93 L128,110 L131,112 L130,93 Z' fill='#ffcc40' opacity='0.85'/>
  <path d='M125,115 L123,130 L127,132 L125,115 Z' fill='#ff8800' opacity='0.85'/>

  <!-- dissolving fragments -->
  <circle cx='112' cy='88' r='2.5' fill='url(#emberBO)' opacity='0.9'/>
  <circle cx='140' cy='82' r='2' fill='url(#emberBO)' opacity='0.85'/>
  <circle cx='108' cy='110' r='2' fill='url(#emberBO)' opacity='0.8'/>
  <circle cx='144' cy='115' r='2.5' fill='url(#emberBO)' opacity='0.85'/>
  <circle cx='115' cy='130' r='2' fill='url(#emberBO)' opacity='0.75'/>
  <circle cx='135' cy='140' r='2.5' fill='url(#emberBO)' opacity='0.9'/>

  <!-- rising embers -->
  <circle cx='58' cy='65' r='1.5' fill='#ffe060' opacity='0.85'/>
  <circle cx='70' cy='40' r='1.2' fill='#ffcc40' opacity='0.7'/>
  <circle cx='90' cy='55' r='1.4' fill='#ff8800' opacity='0.7'/>
  <circle cx='155' cy='45' r='1.6' fill='#ffe060' opacity='0.8'/>
  <circle cx='175' cy='65' r='1.3' fill='#ffcc40' opacity='0.7'/>
  <circle cx='195' cy='40' r='1.4' fill='#ff8800' opacity='0.75'/>
  <circle cx='205' cy='70' r='1.2' fill='#ffe060' opacity='0.65'/>
  <circle cx='45' cy='85' r='1.3' fill='#ffcc40' opacity='0.65'/>
  <circle cx='100' cy='35' r='1' fill='#fff8e0' opacity='0.55'/>
  <circle cx='150' cy='30' r='1.2' fill='#fff8e0' opacity='0.6'/>

  <!-- ash particles falling -->
  <circle cx='55' cy='105' r='1.5' fill='url(#ashBO)' opacity='0.6'/>
  <circle cx='195' cy='105' r='1.5' fill='url(#ashBO)' opacity='0.6'/>
  <circle cx='95' cy='120' r='1.2' fill='url(#ashBO)' opacity='0.5'/>
  <circle cx='160' cy='115' r='1.5' fill='url(#ashBO)' opacity='0.55'/>
  <circle cx='75' cy='130' r='1.8' fill='url(#ashBO)' opacity='0.6'/>
  <circle cx='180' cy='135' r='1.5' fill='url(#ashBO)' opacity='0.55'/>
  <circle cx='40' cy='140' r='1.2' fill='#3a3028' opacity='0.4'/>
  <circle cx='210' cy='140' r='1.2' fill='#3a3028' opacity='0.4'/>

  <!-- bright base fire -->
  <ellipse cx='125' cy='175' rx='90' ry='16' fill='url(#emberBO)' filter='url(#softBO)' opacity='0.8'/>
  <ellipse cx='125' cy='178' rx='50' ry='7' fill='#fff8e0' filter='url(#softBO)' opacity='0.55'/>

  <!-- white-hot core at figure base -->
  <ellipse cx='125' cy='170' rx='12' ry='5' fill='#fff8e0' filter='url(#softBO)' opacity='0.9'/>

  <!-- top vignette -->
  <rect width='250' height='50' rx='8' fill='#1a0d08' opacity='0.35'/>
</svg>
