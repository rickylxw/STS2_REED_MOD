<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg2" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3a2a"/>
      <stop offset="30%" stop-color="#3a2a20"/>
      <stop offset="60%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#1a0d08"/>
    </linearGradient>
    <linearGradient id="lin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e6591a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lin5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="50%" stop-color="#ffcc40"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg2)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.05"/>
  <circle cx="33.3" cy="56.9" r="1.1" fill="#ffcc40" opacity="0.51" filter="url(#glow1)"/>
  <circle cx="55.2" cy="161.2" r="1.6" fill="#ff8800" opacity="0.29"/>
  <circle cx="106.4" cy="92.3" r="2.2" fill="#ff8800" opacity="0.53" filter="url(#glow1)"/>
  <circle cx="186.1" cy="19.9" r="1.1" fill="#ff7a1a" opacity="0.57" filter="url(#glow1)"/>
  <circle cx="239.2" cy="13.2" r="1.0" fill="#ff8800" opacity="0.47"/>
  <circle cx="47.5" cy="28.6" r="1.6" fill="#e6591a" opacity="0.41"/>
  <circle cx="52.2" cy="32.3" r="1.5" fill="#ff6600" opacity="0.31" filter="url(#glow1)"/>
  <circle cx="62.4" cy="97.0" r="0.8" fill="#e6591a" opacity="0.33"/>
  <!-- Dome base -->
  <path d="M 40 160 Q 125 40 210 160 Z" fill="url(#lin3)" stroke="#1a0d08" stroke-width="1"/>
  <!-- Crystal facets -->
  <path d="M 85 85.0 L 125 -45 L 165 85.0 Z" fill="url(#lin4)" opacity="0.3" filter="url(#glow1)"/>
  <path d="M 50 111.0 L 80 20 L 110 111.0 Z" fill="url(#lin4)" opacity="0.3" filter="url(#glow1)"/>
  <path d="M 140 111.0 L 170 20 L 200 111.0 Z" fill="url(#lin4)" opacity="0.3" filter="url(#glow1)"/>
  <path d="M 35 139.0 L 60 100 L 85 139.0 Z" fill="url(#lin4)" opacity="0.3" filter="url(#glow1)"/>
  <path d="M 165 139.0 L 190 100 L 215 139.0 Z" fill="url(#lin4)" opacity="0.3" filter="url(#glow1)"/>
  <!-- Glowing cracks between facets -->
  <path d="M 40 160 L 80 100 L 125 55 L 170 100 L 210 160" fill="none" stroke="url(#lin5)" stroke-width="1.5" opacity="0.7" filter="url(#glow1)"/>
  <path d="M 80 100 L 80 160 M 125 55 L 125 160 M 170 100 L 170 160" fill="none" stroke="url(#lin5)" stroke-width="1" opacity="0.5" filter="url(#glow1)"/>
  <!-- Central core -->
  <circle cx="125" cy="110" r="10" fill="#ff8800" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="125" cy="110" r="3" fill="#fff8e0" opacity="0.9"/>
</svg>
