<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgUF' cx='50%' cy='50%' r='80%'>
      <stop offset='0%' stop-color='#1a0d08'/>
      <stop offset='60%' stop-color='#0d0604'/>
      <stop offset='100%' stop-color='#050201'/>
    </radialGradient>
    <filter id='ufGlow' x='-200%' y='-200%' width='500%' height='500%'>
      <feGaussianBlur stdDeviation='3' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='ufBigGlow' x='-200%' y='-200%' width='500%' height='500%'>
      <feGaussianBlur stdDeviation='7' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <radialGradient id='ufCore' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='25%' stop-color='#ffe060'/>
      <stop offset='60%' stop-color='#ff8800' stop-opacity='0.6'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='ufShield' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#ff6b1a' stop-opacity='0.6'/>
      <stop offset='50%' stop-color='#e6591a' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0.15'/>
    </linearGradient>
    <radialGradient id='ufImpact' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0' stop-opacity='0.6'/>
      <stop offset='40%' stop-color='#ff8800' stop-opacity='0.3'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='ufSoft' x='-200%' y='-200%' width='500%' height='500%'>
      <feGaussianBlur stdDeviation='12'/>
    </filter>
    <filter id='ufBigSoft' x='-200%' y='-200%' width='500%' height='500%'>
      <feGaussianBlur stdDeviation='18'/>
    </filter>
    <linearGradient id='ufHaze' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#ff6b1a' stop-opacity='0.08'/>
      <stop offset='50%' stop-color='#ff8800' stop-opacity='0.04'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='ufGlowL' x1='0%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#ff6b1a' stop-opacity='0'/>
      <stop offset='50%' stop-color='#ff8800' stop-opacity='0.3'/>
      <stop offset='100%' stop-color='#ffe060' stop-opacity='0.5'/>
    </linearGradient>
  </defs>

  <rect width='250' height='190' fill='url(#bgUF)' rx='8'/>

  <!-- Atmospheric heat haze -->
  <ellipse cx='125' cy='170' rx='110' ry='30' fill='url(#ufHaze)' filter='url(#ufSoft)'/>
  <ellipse cx='80' cy='140' rx='60' ry='25' fill='url(#ufHaze)' filter='url(#ufSoft)'/>
  <ellipse cx='170' cy='140' rx='60' ry='25' fill='url(#ufHaze)' filter='url(#ufSoft)'/>

  <!-- Background ember particles -->
  <g>
    <circle cx='20' cy='60' r='1.2' fill='#ff8800' opacity='0.4'/>
    <circle cx='230' cy='55' r='1.5' fill='#ffaa30' opacity='0.45'/>
    <circle cx='35' cy='30' r='1' fill='#ffe060' opacity='0.35'/>
    <circle cx='215' cy='25' r='1' fill='#ff8800' opacity='0.3'/>
    <circle cx='100' cy='20' r='1.2' fill='#ffaa30' opacity='0.4'/>
    <circle cx='150' cy='18' r='1' fill='#ffe060' opacity='0.35'/>
    <circle cx='15' cy='110' r='1' fill='#ff8800' opacity='0.3'/>
    <circle cx='235' cy='115' r='1.2' fill='#ffaa30' opacity='0.35'/>
    <circle cx='60' cy='170' r='1' fill='#c41a05' opacity='0.25'/>
    <circle cx='190' cy='168' r='1' fill='#c41a05' opacity='0.25'/>
    <circle cx='90' cy='180' r='0.8' fill='#ff8800' opacity='0.2'/>
    <circle cx='160' cy='178' r='0.8' fill='#ff8800' opacity='0.2'/>
  </g>

  <ellipse cx='125' cy='175' rx='90' ry='15' fill='#2a1815' opacity='0.3'/>

  <!-- Motion lines converging to center -->
  <g stroke='#ff8800' stroke-width='1' opacity='0.25' filter='url(#ufGlow)'>
    <line x1='30' y1='140' x2='95' y2='100'/>
    <line x1='40' y1='115' x2='100' y2='95'/>
    <line x1='50' y1='85' x2='105' y2='92'/>
    <line x1='220' y1='140' x2='155' y2='100'/>
    <line x1='210' y1='115' x2='150' y2='95'/>
    <line x1='200' y1='85' x2='145' y2='92'/>
  </g>

  <!-- Formation: three converging figures -->
  <g filter='url(#ufGlow)'>
    <!-- Left figure flame -->
    <path d='M55 140 C50 120 55 100 65 85 C70 75 75 70 75 70 C72 80 75 90 80 95 C82 85 85 80 90 75 C88 90 90 105 85 120 C82 130 75 140 70 145 Z' fill='url(#ufShield)' opacity='0.7'/>
    <!-- Right figure flame -->
    <path d='M195 140 C200 120 195 100 185 85 C180 75 175 70 175 70 C178 80 175 90 170 95 C168 85 165 80 160 75 C162 90 160 105 165 120 C168 130 175 140 180 145 Z' fill='url(#ufShield)' opacity='0.7'/>
    <!-- Center figure flame -->
    <path d='M125 145 C118 125 122 105 130 88 C135 78 140 70 140 65 C137 80 140 95 145 100 C147 88 150 82 152 75 C150 95 152 115 148 130 C145 140 138 148 132 150 Z' fill='url(#ufShield)' opacity='0.85'/>
  </g>

  <!-- Central impact glow -->
  <circle cx='125' cy='95' r='35' fill='url(#ufImpact)' filter='url(#ufBigSoft)'/>

  <!-- Central united core -->
  <circle cx='125' cy='95' r='20' fill='url(#ufCore)' filter='url(#ufBigGlow)' opacity='0.9'/>
  <circle cx='125' cy='95' r='8' fill='#fff8e0' opacity='0.85' filter='url(#ufGlow)'/>

  <!-- Convergence lines -->
  <g stroke='#ff8800' stroke-width='1.5' opacity='0.4' filter='url(#ufGlow)'>
    <line x1='75' y1='88' x2='112' y2='93'/>
    <line x1='175' y1='88' x2='138' y2='93'/>
  </g>

  <!-- Ground fire -->
  <g filter='url(#ufGlow)'>
    <ellipse cx='125' cy='150' rx='60' ry='8' fill='#ff6b1a' opacity='0.25'/>
    <ellipse cx='125' cy='152' rx='40' ry='5' fill='#ff8800' opacity='0.35'/>
    <ellipse cx='125' cy='154' rx='20' ry='3' fill='#ffe060' opacity='0.4'/>
  </g>

  <!-- Spark burst from center -->
  <g stroke='#ffe060' stroke-width='0.8' opacity='0.5' filter='url(#ufGlow)'>
    <line x1='125' y1='95' x2='90' y2='70'/>
    <line x1='125' y1='95' x2='160' y2='70'/>
    <line x1='125' y1='95' x2='75' y2='85'/>
    <line x1='125' y1='95' x2='175' y2='85'/>
    <line x1='125' y1='95' x2='100' y2='55'/>
    <line x1='125' y1='95' x2='150' y2='55'/>
  </g>

  <!-- Flame tongues at figure tops -->
  <g opacity='0.5' filter='url(#ufGlow)'>
    <path d='M72,68 Q70,58 73,48 Q76,58 74,68 Z' fill='#ff8800'/>
    <path d='M178,68 Q180,58 177,48 Q174,58 176,68 Z' fill='#ff8800'/>
  </g>

  <!-- Floating embers around formation -->
  <g filter='url(#ufGlow)'>
    <circle cx='40' cy='50' r='2' fill='#ffe060' opacity='0.7'/>
    <circle cx='210' cy='50' r='2' fill='#ffaa30' opacity='0.7'/>
    <circle cx='125' cy='35' r='2.5' fill='#ffe060' opacity='0.8'/>
    <circle cx='65' cy='40' r='1.5' fill='#ff8800' opacity='0.55'/>
    <circle cx='185' cy='40' r='1.5' fill='#ff8800' opacity='0.55'/>
    <circle cx='45' cy='100' r='1.5' fill='#ffaa30' opacity='0.5'/>
    <circle cx='205' cy='100' r='1.5' fill='#ffaa30' opacity='0.5'/>
    <circle cx='80' cy='160' r='1.5' fill='#ff8800' opacity='0.5'/>
    <circle cx='170' cy='160' r='1.5' fill='#ff8800' opacity='0.5'/>
    <circle cx='125' cy='165' r='2' fill='#ffe060' opacity='0.55'/>
  </g>

  <!-- Flame trails -->
  <g opacity='0.4' filter='url(#ufGlow)'>
    <path d='M40,47 Q38,38 40,28 Q42,38 40,47 Z' fill='#ff8800'/>
    <path d='M210,47 Q212,38 210,28 Q208,38 210,47 Z' fill='#ff8800'/>
    <path d='M125,32 Q123,22 125,12 Q127,22 125,32 Z' fill='#ff8800'/>
  </g>

  <!-- Extra rising embers -->
  <g filter='url(#ufGlow)'>
    <circle cx='55' cy='55' r='1.5' fill='#ffe060' opacity='0.6'/>
    <circle cx='195' cy='55' r='1.5' fill='#ffaa30' opacity='0.6'/>
    <circle cx='110' cy='40' r='1.2' fill='#ff8800' opacity='0.5'/>
    <circle cx='140' cy='42' r='1.2' fill='#ffe060' opacity='0.5'/>
    <circle cx='70' cy='25' r='1' fill='#ffaa30' opacity='0.4'/>
    <circle cx='180' cy='22' r='1' fill='#ff8800' opacity='0.4'/>
  </g>

  <!-- Small dim embers -->
  <g>
    <circle cx='25' cy='80' r='0.8' fill='#ff8800' opacity='0.35'/>
    <circle cx='225' cy='80' r='0.8' fill='#ffe060' opacity='0.35'/>
    <circle cx='55' cy='120' r='0.6' fill='#c41a05' opacity='0.25'/>
    <circle cx='195' cy='120' r='0.6' fill='#c41a05' opacity='0.25'/>
    <circle cx='105' cy='170' r='0.6' fill='#ff8800' opacity='0.25'/>
    <circle cx='145' cy='168' r='0.6' fill='#c41a05' opacity='0.2'/>
  </g>

  <!-- Bottom ember glow -->
  <ellipse cx='125' cy='185' rx='80' ry='10' fill='#ff6b1a' opacity='0.15' filter='url(#ufBigSoft)'/>
  <!-- Top ember glow -->
  <ellipse cx='125' cy='10' rx='70' ry='8' fill='#ff8800' opacity='0.1' filter='url(#ufBigSoft)'/>
</svg>