<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgCS' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <linearGradient id='bladeCS' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='25%' stop-color='#ffd440'/>
      <stop offset='55%' stop-color='#ff7a1a'/>
      <stop offset='85%' stop-color='#c4350a'/>
      <stop offset='100%' stop-color='#6a1a05'/>
    </linearGradient>
    <linearGradient id='shaftCS' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#3a1f15'/>
      <stop offset='50%' stop-color='#5a3828'/>
      <stop offset='100%' stop-color='#3a1f15'/>
    </linearGradient>
    <linearGradient id='trailCS' x1='100%' y1='100%' x2='0%' y2='0%'>
      <stop offset='0%' stop-color='#8a2a05' stop-opacity='0'/>
      <stop offset='30%' stop-color='#c41a05' stop-opacity='0.3'/>
      <stop offset='60%' stop-color='#e6591a' stop-opacity='0.5'/>
      <stop offset='90%' stop-color='#ffaa30' stop-opacity='0.7'/>
      <stop offset='100%' stop-color='#fff8e0' stop-opacity='0.8'/>
    </linearGradient>
    <radialGradient id='cinderGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0' stop-opacity='0.9'/>
      <stop offset='40%' stop-color='#ff8800' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='impactCS' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0' stop-opacity='1'/>
      <stop offset='20%' stop-color='#ffe060' stop-opacity='0.8'/>
      <stop offset='50%' stop-color='#ff8800' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowCS'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='softCS'>
      <feGaussianBlur stdDeviation='5' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>

  <rect width='250' height='190' fill='url(#bgCS)' rx='8'/>

  <!-- Atmospheric heat haze layers -->
  <ellipse cx='125' cy='95' rx='120' ry='80' fill='#e6591a' opacity='0.04' filter='url(#softCS)'/>
  <ellipse cx='125' cy='50' rx='100' ry='30' fill='#ff8800' opacity='0.03'/>
  <ellipse cx='125' cy='140' rx='100' ry='30' fill='#c41a05' opacity='0.03'/>

  <!-- Background ember particles -->
  <circle cx='30' cy='40' r='1.5' fill='#ff8800' opacity='0.5' filter='url(#glowCS)'/>
  <circle cx='55' cy='25' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='80' cy='55' r='1.2' fill='#e6591a' opacity='0.4'/>
  <circle cx='200' cy='35' r='1.5' fill='#ff8800' opacity='0.5'/>
  <circle cx='220' cy='70' r='1' fill='#ffaa30' opacity='0.5'/>
  <circle cx='180' cy='160' r='1.5' fill='#e6591a' opacity='0.4'/>
  <circle cx='40' cy='140' r='1' fill='#ff8800' opacity='0.4'/>
  <circle cx='100' cy='170' r='1.5' fill='#c41a05' opacity='0.3'/>
  <circle cx='230' cy='120' r='1.2' fill='#ff8800' opacity='0.4'/>
  <circle cx='15' cy='90' r='1' fill='#ffaa30' opacity='0.3'/>
  <circle cx='235' cy='100' r='1' fill='#ff8800' opacity='0.3'/>
  <circle cx='170' cy='25' r='0.8' fill='#ffe060' opacity='0.4'/>
  <circle cx='25' cy='120' r='0.8' fill='#c41a05' opacity='0.25'/>

  <!-- Thrust motion lines (parallel to spear directions) -->
  <line x1='80' y1='15' x2='95' y2='5' stroke='#ff8800' stroke-width='1' opacity='0.2'/>
  <line x1='90' y1='20' x2='105' y2='8' stroke='#ffaa30' stroke-width='0.8' opacity='0.15'/>
  <line x1='155' y1='175' x2='170' y2='185' stroke='#ff8800' stroke-width='1' opacity='0.2'/>
  <line x1='145' y1='170' x2='160' y2='182' stroke='#ffaa30' stroke-width='0.8' opacity='0.15'/>
  <line x1='70' y1='50' x2='60' y2='40' stroke='#e6591a' stroke-width='1' opacity='0.2'/>
  <line x1='180' y1='140' x2='190' y2='150' stroke='#e6591a' stroke-width='1' opacity='0.2'/>

  <!-- dual spear thrusts (crossed) -->
  <g transform='rotate(-15 125 95)'>
    <!-- fire glow -->
    <ellipse cx='125' cy='35' rx='30' ry='35' fill='url(#cinderGlow)' filter='url(#glowCS)'/>

    <!-- shaft -->
    <rect x='120' y='50' width='8' height='110' fill='url(#shaftCS)' rx='2'/>
    <rect x='119' y='110' width='10' height='2' fill='#1a0d08' opacity='0.7'/>
    <rect x='119' y='130' width='10' height='2' fill='#1a0d08' opacity='0.7'/>

    <!-- guard -->
    <rect x='107' y='46' width='36' height='5' fill='#4a2818' rx='2'/>

    <!-- blade -->
    <path d='M 125 12 L 116 30 Q 113 40 116 50 L 125 48 L 134 50 Q 137 40 134 30 Z' fill='url(#bladeCS)' filter='url(#glowCS)'/>

    <!-- white-hot tip -->
    <circle cx='125' cy='14' r='4' fill='#fff8e0' opacity='0.8' filter='url(#glowCS)'/>

    <!-- impact glow at tip -->
    <circle cx='125' cy='14' r='18' fill='url(#impactCS)' filter='url(#glowCS)'/>

    <!-- side flames -->
    <path d='M 110 45 Q 100 30 105 15 Q 98 5 100 0 Q 108 10 110 25 Q 105 35 115 42 Z' fill='#ff8800' opacity='0.6' filter='url(#glowCS)'/>
    <path d='M 140 45 Q 150 30 145 15 Q 152 5 150 0 Q 142 10 140 25 Q 145 35 135 42 Z' fill='#ff8800' opacity='0.6' filter='url(#glowCS)'/>

    <!-- fire trail behind blade -->
    <path d='M 115 45 Q 112 60 116 80 Q 114 95 118 110 L 128 108 Q 126 95 128 80 Q 132 60 130 45 Z'
          fill='url(#trailCS)' filter='url(#glowCS)' opacity='0.5'/>

    <!-- spark burst at tip -->
    <line x1='125' y1='14' x2='110' y2='0' stroke='#fff8e0' stroke-width='1.2' opacity='0.7'/>
    <line x1='125' y1='14' x2='125' y2='-5' stroke='#ffe060' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='14' x2='140' y2='0' stroke='#ffaa30' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='14' x2='115' y2='5' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='14' x2='135' y2='5' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
  </g>

  <g transform='rotate(15 125 95)'>
    <!-- fire glow -->
    <ellipse cx='125' cy='150' rx='28' ry='32' fill='url(#cinderGlow)' filter='url(#glowCS)'/>

    <!-- shaft (pointing down) -->
    <rect x='121' y='40' width='8' height='110' fill='url(#shaftCS)' rx='2'/>
    <rect x='120' y='80' width='10' height='2' fill='#1a0d08' opacity='0.7'/>
    <rect x='120' y='100' width='10' height='2' fill='#1a0d08' opacity='0.7'/>

    <!-- guard -->
    <rect x='107' y='142' width='36' height='5' fill='#4a2818' rx='2'/>

    <!-- blade (pointing down) -->
    <path d='M 125 178 L 116 160 Q 113 150 116 140 L 125 142 L 134 140 Q 137 150 134 160 Z' fill='url(#bladeCS)' filter='url(#glowCS)'/>

    <!-- white-hot tip -->
    <circle cx='125' cy='176' r='4' fill='#fff8e0' opacity='0.8' filter='url(#glowCS)'/>

    <!-- impact glow at tip -->
    <circle cx='125' cy='176' r='16' fill='url(#impactCS)' filter='url(#glowCS)'/>

    <!-- side flames -->
    <path d='M 110 145 Q 100 160 105 175 Q 98 185 100 190 Q 108 180 110 165 Q 105 155 115 148 Z' fill='#ff8800' opacity='0.6' filter='url(#glowCS)'/>
    <path d='M 140 145 Q 150 160 145 175 Q 152 185 150 190 Q 142 180 140 165 Q 145 155 135 148 Z' fill='#ff8800' opacity='0.6' filter='url(#glowCS)'/>

    <!-- fire trail behind blade -->
    <path d='M 115 145 Q 112 130 116 110 Q 114 95 118 80 L 128 82 Q 126 95 128 110 Q 132 130 130 145 Z'
          fill='url(#trailCS)' filter='url(#glowCS)' opacity='0.5'/>

    <!-- spark burst at tip -->
    <line x1='125' y1='176' x2='110' y2='190' stroke='#fff8e0' stroke-width='1.2' opacity='0.7'/>
    <line x1='125' y1='176' x2='125' y2='195' stroke='#ffe060' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='176' x2='140' y2='190' stroke='#ffaa30' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='176' x2='115' y2='185' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='176' x2='135' y2='185' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
  </g>

  <!-- rising cinders (enriched) -->
  <circle cx='95' cy='20' r='1.2' fill='#ffe060' opacity='0.6' filter='url(#glowCS)'/>
  <circle cx='155' cy='25' r='1' fill='#ff8800' opacity='0.5'/>
  <circle cx='85' cy='170' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='165' cy='165' r='1.2' fill='#ff8800' opacity='0.4'/>
  <circle cx='50' cy='60' r='1' fill='#ff8800' opacity='0.4' filter='url(#glowCS)'/>
  <circle cx='200' cy='130' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='70' cy='30' r='0.8' fill='#c41a05' opacity='0.3'/>
  <circle cx='180' cy='155' r='0.8' fill='#c41a05' opacity='0.3'/>
  <circle cx='105' cy='180' r='0.8' fill='#ff8800' opacity='0.3'/>
  <circle cx='145' cy='10' r='0.8' fill='#ffe060' opacity='0.4'/>

  <!-- Bottom ember glow -->
  <ellipse cx='125' cy='185' rx='40' ry='6' fill='#8a2a05' opacity='0.2'/>
  <circle cx='120' cy='183' r='1.2' fill='#ff8800' opacity='0.5'/>
  <circle cx='130' cy='184' r='1' fill='#ffaa30' opacity='0.4'/>

  <!-- Top ember glow -->
  <ellipse cx='125' cy='8' rx='35' ry='5' fill='#8a2a05' opacity='0.2'/>
  <circle cx='120' cy='8' r='1.2' fill='#ff8800' opacity='0.5'/>
  <circle cx='130' cy='10' r='1' fill='#ffaa30' opacity='0.4'/>
</svg>
