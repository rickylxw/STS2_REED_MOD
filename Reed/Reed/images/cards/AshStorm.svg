<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgAS' cx='50%' cy='45%' r='80%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#080302'/>
    </radialGradient>
    <linearGradient id='funnelAS' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#3a2818' stop-opacity='0.6'/>
      <stop offset='40%' stop-color='#2a1815' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#1a0d08' stop-opacity='0.2'/>
    </linearGradient>
    <filter id='glowAS' x='-100%' y='-100%' width='300%' height='300%'>
      <feGaussianBlur stdDeviation='3' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='bigGlowAS' x='-100%' y='-100%' width='300%' height='300%'>
      <feGaussianBlur stdDeviation='8'/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width='250' height='190' fill='url(#bgAS)' rx='8'/>

  <!-- Top ash cloud -->
  <ellipse cx='125' cy='25' rx='85' ry='22' fill='#2a1815' opacity='0.5'/>
  <ellipse cx='100' cy='20' rx='50' ry='16' fill='#3a2018' opacity='0.35'/>
  <ellipse cx='150' cy='28' rx='50' ry='14' fill='#3a2018' opacity='0.3'/>
  <ellipse cx='125' cy='22' rx='35' ry='10' fill='#4a2820' opacity='0.25'/>

  <!-- Funnel shape -->
  <path d='M 55,25 L 195,25 Q 182,55 172,85 Q 162,115 145,150 L 105,150 Q 93,115 83,85 Q 73,55 55,25 Z' fill='url(#funnelAS)'/>

  <!-- Spiral curves (showing rotation) -->
  <g fill='none' opacity='0.3'>
    <path d='M 60,28 Q 95,45 78,75 Q 72,105 92,135 Q 105,148 112,152' stroke='#4a3020' stroke-width='2'/>
    <path d='M 190,28 Q 155,45 172,75 Q 178,105 158,135 Q 145,148 138,152' stroke='#4a3020' stroke-width='2'/>
    <path d='M 80,30 Q 120,50 100,85 Q 88,115 110,148' stroke='#3a2818' stroke-width='1.5'/>
    <path d='M 170,30 Q 130,50 150,85 Q 162,115 140,148' stroke='#3a2818' stroke-width='1.5'/>
    <path d='M 125,22 Q 105,55 118,95 Q 125,125 125,150' stroke='#3a2818' stroke-width='1.5'/>
  </g>

  <!-- Horizontal swirl bands -->
  <g fill='none' opacity='0.2'>
