    <path d='M 68,55 Q 125,48 182,55' stroke='#4a3020' stroke-width='2'/>
    <path d='M 78,80 Q 125,73 172,80' stroke='#4a3020' stroke-width='1.5'/>
    <path d='M 90,105 Q 125,100 160,105' stroke='#3a2818' stroke-width='1.5'/>
    <path d='M 100,128 Q 125,124 150,128' stroke='#3a2818' stroke-width='1'/>
  </g>

