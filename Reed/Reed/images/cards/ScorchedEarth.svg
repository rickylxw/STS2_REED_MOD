<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <linearGradient id='skyGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#1a0d08'/>
      <stop offset='0.55' stop-color='#2a1815'/>
      <stop offset='0.8' stop-color='#8a2a05'/>
      <stop offset='1' stop-color='#c41a05'/>
    </linearGradient>
    <linearGradient id='groundGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#3a2418'/>
      <stop offset='0.25' stop-color='#1a0d08'/>
      <stop offset='1' stop-color='#0a0504'/>
    </linearGradient>
    <radialGradient id='horizonGlow' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#ff8800' stop-opacity='0.9'/>
      <stop offset='0.5' stop-color='#c41a05' stop-opacity='0.4'/>
      <stop offset='1' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='lavaCrack' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.35' stop-color='#ffe060'/>
      <stop offset='0.7' stop-color='#ff8800'/>
      <stop offset='1' stop-color='#c41a05'/>
    </linearGradient>
    <linearGradient id='flameVent' x1='0' y1='1' x2='0' y2='0'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.3' stop-color='#ffe060'/>
      <stop offset='0.6' stop-color='#ff8800'/>
      <stop offset='1' stop-color='#c41a05' stop-opacity='0'/>
    </linearGradient>
    <radialGradient id='emberGlow' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.4' stop-color='#ffcc40'/>
      <stop offset='0.8' stop-color='#e6591a'/>
      <stop offset='1' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='softBlur'><feGaussianBlur stdDeviation='2.5'/></filter>
    <filter id='bigBlur'><feGaussianBlur stdDeviation='7'/></filter>
  </defs>

  <!-- sky -->
  <rect width='250' height='190' rx='8' fill='#1a0d08'/>
  <rect width='250' height='95' rx='8' fill='url(#skyGrad)'/>
  <!-- horizon glow -->
  <ellipse cx='125' cy='88' rx='150' ry='35' fill='url(#horizonGlow)' filter='url(#bigBlur)' opacity='0.8'/>

  <!-- scorched ground -->
  <path d='M0,80 Q60,72 125,78 T250,80 L250,190 L0,190 Z' fill='url(#groundGrad)'/>
  <!-- ground texture patches -->
  <path d='M0,110 Q70,104 140,112 T250,108 L250,190 L0,190 Z' fill='#1a0d08' opacity='0.5'/>

  <!-- distant mountain silhouettes -->
  <path d='M0,82 L25,68 L45,80 L70,62 L95,80 L120,70 L150,78 L180,60 L210,76 L235,66 L250,80 L250,90 L0,90 Z' fill='#0a0504' opacity='0.85'/>

  <!-- glowing lava cracks spreading across ground -->
  <path d='M20,100 C40,108 55,104 75,120 C90,132 80,150 95,165 C110,178 130,170 150,180 C170,188 180,172 205,180 C220,184 230,170 250,178' fill='none' stroke='url(#lavaCrack)' stroke-width='2.2' filter='url(#softBlur)' opacity='0.9'/>
  <path d='M20,100 C40,108 55,104 75,120 C90,132 80,150 95,165 C110,178 130,170 150,180 C170,188 180,172 205,180 C220,184 230,170 250,178' fill='none' stroke='#fff8e0' stroke-width='0.8' opacity='0.7'/>

  <path d='M10,130 C30,128 50,140 70,135 C95,128 110,145 130,142 C155,138 170,158 195,150 C215,144 235,160 250,155' fill='none' stroke='url(#lavaCrack)' stroke-width='1.8' filter='url(#softBlur)' opacity='0.85'/>
  <path d='M10,130 C30,128 50,140 70,135 C95,128 110,145 130,142 C155,138 170,158 195,150 C215,144 235,160 250,155' fill='none' stroke='#ffe060' stroke-width='0.6' opacity='0.6'/>

  <!-- branching crack -->
  <path d='M75,120 C80,108 95,100 105,95 C115,90 125,95 135,100' fill='none' stroke='url(#lavaCrack)' stroke-width='1.6' filter='url(#softBlur)' opacity='0.85'/>
  <path d='M95,165 C100,150 95,138 90,128' fill='none' stroke='url(#lavaCrack)' stroke-width='1.4' filter='url(#softBlur)' opacity='0.8'/>
  <path d='M150,180 C160,165 165,150 160,135' fill='none' stroke='url(#lavaCrack)' stroke-width='1.5' filter='url(#softBlur)' opacity='0.8'/>

  <!-- small cracks -->
  <path d='M30,150 L42,158 M55,135 L48,148 M180,108 L195,100 M210,130 L222,140 M115,118 L128,110 M165,120 L178,128' stroke='url(#lavaCrack)' stroke-width='1.2' fill='none' opacity='0.75'/>

  <!-- dark crack edges (charred ground around lava) -->
  <path d='M20,100 C40,108 55,104 75,120 C90,132 80,150 95,165 C110,178 130,170 150,180 C170,188 180,172 205,180 C220,184 230,170 250,178' fill='none' stroke='#0a0504' stroke-width='5' opacity='0.6'/>

  <!-- flame vents bursting from cracks -->
  <path d='M75,120 C70,108 78,96 73,84 C80,92 76,78 82,70 C86,80 90,90 88,100 C92,108 88,118 75,120 Z' fill='url(#flameVent)' opacity='0.9'/>
  <path d='M150,180 C145,168 152,156 148,144 C155,150 158,138 162,130 C166,140 170,150 165,160 C170,168 162,178 150,180 Z' fill='url(#flameVent)' opacity='0.9'/>
  <path d='M205,180 C200,168 206,156 202,144 C209,150 211,138 214,130 C218,142 220,152 216,162 C220,170 214,178 205,180 Z' fill='url(#flameVent)' opacity='0.85'/>

  <!-- glowing spots along cracks -->
  <circle cx='75' cy='120' r='3' fill='url(#emberGlow)' opacity='0.95'/>
  <circle cx='150' cy='180' r='3' fill='url(#emberGlow)' opacity='0.95'/>
  <circle cx='205' cy='180' r='3' fill='url(#emberGlow)' opacity='0.9'/>
  <circle cx='95' cy='165' r='2.5' fill='url(#emberGlow)' opacity='0.9'/>
  <circle cx='40' cy='108' r='2' fill='url(#emberGlow)' opacity='0.85'/>
  <circle cx='130' cy='142' r='2' fill='url(#emberGlow)' opacity='0.85'/>
  <circle cx='195' cy='150' r='2' fill='url(#emberGlow)' opacity='0.85'/>

  <!-- ash/dust in the air -->
  <circle cx='60' cy='50' r='1.4' fill='#3a2418' opacity='0.6'/>
  <circle cx='90' cy='35' r='1.2' fill='#2a1815' opacity='0.55'/>
  <circle cx='130' cy='45' r='1.4' fill='#3a2418' opacity='0.6'/>
  <circle cx='170' cy='30' r='1.2' fill='#2a1815' opacity='0.55'/>
  <circle cx='200' cy='50' r='1.4' fill='#3a2418' opacity='0.6'/>
  <circle cx='40' cy='65' r='1' fill='#2a1815' opacity='0.5'/>
  <circle cx='110' cy='60' r='1' fill='#3a2418' opacity='0.5'/>
  <circle cx='220' cy='65' r='1' fill='#2a1815' opacity='0.5'/>
  <circle cx='75' cy='55' r='0.9' fill='#3a2418' opacity='0.45'/>
  <circle cx='185' cy='58' r='0.9' fill='#3a2418' opacity='0.45'/>

  <!-- floating embers -->
  <circle cx='78' cy='75' r='1' fill='#ffe060' opacity='0.8'/>
  <circle cx='152' cy='140' r='1' fill='#ffcc40' opacity='0.75'/>
  <circle cx='208' cy='140' r='1' fill='#ffe060' opacity='0.75'/>
  <circle cx='96' cy='125' r='0.9' fill='#ff8800' opacity='0.7'/>

  <!-- top vignette -->
  <rect width='250' height='45' rx='8' fill='#1a0d08' opacity='0.4'/>
  <!-- bottom vignette -->
  <rect y='150' width='250' height='40' rx='8' fill='#0a0504' opacity='0.5'/>
</svg>
