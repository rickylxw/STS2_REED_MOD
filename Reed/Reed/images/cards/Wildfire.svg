<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
<defs>
  <radialGradient id='bgWF' cx='70%' cy='50%' r='80%'>
    <stop offset='0%' stop-color='#3a2010'/>
    <stop offset='40%' stop-color='#2a1815'/>
    <stop offset='100%' stop-color='#1a0d08'/>
  </radialGradient>
  <radialGradient id='flameGWF' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#fff8e0' stop-opacity='0.9'/>
    <stop offset='15%' stop-color='#ffe060' stop-opacity='0.8'/>
    <stop offset='35%' stop-color='#ffaa30' stop-opacity='0.7'/>
    <stop offset='60%' stop-color='#ff8800' stop-opacity='0.5'/>
    <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
  </radialGradient>
  <radialGradient id='glowWF' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#ff8800' stop-opacity='0.5'/>
    <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
  </radialGradient>
  <radialGradient id='bigGlowWF' cx='60%' cy='50%' r='60%'>
    <stop offset='0%' stop-color='#c41a05' stop-opacity='0.2'/>
    <stop offset='100%' stop-color='#1a0d08' stop-opacity='0'/>
  </radialGradient>
  <linearGradient id='smokeGWF' x1='0%' y1='100%' x2='0%' y2='0%'>
    <stop offset='0%' stop-color='#3a2818' stop-opacity='0.6'/>
    <stop offset='50%' stop-color='#2a1815' stop-opacity='0.4'/>
    <stop offset='100%' stop-color='#1a0d08' stop-opacity='0'/>
  </linearGradient>
  <linearGradient id='groundGWF' x1='0%' y1='0%' x2='100%' y2='0%'>
    <stop offset='0%' stop-color='#ff8800' stop-opacity='0.4'/>
    <stop offset='30%' stop-color='#c41a05' stop-opacity='0.3'/>
    <stop offset='70%' stop-color='#8a2a05' stop-opacity='0.15'/>
    <stop offset='100%' stop-color='#2a1815' stop-opacity='0'/>
  </linearGradient>
  <filter id='blurWF' x='-20%' y='-20%' width='140%' height='140%'>
    <feGaussianBlur stdDeviation='3'/>
  </filter>
  <filter id='bigBlurWF' x='-30%' y='-30%' width='160%' height='160%'>
    <feGaussianBlur stdDeviation='8'/>
  </filter>
</defs>

<!-- Background -->
<rect width='250' height='190' fill='url(#bgWF)' rx='8'/>

