<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg2" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a2a05" stop-opacity="0"/>
      <stop offset="20%" stop-color="#e6591a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="1"/>
      <stop offset="80%" stop-color="#ffe060" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lin4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a1f15"/>
      <stop offset="50%" stop-color="#2a1815"/>
      <stop offset="100%" stop-color="#3a1f15"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg2)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.06"/>
  <circle cx="91.8" cy="181.9" r="1.2" fill="#e6591a" opacity="0.28"/>
  <circle cx="139.3" cy="138.5" r="1.7" fill="#ff6600" opacity="0.63"/>
  <circle cx="35.4" cy="155.2" r="1.0" fill="#c41a05" opacity="0.30"/>
  <circle cx="81.0" cy="181.7" r="1.7" fill="#fff8e0" opacity="0.50" filter="url(#glow1)"/>
  <circle cx="107.5" cy="143.9" r="2.0" fill="#ffcc40" opacity="0.21" filter="url(#glow1)"/>
  <circle cx="163.4" cy="57.3" r="2.2" fill="#e6591a" opacity="0.25" filter="url(#glow1)"/>
  <circle cx="226.5" cy="49.2" r="1.9" fill="#ff7a1a" opacity="0.43" filter="url(#glow1)"/>
  <circle cx="20.3" cy="90.2" r="1.1" fill="#ffe060" opacity="0.57" filter="url(#glow1)"/>
  <!-- Conduit tube -->
  <rect x="110" y="15" width="30" height="160" fill="url(#lin4)" rx="5"/>
  <rect x="112" y="15" width="26" height="160" fill="url(#lin3)" rx="3" filter="url(#glow1)"/>
  <!-- Flow streaks -->
  <rect x="116" y="20" width="2" height="150" fill="#fff8e0" opacity="0.2" rx="1"/>
  <rect x="122" y="20" width="2" height="150" fill="#fff8e0" opacity="0.2" rx="1"/>
  <rect x="128" y="20" width="2" height="150" fill="#fff8e0" opacity="0.2" rx="1"/>
  <rect x="134" y="20" width="2" height="150" fill="#fff8e0" opacity="0.2" rx="1"/>
  <!-- Energy nodes along conduit -->
  <ellipse cx="125" cy="40" rx="20" ry="6" fill="#ff8800" opacity="0.4" filter="url(#glow1)"/>
  <ellipse cx="125" cy="40" rx="10" ry="3" fill="#ffe060" opacity="0.5" filter="url(#glow1)"/>
  <ellipse cx="125" cy="80" rx="20" ry="6" fill="#ff8800" opacity="0.4" filter="url(#glow1)"/>
  <ellipse cx="125" cy="80" rx="10" ry="3" fill="#ffe060" opacity="0.5" filter="url(#glow1)"/>
  <ellipse cx="125" cy="120" rx="20" ry="6" fill="#ff8800" opacity="0.4" filter="url(#glow1)"/>
  <ellipse cx="125" cy="120" rx="10" ry="3" fill="#ffe060" opacity="0.5" filter="url(#glow1)"/>
  <ellipse cx="125" cy="160" rx="20" ry="6" fill="#ff8800" opacity="0.4" filter="url(#glow1)"/>
  <ellipse cx="125" cy="160" rx="10" ry="3" fill="#ffe060" opacity="0.5" filter="url(#glow1)"/>
  <!-- Top and bottom caps -->
  <ellipse cx="125" cy="15" rx="18" ry="6" fill="#ff8800" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="125" cy="15" r="5" fill="#fff8e0" opacity="0.9"/>
  <ellipse cx="125" cy="175" rx="18" ry="6" fill="#e6591a" opacity="0.5" filter="url(#glow1)"/>
  <!-- Embers flowing up -->
  <circle cx="118" cy="100" r="1.5" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="132" cy="70" r="1.5" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="120" cy="50" r="2" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="130" cy="30" r="1.5" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="115" cy="120" r="1" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="135" cy="140" r="1" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
</svg>
