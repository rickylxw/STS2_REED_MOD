<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgEC' cx='50%' cy='50%' r='75%'>
      <stop offset='0%' stop-color='#2a1505'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <linearGradient id='pipeMetalEC' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#7a6a5a'/>
      <stop offset='25%' stop-color='#4a3a2a'/>
      <stop offset='50%' stop-color='#2a2018'/>
      <stop offset='75%' stop-color='#1a1410'/>
      <stop offset='100%' stop-color='#0a0804'/>
    </linearGradient>
    <linearGradient id='pipeInnerEC' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='15%' stop-color='#ffe060'/>
      <stop offset='40%' stop-color='#ff8800'/>
      <stop offset='70%' stop-color='#e6591a'/>
      <stop offset='100%' stop-color='#c41a05'/>
    </linearGradient>
    <linearGradient id='glowTubeEC' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#ffe060' stop-opacity='0.9'/>
      <stop offset='30%' stop-color='#ff8800' stop-opacity='0.7'/>
      <stop offset='60%' stop-color='#e6591a' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0.3'/>
    </linearGradient>
    <radialGradient id='emberEC' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='35%' stop-color='#ffcc40'/>
      <stop offset='75%' stop-color='#e6591a'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowEC'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
    <filter id='bigEC'><feGaussianBlur stdDeviation='7'/></filter>
  </defs>

  <rect width='250' height='190' rx='8' fill='url(#bgEC)'/>

  <!-- ambient heat haze -->
  <ellipse cx='125' cy='95' rx='100' ry='80' fill='#e6591a' opacity='0.05' filter='url(#bigEC)'/>

  <!-- background embers -->
  <circle cx='30' cy='40' r='1.2' fill='#ff8800' opacity='0.5' filter='url(#glowEC)'/>
  <circle cx='220' cy='35' r='1.5' fill='#ffaa00' opacity='0.5'/>
  <circle cx='200' cy='160' r='1.2' fill='#e6591a' opacity='0.4'/>
  <circle cx='40' cy='155' r='1' fill='#ff8800' opacity='0.4'/>

  <!-- pipe outer glow -->
  <ellipse cx='125' cy='95' rx='30' ry='70' fill='url(#emberEC)' opacity='0.25' filter='url(#bigEC)'/>

  <!-- conduit pipe body (vertical, curved segments) -->
  <!-- top elbow joint -->
  <rect x='105' y='20' width='40' height='15' fill='url(#pipeMetalEC)' rx='4' stroke='#1a0d08' stroke-width='1'/>
  <rect x='110' y='22' width='30' height='4' fill='#5a4838' opacity='0.5' rx='2'/>

  <!-- vertical pipe shaft -->
  <rect x='110' y='30' width='30' height='130' fill='url(#pipeMetalEC)' stroke='#1a0d08' stroke-width='1' rx='2'/>

  <!-- pipe metal highlight (left edge) -->
  <rect x='112' y='32' width='4' height='126' fill='#8a7868' opacity='0.3' rx='2'/>
  <!-- pipe metal shadow (right edge) -->
  <rect x='134' y='32' width='4' height='126' fill='#0a0804' opacity='0.5' rx='2'/>

  <!-- pipe bands/joints -->
  <rect x='103' y='55' width='44' height='8' fill='#3a2c20' stroke='#1a0d08' stroke-width='1' rx='3'/>
  <rect x='103' y='95' width='44' height='8' fill='#3a2c20' stroke='#1a0d08' stroke-width='1' rx='3'/>
  <rect x='103' y='135' width='44' height='8' fill='#3a2c20' stroke='#1a0d08' stroke-width='1' rx='3'/>

  <!-- band rivets -->
  <circle cx='110' cy='59' r='1.5' fill='#5a4838'/>
  <circle cx='140' cy='59' r='1.5' fill='#5a4838'/>
  <circle cx='110' cy='99' r='1.5' fill='#5a4838'/>
  <circle cx='140' cy='99' r='1.5' fill='#5a4838'/>
  <circle cx='110' cy='139' r='1.5' fill='#5a4838'/>
  <circle cx='140' cy='139' r='1.5' fill='#5a4838'/>

  <!-- glowing tube interior (the channel) -->
  <rect x='118' y='30' width='14' height='130' fill='url(#pipeInnerEC)' rx='3' opacity='0.9'/>
  <!-- inner glow overlay -->
  <rect x='119' y='32' width='12' height='126' fill='url(#glowTubeEC)' rx='2' opacity='0.6'/>

  <!-- brightest core of tube -->
  <rect x='121' y='35' width='8' height='120' fill='#fff8e0' opacity='0.4' rx='2' filter='url(#glowEC)'/>

  <!-- flame flowing through tube (wavy) -->
  <path d='M 125,35 Q 120,50 125,65 Q 130,80 125,95 Q 120,110 125,125 Q 130,140 125,155' fill='none' stroke='#ffe060' stroke-width='2' opacity='0.6' filter='url(#glowEC)'/>
  <path d='M 123,40 Q 128,55 123,70 Q 118,85 123,100 Q 128,115 123,130 Q 128,145 123,158' fill='none' stroke='#ff8800' stroke-width='1.5' opacity='0.4'/>

  <!-- top opening (ember spout) -->
  <ellipse cx='125' cy='20' rx='20' ry='6' fill='#1a0d08'/>
  <ellipse cx='125' cy='20' rx='16' ry='4' fill='url(#pipeInnerEC)' filter='url(#glowEC)'/>
  <ellipse cx='125' cy='19' rx='8' ry='2.5' fill='#fff8e0' opacity='0.85'/>

  <!-- bottom opening (ember intake) -->
  <rect x='100' y='158' width='50' height='12' fill='url(#pipeMetalEC)' rx='4' stroke='#1a0d08' stroke-width='1'/>
  <ellipse cx='125' cy='168' rx='20' ry='5' fill='#1a0d08'/>
  <ellipse cx='125' cy='168' rx='16' ry='3.5' fill='url(#pipeInnerEC)' filter='url(#glowEC)'/>

  <!-- flames erupting from top -->
  <path d='M 112,20 Q 108,8 115,0 Q 118,10 120,18 Z' fill='#ff8800' opacity='0.7' filter='url(#glowEC)'/>
  <path d='M 125,20 Q 122,5 128,-2 Q 130,8 130,18 Z' fill='#ffaa00' opacity='0.7' filter='url(#glowEC)'/>
  <path d='M 138,20 Q 142,8 135,0 Q 132,10 130,18 Z' fill='#ff8800' opacity='0.6' filter='url(#glowEC)'/>

  <!-- embers escaping from joints -->
  <circle cx='100' cy='59' r='1.5' fill='#ffe060' opacity='0.7' filter='url(#glowEC)'/>
  <circle cx='150' cy='99' r='1.2' fill='#ff8800' opacity='0.6'/>
  <circle cx='98' cy='139' r='1.5' fill='#ffaa00' opacity='0.65' filter='url(#glowEC)'/>
  <circle cx='152' cy='139' r='1' fill='#e6591a' opacity='0.5'/>
  <circle cx='95' cy='60' r='0.8' fill='#ff8800' opacity='0.4'/>
  <circle cx='155' cy='100' r='0.8' fill='#c41a05' opacity='0.35'/>

  <!-- rising sparks from top -->
  <circle cx='110' cy='5' r='1' fill='#ffe060' opacity='0.5'/>
  <circle cx='130' cy='0' r='0.8' fill='#ff8800' opacity='0.4'/>
  <circle cx='140' cy='8' r='0.8' fill='#ffaa00' opacity='0.4'/>

  <!-- bottom glow -->
  <ellipse cx='125' cy='172' rx='35' ry='6' fill='#8a2a05' opacity='0.3' filter='url(#glowEC)'/>
</svg>
