<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a2a05"/>
      <stop offset="30%" stop-color="#e6591a"/>
      <stop offset="60%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ffe060"/>
    </linearGradient>
    <linearGradient id="lin5" x1="0%" y1="100%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#ffe060" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#ff8800" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#e6591a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="waveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a2a05" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="250" height="190" fill="url(#bg3)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.06"/>

  <!-- 背景余烬粒子 -->
  <circle cx="20.1" cy="35.6" r="1.4" fill="#ff6600" opacity="0.52"/>
  <circle cx="48.3" cy="15.8" r="0.8" fill="#ffcc40" opacity="0.40" filter="url(#glow1)"/>
  <circle cx="85.2" cy="42.3" r="2.1" fill="#ff7a1a" opacity="0.48"/>
  <circle cx="160.4" cy="28.7" r="1.2" fill="#ffe060" opacity="0.55" filter="url(#glow1)"/>
  <circle cx="210.6" cy="50.1" r="1.8" fill="#c41a05" opacity="0.44"/>
  <circle cx="233.9" cy="12.4" r="2.4" fill="#ff8800" opacity="0.38"/>
  <circle cx="12.7" cy="168.3" r="0.9" fill="#ffcc40" opacity="0.31" filter="url(#glow1)"/>
  <circle cx="228.5" cy="162.7" r="1.5" fill="#e6591a" opacity="0.49"/>
  <circle cx="75.4" cy="175.9" r="1.1" fill="#ffe060" opacity="0.37"/>
  <circle cx="195.8" cy="178.2" r="2.0" fill="#ff6600" opacity="0.42" filter="url(#glow1)"/>

  <!-- 远处火浪光晕 -->
  <ellipse cx="125" cy="120" rx="120" ry="50" fill="url(#waveGlow)" filter="url(#soft2)"/>

  <!-- 主体洪流 —— 多层波浪从左向右涌动 -->
  <!-- 远层波浪（较暗） -->
  <path d="M -10 125 Q 30 115 60 125 Q 90 135 125 120 Q 160 105 190 125 Q 220 145 260 120 L 260 195 L -10 195 Z" fill="#8a2a05" opacity="0.7" filter="url(#soft2)"/>

  <!-- 中层波浪 -->
  <path d="M -10 140 Q 25 120 55 138 Q 85 155 120 130 Q 155 105 185 135 Q 215 165 260 130 L 260 195 L -10 195 Z" fill="url(#lin4)" opacity="0.85" filter="url(#glow1)"/>

  <!-- 近层波浪（最亮，带火焰舌） -->
  <path d="M -10 160 Q 20 135 50 158 Q 80 178 115 145 Q 150 115 180 150 Q 210 178 260 145 L 260 195 L -10 195 Z" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>

  <!-- 火焰舌 —— 波浪顶端跃起的火苗 -->
  <path d="M 25 148 Q 18 138 22 128 Q 28 120 32 110 Q 36 122 38 128 Q 44 140 25 148 Z" fill="#ff8800" opacity="0.7" filter="url(#glow1)"/>
  <path d="M 55 135 Q 48 122 52 110 Q 58 100 62 85 Q 66 100 68 108 Q 74 125 55 135 Z" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
  <path d="M 90 155 Q 85 142 90 130 Q 96 120 100 105 Q 104 120 106 128 Q 112 142 90 155 Z" fill="#ff8800" opacity="0.7" filter="url(#glow1)"/>
  <path d="M 130 128 Q 122 110 128 95 Q 136 80 140 62 Q 144 82 146 92 Q 154 112 130 128 Z" fill="#fff8e0" opacity="0.55" filter="url(#glow1)"/>
  <path d="M 170 145 Q 165 130 170 118 Q 176 108 180 92 Q 184 108 186 116 Q 192 132 170 145 Z" fill="#ffe060" opacity="0.6" filter="url(#glow1)"/>
  <path d="M 210 138 Q 205 125 210 112 Q 216 102 220 88 Q 224 102 226 110 Q 232 125 210 138 Z" fill="#ff8800" opacity="0.65" filter="url(#glow1)"/>

  <!-- 空中飞溅的火星 -->
  <circle cx="25" cy="105" r="1.5" fill="#ffcc40" opacity="0.7" filter="url(#glow1)"/>
  <circle cx="55" cy="70" r="2.0" fill="#fff8e0" opacity="0.7" filter="url(#glow1)"/>
  <circle cx="90" cy="95" r="1.2" fill="#ff8800" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="130" cy="50" r="2.5" fill="#ffe060" opacity="0.75" filter="url(#glow1)"/>
  <circle cx="170" cy="75" r="1.8" fill="#fff8e0" opacity="0.65" filter="url(#glow1)"/>
  <circle cx="210" cy="85" r="2.1" fill="#ffcc40" opacity="0.6" filter="url(#glow1)"/>
  <circle cx="38" cy="85" r="0.8" fill="#e6591a" opacity="0.5"/>
  <circle cx="65" cy="55" r="0.6" fill="#c41a05" opacity="0.4"/>
  <circle cx="105" cy="68" r="1.0" fill="#ff8800" opacity="0.55"/>
  <circle cx="145" cy="42" r="0.7" fill="#ffcc40" opacity="0.45"/>
  <circle cx="185" cy="58" r="0.9" fill="#e6591a" opacity="0.5"/>
  <circle cx="220" cy="72" r="1.1" fill="#ff8800" opacity="0.5"/>

  <!-- 中央主光 —— 洪流能量核心 -->
  <circle cx="130" cy="130" r="18" fill="url(#waveGlow)" filter="url(#soft2)"/>
  <circle cx="130" cy="130" r="6" fill="#fff8e0" opacity="0.85" filter="url(#glow1)"/>
  <circle cx="130" cy="130" r="2.5" fill="#ffffff" opacity="0.95"/>

  <!-- 横向速度线 —— 表现洪流的流动感 -->
  <line x1="10" y1="118" x2="50" y2="118" stroke="#ff8800" stroke-width="1.2" opacity="0.5" filter="url(#glow1)"/>
  <line x1="60" y1="108" x2="100" y2="108" stroke="#ffe060" stroke-width="0.8" opacity="0.4"/>
  <line x1="140" y1="95" x2="185" y2="95" stroke="#ff8800" stroke-width="1.0" opacity="0.5" filter="url(#glow1)"/>
  <line x1="170" y1="115" x2="215" y2="115" stroke="#fff8e0" stroke-width="0.7" opacity="0.4"/>
  <line x1="30" y1="95" x2="75" y2="95" stroke="#e6591a" stroke-width="0.9" opacity="0.35"/>

</svg>
