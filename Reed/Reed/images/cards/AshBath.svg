<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgAB' cx='50%' cy='55%' r='80%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <radialGradient id='ashCloudAB' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#6a625a' stop-opacity='0.6'/>
      <stop offset='40%' stop-color='#4a423c' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#2a2520' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='figureAB' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#3a3028'/>
      <stop offset='50%' stop-color='#2a2018'/>
      <stop offset='100%' stop-color='#1a1410'/>
    </linearGradient>
    <radialGradient id='emberAB' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#ff8800' stop-opacity='0.8'/>
      <stop offset='60%' stop-color='#c41a05' stop-opacity='0.3'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='ashParticleAB' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#9a9288' stop-opacity='0.7'/>
      <stop offset='60%' stop-color='#5a5248' stop-opacity='0.35'/>
      <stop offset='100%' stop-color='#3a3228' stop-opacity='0'/>
    </radialGradient>
    <filter id='softAB'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
    <filter id='bigAB'><feGaussianBlur stdDeviation='8'/></filter>
  </defs>

  <rect width='250' height='190' rx='8' fill='url(#bgAB)'/>

  <!-- large ash cloud haze -->
  <ellipse cx='125' cy='95' rx='110' ry='75' fill='url(#ashCloudAB)' filter='url(#bigAB)' opacity='0.6'/>
  <ellipse cx='80' cy='70' rx='50' ry='35' fill='url(#ashCloudAB)' filter='url(#bigAB)' opacity='0.4'/>
  <ellipse cx='175' cy='80' rx='45' ry='30' fill='url(#ashCloudAB)' filter='url(#bigAB)' opacity='0.4'/>
  <ellipse cx='100' cy='130' rx='55' ry='25' fill='url(#ashCloudAB)' filter='url(#bigAB)' opacity='0.35'/>
  <ellipse cx='160' cy='140' rx='50' ry='22' fill='url(#ashCloudAB)' filter='url(#bigAB)' opacity='0.35'/>

  <!-- central ember glow (faint, warmth within ash) -->
  <ellipse cx='125' cy='100' rx='45' ry='55' fill='url(#emberAB)' opacity='0.25' filter='url(#bigAB)'/>

  <!-- figure silhouette (kneeling/bathing pose, arms spread) -->
  <path d='M 125,50 C 118,50 115,56 116,62 C 105,58 90,62 80,68 C 72,70 65,68 60,64 L 56,70 L 62,74 L 72,72 C 85,66 100,64 116,68 C 112,74 110,82 113,86 C 105,90 106,98 112,100 C 108,108 110,118 113,128 C 110,138 112,150 116,162 C 120,172 123,178 125,180 C 127,178 130,172 134,162 C 138,150 140,138 137,128 C 140,118 142,108 138,100 C 144,98 145,90 137,86 C 140,82 138,74 134,68 C 150,64 165,66 178,72 L 188,74 L 194,70 L 190,64 C 185,68 178,70 170,68 C 160,62 145,58 134,62 C 135,56 132,50 125,50 Z' fill='url(#figureAB)' opacity='0.85'/>

  <!-- ash swirling around figure (swirl paths) -->
  <path d='M 50,100 Q 70,80 90,90 Q 100,70 85,60' fill='none' stroke='#5a5248' stroke-width='1.5' opacity='0.3' filter='url(#softAB)'/>
  <path d='M 200,100 Q 180,80 160,90 Q 150,70 165,60' fill='none' stroke='#5a5248' stroke-width='1.5' opacity='0.3' filter='url(#softAB)'/>
  <path d='M 60,130 Q 80,115 100,120 Q 90,140 70,135' fill='none' stroke='#4a423c' stroke-width='1.2' opacity='0.25'/>
  <path d='M 190,130 Q 170,115 150,120 Q 160,140 180,135' fill='none' stroke='#4a423c' stroke-width='1.2' opacity='0.25'/>

  <!-- ash particles (grey, swirling around figure) -->
  <circle cx='55' cy='85' r='3' fill='url(#ashParticleAB)' opacity='0.7'/>
  <circle cx='195' cy='85' r='2.5' fill='url(#ashParticleAB)' opacity='0.65'/>
  <circle cx='45' cy='110' r='2' fill='#6a625a' opacity='0.55'/>
  <circle cx='205' cy='110' r='2.5' fill='#7a7268' opacity='0.6'/>
  <circle cx='65' cy='65' r='2' fill='url(#ashParticleAB)' opacity='0.6'/>
  <circle cx='185' cy='65' r='1.8' fill='url(#ashParticleAB)' opacity='0.55'/>
  <circle cx='50' cy='140' r='2.5' fill='#5a5248' opacity='0.5'/>
  <circle cx='200' cy='140' r='2' fill='#6a625a' opacity='0.5'/>
  <circle cx='70' cy='155' r='1.5' fill='#4a423c' opacity='0.4'/>
  <circle cx='180' cy='155' r='1.8' fill='#5a5248' opacity='0.45'/>
  <circle cx='90' cy='55' r='1.5' fill='url(#ashParticleAB)' opacity='0.5'/>
  <circle cx='160' cy='50' r='2' fill='url(#ashParticleAB)' opacity='0.5'/>
  <circle cx='40' cy='70' r='1.5' fill='#5a5248' opacity='0.4'/>
  <circle cx='210' cy='75' r='1.2' fill='#6a625a' opacity='0.4'/>

  <!-- finer ash dust -->
  <circle cx='75' cy='95' r='1' fill='#8a8278' opacity='0.4'/>
  <circle cx='175' cy='95' r='1' fill='#7a7268' opacity='0.4'/>
  <circle cx='85' cy='115' r='0.8' fill='#6a625a' opacity='0.35'/>
  <circle cx='165' cy='115' r='0.8' fill='#5a5248' opacity='0.35'/>
  <circle cx='95' cy='75' r='0.8' fill='#8a8278' opacity='0.35'/>
  <circle cx='155' cy='75' r='0.8' fill='#7a7268' opacity='0.35'/>
  <circle cx='35' cy='125' r='0.8' fill='#5a5248' opacity='0.3'/>
  <circle cx='215' cy='125' r='0.8' fill='#6a625a' opacity='0.3'/>

  <!-- faint glowing embers within ash (warmth) -->
  <circle cx='100' cy='90' r='1.5' fill='#ff8800' opacity='0.5' filter='url(#softAB)'/>
  <circle cx='150' cy='85' r='1.2' fill='#ffaa00' opacity='0.45'/>
  <circle cx='115' cy='110' r='1.8' fill='#ff8800' opacity='0.55' filter='url(#softAB)'/>
  <circle cx='140' cy='115' r='1.2' fill='#e6591a' opacity='0.4'/>
  <circle cx='125' cy='130' r='1.5' fill='#ff8800' opacity='0.45' filter='url(#softAB)'/>

  <!-- ash base mound -->
  <ellipse cx='125' cy='178' rx='70' ry='12' fill='#3a3228' opacity='0.6'/>
  <ellipse cx='125' cy='175' rx='50' ry='8' fill='#4a423c' opacity='0.5'/>

  <!-- top vignette -->
  <rect width='250' height='40' rx='8' fill='#1a0d08' opacity='0.3'/>
</svg>
