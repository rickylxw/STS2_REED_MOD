<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <radialGradient id="rad4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="20%" stop-color="#ffe060"/>
      <stop offset="50%" stop-color="#ff8800"/>
      <stop offset="80%" stop-color="#e6591a"/>
      <stop offset="100%" stop-color="#8a2a05"/>
    </radialGradient>
    <radialGradient id="rad5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="50%" stop-color="#ffcc40"/>
      <stop offset="100%" stop-color="#c41a05"/>
    </radialGradient>
    <linearGradient id="lin6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1f15"/>
      <stop offset="50%" stop-color="#2a1815"/>
      <stop offset="100%" stop-color="#3a1f15"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg3)" rx="8"/>
  <ellipse cx="125.0" cy="95.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.06" filter="url(#soft2)"/>
  <circle cx="53.4" cy="72.0" r="1.3" fill="#ff8800" opacity="0.41"/>
  <circle cx="78.2" cy="83.7" r="1.1" fill="#ffe060" opacity="0.56" filter="url(#glow1)"/>
  <circle cx="46.9" cy="65.4" r="2.2" fill="#ff7a1a" opacity="0.49"/>
  <circle cx="220.1" cy="65.7" r="2.5" fill="#c41a05" opacity="0.30"/>
  <circle cx="57.5" cy="106.9" r="1.7" fill="#c41a05" opacity="0.66"/>
  <circle cx="107.6" cy="158.3" r="2.1" fill="#ff8800" opacity="0.23" filter="url(#glow1)"/>
  <circle cx="156.9" cy="168.4" r="1.8" fill="#c41a05" opacity="0.49"/>
  <circle cx="161.4" cy="126.4" r="1.2" fill="#ffe060" opacity="0.29" filter="url(#glow1)"/>
  <!-- Eye socket glow -->
  <ellipse cx="125" cy="95" rx="60" ry="35" fill="#e6591a" opacity="0.08" filter="url(#soft2)"/>
  <!-- Eye shape (almond) -->
  <path d="M 50 95 Q 125 50 200 95 Q 125 140 50 95 Z" fill="#1a0d08" stroke="url(#lin6)" stroke-width="3"/>
  <!-- Iris -->
  <circle cx="125" cy="95" r="32" fill="url(#rad4)" filter="url(#glow1)"/>
  <!-- Iris texture rays -->
  <line x1="125" y1="95" x2="153.0" y2="95.0" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="149.2" y2="109.0" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="139.0" y2="119.2" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="125.0" y2="123.0" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="111.0" y2="119.2" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="100.8" y2="109.0" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="97.0" y2="95.0" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="100.8" y2="81.0" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="111.0" y2="70.8" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="125.0" y2="67.0" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="139.0" y2="70.8" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <line x1="125" y1="95" x2="149.2" y2="81.0" stroke="#c41a05" stroke-width="1" opacity="0.3"/>
  <!-- Pupil -->
  <circle cx="125" cy="95" r="12" fill="url(#rad5)" filter="url(#glow1)"/>
  <circle cx="125" cy="95" r="5" fill="#fff8e0" opacity="0.9"/>
  <!-- Catchlight -->
  <circle cx="118" cy="88" r="3" fill="#ffffff" opacity="0.8"/>
  <!-- Eyelid highlights -->
  <path d="M 55 93 Q 125 52 195 93" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.5" filter="url(#glow1)"/>
  <path d="M 55 97 Q 125 138 195 97" fill="none" stroke="#e6591a" stroke-width="1" opacity="0.3"/>
</svg>
