<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgSpear' cx='0.5' cy='0.4' r='0.85'>
      <stop offset='0' stop-color='#2a1815'/>
      <stop offset='0.55' stop-color='#1a0d08'/>
      <stop offset='1' stop-color='#0a0504'/>
    </radialGradient>
    <linearGradient id='bladeGrad' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0' stop-color='#5a3a1a'/>
      <stop offset='0.5' stop-color='#fff8e0'/>
      <stop offset='1' stop-color='#5a3a1a'/>
    </linearGradient>
    <linearGradient id='bladeCore' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.5' stop-color='#ffe060'/>
      <stop offset='1' stop-color='#ff8800'/>
    </linearGradient>
    <linearGradient id='shaftGrad' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0' stop-color='#3a2418'/>
      <stop offset='0.5' stop-color='#8a5a2a'/>
      <stop offset='1' stop-color='#3a2418'/>
    </linearGradient>
    <linearGradient id='shaftGlow' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0' stop-color='#c41a05' stop-opacity='0'/>
      <stop offset='0.5' stop-color='#ff8800' stop-opacity='0.5'/>
      <stop offset='1' stop-color='#c41a05' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='dragonHead' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#c41a05'/>
      <stop offset='0.5' stop-color='#8a2a05'/>
      <stop offset='1' stop-color='#3a1006'/>
    </linearGradient>
    <radialGradient id='flameGrad' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.3' stop-color='#ffe060'/>
      <stop offset='0.65' stop-color='#ff8800'/>
      <stop offset='1' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='flameWisp' x1='0' y1='1' x2='0' y2='0'>
      <stop offset='0' stop-color='#ff8800'/>
      <stop offset='0.5' stop-color='#ffe060'/>
      <stop offset='1' stop-color='#fff8e0' stop-opacity='0'/>
    </linearGradient>
    <radialGradient id='eyeGlow' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.4' stop-color='#ffe060'/>
      <stop offset='0.8' stop-color='#ff8800'/>
      <stop offset='1' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='emberGlow' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.4' stop-color='#ffcc40'/>
      <stop offset='0.8' stop-color='#e6591a'/>
      <stop offset='1' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='softBlur'><feGaussianBlur stdDeviation='2.5'/></filter>
    <filter id='bigBlur'><feGaussianBlur stdDeviation='6'/></filter>
  </defs>

  <!-- background -->
  <rect width='250' height='190' rx='8' fill='url(#bgSpear)'/>

  <!-- aura glow behind the blade -->
  <ellipse cx='125' cy='45' rx='55' ry='70' fill='url(#flameGrad)' filter='url(#bigBlur)' opacity='0.5'/>
  <!-- shaft path glow -->
  <rect x='115' y='95' width='20' height='90' fill='url(#shaftGlow)' filter='url(#bigBlur)' opacity='0.6'/>

  <!-- flames emanating from blade (behind blade) -->
  <path d='M110,75 C105,60 112,48 108,32 C114,42 116,55 112,68 Z' fill='url(#flameWisp)' opacity='0.85'/>
  <path d='M140,75 C145,60 138,48 142,32 C136,42 134,55 138,68 Z' fill='url(#flameWisp)' opacity='0.85'/>
  <path d='M125,70 C120,52 126,38 122,20 C128,32 130,46 126,60 C132,48 134,32 130,18 C136,34 138,50 134,64 C140,52 138,36 134,24 C140,40 142,56 136,72 Z' fill='url(#flameWisp)' opacity='0.9'/>
  <path d='M118,80 C114,68 116,56 112,46 C118,56 120,68 116,80 Z' fill='url(#flameWisp)' opacity='0.7'/>
  <path d='M132,80 C136,68 134,56 138,46 C132,56 130,68 134,80 Z' fill='url(#flameWisp)' opacity='0.7'/>

  <!-- the blade (leaf/diamond shape) -->
  <path d='M125,12 C131,18 138,30 139,45 C140,55 134,66 128,72 L125,74 L122,72 C116,66 110,55 111,45 C112,30 119,18 125,12 Z' fill='url(#bladeGrad)' opacity='0.97'/>
  <!-- blade central ridge (fuller) -->
  <path d='M125,16 C128,22 132,32 133,45 C134,54 130,64 125,70 L125,16 Z' fill='url(#bladeCore)' opacity='0.4'/>
  <path d='M125,16 L125,70' stroke='#fff8e0' stroke-width='0.8' opacity='0.6'/>
  <!-- blade edge highlight -->
  <path d='M125,14 C120,20 114,32 113,45 C112,54 117,64 123,71' fill='none' stroke='#fff8e0' stroke-width='0.6' opacity='0.5'/>
  <!-- dragon scale engraving on blade -->
  <path d='M120,30 C122,28 128,28 130,30 M118,40 C121,38 129,38 132,40 M118,52 C121,50 129,50 132,52' stroke='#8a2a05' stroke-width='0.6' fill='none' opacity='0.6'/>

  <!-- dragon head motif at blade base (the blade emerges from dragon's mouth) -->
  <!-- dragon head main mass -->
  <path d='M125,72 C115,72 108,78 106,86 C104,92 106,96 110,98 C108,100 108,104 112,106 C116,108 122,108 125,106 C128,108 134,108 138,106 C142,104 142,100 140,98 C144,96 146,92 144,86 C142,78 135,72 125,72 Z' fill='url(#dragonHead)' opacity='0.97'/>
  <!-- dragon horns -->
  <path d='M110,78 C104,72 100,64 96,58 C100,66 104,74 108,80 Z' fill='#3a1006'/>
  <path d='M140,78 C146,72 150,64 154,58 C150,66 146,74 142,80 Z' fill='#3a1006'/>
  <!-- dragon snout/jaw details -->
  <path d='M108,98 C112,100 118,101 122,100 M128,100 C132,101 138,100 142,98' stroke='#1a0d08' stroke-width='0.6' fill='none' opacity='0.7'/>
  <!-- dragon teeth/fangs at blade base -->
  <path d='M118,98 L120,103 L122,98 Z M128,98 L130,103 L132,98 Z' fill='#fff8e0' opacity='0.85'/>
  <!-- dragon eyes (glowing) -->
  <circle cx='116' cy='88' r='3.5' fill='url(#eyeGlow)' filter='url(#softBlur)' opacity='0.95'/>
  <circle cx='116' cy='88' r='1.5' fill='#fff8e0'/>
  <circle cx='134' cy='88' r='3.5' fill='url(#eyeGlow)' filter='url(#softBlur)' opacity='0.95'/>
  <circle cx='134' cy='88' r='1.5' fill='#fff8e0'/>
  <!-- dragon brow ridges -->
  <path d='M110,84 C114,82 120,82 122,86 M128,86 C130,82 136,82 140,84' stroke='#1a0d08' stroke-width='0.8' fill='none' opacity='0.7'/>

  <!-- collar/guard where dragon meets shaft -->
  <path d='M108,106 L142,106 L140,112 L110,112 Z' fill='#5a3a1a'/>
  <path d='M108,106 L142,106 L140,112 L110,112 Z' fill='none' stroke='#8a5a2a' stroke-width='0.6'/>
  <!-- ornate collar gems -->
  <circle cx='125' cy='109' r='2.5' fill='url(#emberGlow)' opacity='0.95'/>
  <circle cx='125' cy='109' r='1' fill='#fff8e0'/>

  <!-- the shaft (with engraved bands) -->
  <rect x='120' y='112' width='10' height='72' fill='url(#shaftGrad)' rx='1'/>
  <!-- shaft central highlight -->
  <rect x='124' y='112' width='2' height='72' fill='#ffe060' opacity='0.35'/>
  <!-- engraved bands/rings -->
  <rect x='116' y='116' width='18' height='5' fill='#3a2418' rx='1'/>
  <rect x='116' y='116' width='18' height='1.5' fill='#8a5a2a' opacity='0.7'/>
  <rect x='116' y='145' width='18' height='5' fill='#3a2418' rx='1'/>
  <rect x='116' y='145' width='18' height='1.5' fill='#8a5a2a' opacity='0.7'/>
  <rect x='116' y='170' width='18' height='5' fill='#3a2418' rx='1'/>
  <rect x='116' y='170' width='18' height='1.5' fill='#8a5a2a' opacity='0.7'/>
  <!-- flame engravings on shaft segments -->
  <path d='M125,122 C123,128 127,134 125,140 M125,150 C123,156 127,162 125,168' stroke='#c41a05' stroke-width='0.7' fill='none' opacity='0.7'/>
  <path d='M122,124 L126,124 M122,152 L126,152' stroke='#e6591a' stroke-width='0.5' opacity='0.6'/>
  <!-- grip wrap texture -->
  <path d='M120,128 L130,132 M120,134 L130,138 M120,158 L130,162 M120,164 L130,168' stroke='#1a0d08' stroke-width='0.6' opacity='0.6'/>

  <!-- spear butt cap (dragon-fire pommel) -->
  <path d='M116,184 L134,184 L131,188 L119,188 Z' fill='#3a2418'/>
  <circle cx='125' cy='183' r='2.5' fill='url(#emberGlow)' opacity='0.9'/>
  <circle cx='125' cy='183' r='1' fill='#fff8e0'/>

  <!-- front flames licking up over blade -->
  <path d='M115,72 C110,85 116,95 112,105 C118,98 116,88 120,80 Z' fill='url(#flameWisp)' opacity='0.8'/>
  <path d='M135,72 C140,85 134,95 138,105 C132,98 134,88 130,80 Z' fill='url(#flameWisp)' opacity='0.8'/>
  <path d='M125,74 C120,86 126,98 122,110 C128,100 130,88 125,74 Z' fill='url(#flameWisp)' opacity='0.75'/>

  <!-- ember sparks around blade -->
  <circle cx='100' cy='50' r='1.4' fill='#ffe060' opacity='0.85'/>
  <circle cx='150' cy='50' r='1.4' fill='#ffe060' opacity='0.85'/>
  <circle cx='95' cy='70' r='1.2' fill='#ff8800' opacity='0.75'/>
  <circle cx='155' cy='70' r='1.2' fill='#ff8800' opacity='0.75'/>
  <circle cx='105' cy='30' r='1.2' fill='#fff8e0' opacity='0.8'/>
  <circle cx='145' cy='30' r='1.2' fill='#fff8e0' opacity='0.8'/>
  <circle cx='88' cy='55' r='1' fill='#ffcc40' opacity='0.7'/>
  <circle cx='162' cy='55' r='1' fill='#ffcc40' opacity='0.7'/>
  <circle cx='115' cy='20' r='1' fill='#ffe060' opacity='0.7'/>
  <circle cx='135' cy='20' r='1' fill='#ffe060' opacity='0.7'/>

  <!-- shaft ember trail -->
  <circle cx='110' cy='130' r='1' fill='#ff8800' opacity='0.6'/>
  <circle cx='140' cy='150' r='1' fill='#ffcc40' opacity='0.6'/>
  <circle cx='112' cy='165' r='0.9' fill='#ffe060' opacity='0.55'/>
  <circle cx='138' cy='175' r='0.9' fill='#ff8800' opacity='0.55'/>

  <!-- vignette -->
  <rect width='250' height='190' rx='8' fill='#1a0d08' opacity='0.2'/>
  <rect width='250' height='40' rx='8' fill='#1a0d08' opacity='0.3'/>
  <rect y='150' width='250' height='40' rx='8' fill='#1a0d08' opacity='0.3'/>
</svg>
