<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgEM' cx='50%' cy='50%' r='80%'>
      <stop offset='0%' stop-color='#1a0d08'/>
      <stop offset='60%' stop-color='#0d0604'/>
      <stop offset='100%' stop-color='#050201'/>
    </radialGradient>
    <filter id='emberGlow' x='-200%' y='-200%' width='500%' height='500%'>
      <feGaussianBlur stdDeviation='2.5' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='emberBigGlow' x='-200%' y='-200%' width='500%' height='500%'>
      <feGaussianBlur stdDeviation='5' result='b'/>
      <feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <radialGradient id='emberRadG' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='30%' stop-color='#ffe060'/>
      <stop offset='70%' stop-color='#ff8800' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width='250' height='190' fill='url(#bgEM)' rx='8'/>

  <!-- Faint ground glow -->
  <ellipse cx='125' cy='170' rx='100' ry='20' fill='#2a1815' opacity='0.4'/>
  <ellipse cx='120' cy='95' rx='80' ry='50' fill='#1a0d08' opacity='0.3'/>

  <!-- Bright embers with glow and trails -->
