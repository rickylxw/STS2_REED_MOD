<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgFSA' cx='0.5' cy='0.5' r='0.7'>
      <stop offset='0' stop-color='#2a1a3a'/>
      <stop offset='0.5' stop-color='#1a0d18'/>
      <stop offset='1' stop-color='#0a0508'/>
    </radialGradient>
    <radialGradient id='shadowCore' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#ff8800'/>
      <stop offset='0.25' stop-color='#c41a05'/>
      <stop offset='0.6' stop-color='#2a1a3a'/>
      <stop offset='1' stop-color='#0a0518' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='shadowFlame' x1='0' y1='1' x2='0' y2='0'>
      <stop offset='0' stop-color='#c41a05'/>
      <stop offset='0.2' stop-color='#8a2a05'/>
      <stop offset='0.5' stop-color='#2a1a3a'/>
      <stop offset='0.85' stop-color='#1a0a2a'/>
      <stop offset='1' stop-color='#0a0518' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='shadowFlameAlt' x1='0' y1='1' x2='0' y2='0'>
      <stop offset='0' stop-color='#e6591a'/>
      <stop offset='0.25' stop-color='#8a2a05'/>
      <stop offset='0.55' stop-color='#1a0a2a'/>
      <stop offset='1' stop-color='#0a0518' stop-opacity='0'/>
    </linearGradient>
    <radialGradient id='emberGlow' cx='0.5' cy='0.5' r='0.5'>
      <stop offset='0' stop-color='#fff8e0'/>
      <stop offset='0.4' stop-color='#ffcc40'/>
      <stop offset='0.8' stop-color='#e6591a'/>
      <stop offset='1' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='softBlur'><feGaussianBlur stdDeviation='2'/></filter>
    <filter id='bigBlur'><feGaussianBlur stdDeviation='5'/></filter>
  </defs>

  <!-- background -->
  <rect width='250' height='190' rx='8' fill='url(#bgFSA)'/>

  <!-- central glow halo -->
  <circle cx='125' cy='95' r='80' fill='url(#shadowCore)' filter='url(#bigBlur)' opacity='0.55'/>

  <!-- elegant technique diagram: faint circular guides -->
  <circle cx='125' cy='95' r='70' fill='none' stroke='#e6591a' stroke-width='0.5' stroke-dasharray='2 4' opacity='0.35'/>
  <circle cx='125' cy='95' r='45' fill='none' stroke='#c41a05' stroke-width='0.5' stroke-dasharray='1.5 3.5' opacity='0.3'/>
  <circle cx='125' cy='95' r='22' fill='none' stroke='#8a2a05' stroke-width='0.5' stroke-dasharray='1 3' opacity='0.3'/>

  <!-- central shadow flame (upright) -->
  <path d='M125,150 C118,135 122,118 120,100 C124,108 122,88 126,75 C122,82 124,62 128,50 C130,62 132,82 130,98 C134,92 132,112 136,125 C140,138 134,148 125,150 Z' fill='url(#shadowFlame)' opacity='0.95'/>
  <!-- orange edge on central flame -->
  <path d='M125,150 C120,138 122,120 120,102 C123,110 122,90 124,76 C123,84 124,64 126,52 C128,64 130,82 128,98 C131,94 130,112 132,124 C136,136 132,146 125,150 Z' fill='none' stroke='#e6591a' stroke-width='0.8' opacity='0.7'/>

  <!-- left curving shadow flame (elegant arc) -->
  <path d='M125,95 C95,92 70,100 50,118 C40,128 35,142 40,158 C50,148 62,142 78,140 C68,150 60,162 58,176 C72,168 88,160 105,150 C112,144 120,135 125,128 C120,118 122,106 125,95 Z' fill='url(#shadowFlameAlt)' opacity='0.92'/>
  <path d='M125,98 C98,96 74,104 56,120 C48,128 44,140 48,152 C58,144 70,140 86,138 C76,148 70,160 68,172 C80,164 94,156 110,148 C116,142 122,134 125,128' fill='none' stroke='#ff8800' stroke-width='0.7' opacity='0.55'/>

  <!-- right curving shadow flame (mirror elegant arc) -->
  <path d='M125,95 C155,92 180,100 200,118 C210,128 215,142 210,158 C200,148 188,142 172,140 C182,150 190,162 192,176 C178,168 162,160 145,150 C138,144 130,135 125,128 C130,118 128,106 125,95 Z' fill='url(#shadowFlameAlt)' opacity='0.92'/>
  <path d='M125,98 C152,96 176,104 194,120 C202,128 206,140 202,152 C192,144 180,140 164,138 C174,148 180,160 182,172 C170,164 156,156 140,148 C134,142 128,134 125,128' fill='none' stroke='#ff8800' stroke-width='0.7' opacity='0.55'/>

  <!-- upper left small shadow flame -->
  <path d='M125,75 C105,70 88,58 78,42 C74,32 78,22 88,20 C92,32 100,42 110,50 C116,54 122,60 125,68 Z' fill='url(#shadowFlame)' opacity='0.9'/>
  <!-- upper right small shadow flame (mirror) -->
  <path d='M125,75 C145,70 162,58 172,42 C176,32 172,22 162,20 C158,32 150,42 140,50 C134,54 128,60 125,68 Z' fill='url(#shadowFlame)' opacity='0.9'/>

  <!-- small top flame -->
  <path d='M125,50 C120,40 124,28 125,18 C126,28 130,40 125,50 Z' fill='url(#shadowFlame)' opacity='0.9'/>

  <!-- thin elegant swirl tendrils (technique flow lines) -->
  <path d='M125,95 C100,80 80,70 60,75 C70,85 85,92 100,90 C90,100 75,108 80,120' fill='none' stroke='#e6591a' stroke-width='0.6' opacity='0.4'/>
  <path d='M125,95 C150,80 170,70 190,75 C180,85 165,92 150,90 C160,100 175,108 170,120' fill='none' stroke='#e6591a' stroke-width='0.6' opacity='0.4'/>

  <!-- orange edge glows at flame bases -->
  <ellipse cx='125' cy='148' rx='14' ry='4' fill='url(#emberGlow)' filter='url(#softBlur)' opacity='0.8'/>
  <ellipse cx='48' cy='155' rx='8' ry='3' fill='url(#emberGlow)' filter='url(#softBlur)' opacity='0.7'/>
  <ellipse cx='202' cy='155' rx='8' ry='3' fill='url(#emberGlow)' filter='url(#softBlur)' opacity='0.7'/>
  <ellipse cx='85' cy='40' rx='6' ry='3' fill='url(#emberGlow)' filter='url(#softBlur)' opacity='0.65'/>
  <ellipse cx='165' cy='40' rx='6' ry='3' fill='url(#emberGlow)' filter='url(#softBlur)' opacity='0.65'/>
  <ellipse cx='125' cy='48' rx='5' ry='3' fill='url(#emberGlow)' filter='url(#softBlur)' opacity='0.7'/>

  <!-- glowing ember specks along orange edges -->
  <circle cx='60' cy='118' r='1' fill='#ff8800' opacity='0.8'/>
  <circle cx='50' cy='120' r='1.2' fill='#ffcc40' opacity='0.75'/>
  <circle cx='190' cy='118' r='1' fill='#ff8800' opacity='0.8'/>
  <circle cx='200' cy='120' r='1.2' fill='#ffcc40' opacity='0.75'/>
  <circle cx='88' cy='40' r='1' fill='#ffe060' opacity='0.75'/>
  <circle cx='162' cy='40' r='1' fill='#ffe060' opacity='0.75'/>
  <circle cx='125' cy='20' r='1.2' fill='#fff8e0' opacity='0.8'/>

  <!-- dark purple speckles -->
  <circle cx='95' cy='125' r='1.4' fill='#1a0a2a' opacity='0.8'/>
  <circle cx='155' cy='125' r='1.4' fill='#1a0a2a' opacity='0.8'/>
  <circle cx='70' cy='100' r='1.2' fill='#2a1a3a' opacity='0.7'/>
  <circle cx='180' cy='100' r='1.2' fill='#2a1a3a' opacity='0.7'/>

  <!-- vignette -->
  <rect width='250' height='190' rx='8' fill='#0a0508' opacity='0.2'/>
</svg>
