<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
<defs>
  <radialGradient id='bgFS' cx='50%' cy='50%' r='70%'>
    <stop offset='0%' stop-color='#2a1815'/>
    <stop offset='50%' stop-color='#1a0d08'/>
    <stop offset='100%' stop-color='#0a0504'/>
  </radialGradient>
  <radialGradient id='flameGFS' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#fff8e0' stop-opacity='0.9'/>
    <stop offset='15%' stop-color='#ffe060' stop-opacity='0.8'/>
    <stop offset='35%' stop-color='#ffaa30' stop-opacity='0.7'/>
    <stop offset='60%' stop-color='#ff8800' stop-opacity='0.5'/>
    <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
  </radialGradient>
  <radialGradient id='glowFS' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#ff8800' stop-opacity='0.5'/>
    <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
  </radialGradient>
  <radialGradient id='bigGlowFS' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#c41a05' stop-opacity='0.2'/>
    <stop offset='100%' stop-color='#1a0d08' stop-opacity='0'/>
  </radialGradient>
  <radialGradient id='shadowGFS' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#000000' stop-opacity='0.7'/>
    <stop offset='60%' stop-color='#0a0504' stop-opacity='0.4'/>
    <stop offset='100%' stop-color='#0a0504' stop-opacity='0'/>
  </radialGradient>
  <radialGradient id='eyeGlowFS' cx='50%' cy='50%' r='50%'>
    <stop offset='0%' stop-color='#fff8e0' stop-opacity='1'/>
    <stop offset='30%' stop-color='#ffe060' stop-opacity='0.9'/>
    <stop offset='70%' stop-color='#ff8800' stop-opacity='0.5'/>
    <stop offset='100%' stop-color='#e6591a' stop-opacity='0'/>
  </radialGradient>
  <filter id='blurFS' x='-20%' y='-20%' width='140%' height='140%'>
    <feGaussianBlur stdDeviation='3'/>
  </filter>
  <filter id='bigBlurFS' x='-30%' y='-30%' width='160%' height='160%'>
    <feGaussianBlur stdDeviation='8'/>
  </filter>
</defs>

<!-- Background -->
<rect width='250' height='190' fill='url(#bgFS)' rx='8'/>

<!-- Outer ambient glow -->
<ellipse cx='125' cy='95' rx='110' ry='90' fill='url(#bigGlowFS)'/>

<!-- Shadow aura around character -->
<ellipse cx='125' cy='100' rx='55' ry='85' fill='url(#shadowGFS)' opacity='0.8'/>

