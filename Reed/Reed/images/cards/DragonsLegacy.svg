<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgDL' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#2a1505'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#0a0503'/>
    </radialGradient>
    <linearGradient id='dragonDL' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#ffaa00'/>
      <stop offset='35%' stop-color='#ff8800'/>
      <stop offset='65%' stop-color='#e6591a'/>
      <stop offset='100%' stop-color='#8a2a05'/>
    </linearGradient>
    <linearGradient id='wingDL' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#c41a05'/>
      <stop offset='50%' stop-color='#8a2a05'/>
      <stop offset='100%' stop-color='#3a1505'/>
    </linearGradient>
    <radialGradient id='fireGlowDL' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#ff8800' stop-opacity='0.6'/>
      <stop offset='50%' stop-color='#e6591a' stop-opacity='0.25'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='eyeDL' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='30%' stop-color='#ffe060'/>
      <stop offset='70%' stop-color='#ff8800'/>
      <stop offset='100%' stop-color='#c41a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowDL'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
    <filter id='bigDL'><feGaussianBlur stdDeviation='6'/></filter>
  </defs>

  <rect width='250' height='190' rx='8' fill='url(#bgDL)'/>

  <!-- decorative outer ring -->
  <circle cx='125' cy='95' r='82' fill='none' stroke='#e6591a' stroke-width='1.5' opacity='0.25'/>
  <circle cx='125' cy='95' r='76' fill='none' stroke='#8a2a05' stroke-width='0.8' opacity='0.2'/>
  <!-- inner ring with flame notches -->
  <circle cx='125' cy='95' r='72' fill='none' stroke='#e6591a' stroke-width='0.5' opacity='0.15'/>

  <!-- fire glow behind dragon -->
  <ellipse cx='125' cy='95' rx='55' ry='50' fill='url(#fireGlowDL)' filter='url(#bigDL)'/>

  <!-- left wing (spread) -->
  <path d='M 70,75 C 55,65 35,55 20,50 C 15,55 18,65 25,70 C 35,72 40,68 45,72 C 38,78 32,82 30,88 C 38,85 45,85 52,88 C 48,92 45,96 45,102 C 55,95 62,92 68,95 C 65,90 68,82 70,75 Z' fill='url(#wingDL)' stroke='#c41a05' stroke-width='0.5' opacity='0.85'/>

  <!-- right wing (spread, mirrored) -->
  <path d='M 180,75 C 195,65 215,55 230,50 C 235,55 232,65 225,70 C 215,72 210,68 205,72 C 212,78 218,82 220,88 C 212,85 205,85 198,88 C 202,92 205,96 205,102 C 195,95 188,92 182,95 C 185,90 182,82 180,75 Z' fill='url(#wingDL)' stroke='#c41a05' stroke-width='0.5' opacity='0.85'/>

  <!-- wing membrane details (left) -->
  <path d='M 25,70 L 55,80 M 30,88 L 55,88 M 45,102 L 60,95' fill='none' stroke='#1a0d08' stroke-width='0.5' opacity='0.4'/>
  <!-- wing membrane details (right) -->
  <path d='M 225,70 L 195,80 M 220,88 L 195,88 M 205,102 L 190,95' fill='none' stroke='#1a0d08' stroke-width='0.5' opacity='0.4'/>

  <!-- dragon body (serpentine, coiled) -->
  <path d='M 125,50 C 110,52 95,60 88,75 C 82,88 85,100 92,108 C 100,115 110,118 120,116 C 130,118 140,115 148,108 C 155,100 158,88 152,75 C 145,60 130,52 125,50 Z' fill='url(#dragonDL)' stroke='#c41a05' stroke-width='0.8' opacity='0.9'/>

  <!-- dragon head (top) -->
  <path d='M 125,35 C 118,36 112,42 110,50 L 116,52 C 116,48 120,44 125,43 C 130,44 134,48 134,52 L 140,50 C 138,42 132,36 125,35 Z' fill='url(#dragonDL)' stroke='#c41a05' stroke-width='0.6' opacity='0.95'/>

  <!-- horns -->
  <path d='M 116,42 L 108,28 L 112,26 L 120,40 Z' fill='url(#dragonDL)' stroke='#8a2a05' stroke-width='0.4' opacity='0.9'/>
  <path d='M 134,42 L 142,28 L 138,26 L 130,40 Z' fill='url(#dragonDL)' stroke='#8a2a05' stroke-width='0.4' opacity='0.9'/>

  <!-- dragon eyes (glowing) -->
  <ellipse cx='118' cy='48' rx='3' ry='2' fill='url(#eyeDL)' filter='url(#glowDL)'/>
  <ellipse cx='132' cy='48' rx='3' ry='2' fill='url(#eyeDL)' filter='url(#glowDL)'/>
  <ellipse cx='118' cy='48' rx='1' ry='1.5' fill='#000000' opacity='0.6'/>
  <ellipse cx='132' cy='48' rx='1' ry='1.5' fill='#000000' opacity='0.6'/>

  <!-- dragon snout/nostrils -->
  <ellipse cx='122' cy='53' rx='1.5' ry='1' fill='#000000' opacity='0.5'/>
  <ellipse cx='128' cy='53' rx='1.5' ry='1' fill='#000000' opacity='0.5'/>

  <!-- body scales pattern -->
  <path d='M 105,65 Q 110,68 115,65 Q 112,70 110,68 Q 108,70 105,65 Z' fill='#ffaa00' opacity='0.4'/>
  <path d='M 120,65 Q 125,68 130,65 Q 127,70 125,68 Q 123,70 120,65 Z' fill='#ffaa00' opacity='0.4'/>
  <path d='M 135,65 Q 140,68 145,65 Q 142,70 140,68 Q 138,70 135,65 Z' fill='#ffaa00' opacity='0.4'/>
  <path d='M 112,78 Q 117,81 122,78 Q 119,83 117,81 Q 115,83 112,78 Z' fill='#ffaa00' opacity='0.35'/>
  <path d='M 128,78 Q 133,81 138,78 Q 135,83 133,81 Q 131,83 128,78 Z' fill='#ffaa00' opacity='0.35'/>

  <!-- dragon tail (bottom, coiled) -->
  <path d='M 120,116 C 115,125 108,135 100,145 C 95,152 100,158 105,155 C 110,150 115,142 120,135 C 122,128 122,122 120,116 Z' fill='url(#dragonDL)' stroke='#8a2a05' stroke-width='0.5' opacity='0.85'/>
  <path d='M 130,116 C 135,125 142,135 150,145 C 155,152 150,158 145,155 C 140,150 135,142 130,135 C 128,128 128,122 130,116 Z' fill='url(#dragonDL)' stroke='#8a2a05' stroke-width='0.5' opacity='0.85'/>

  <!-- tail spikes -->
  <path d='M 105,155 L 100,162 L 107,158 Z' fill='#8a2a05' opacity='0.8'/>
  <path d='M 145,155 L 150,162 L 143,158 Z' fill='#8a2a05' opacity='0.8'/>

  <!-- flame breath from mouth -->
  <path d='M 125,54 C 122,58 128,60 125,64 C 122,60 128,58 125,54 Z' fill='#ffe060' opacity='0.7' filter='url(#glowDL)'/>

  <!-- embers floating around -->
  <circle cx='60' cy='35' r='1.2' fill='#ffe060' opacity='0.5' filter='url(#glowDL)'/>
  <circle cx='190' cy='35' r='1' fill='#ffaa00' opacity='0.45'/>
  <circle cx='50' cy='110' r='0.8' fill='#ff8800' opacity='0.35'/>
  <circle cx='200' cy='110' r='0.8' fill='#c41a05' opacity='0.3'/>
  <circle cx='125' cy='15' r='1' fill='#ffe060' opacity='0.4'/>
  <circle cx='80' cy='160' r='0.8' fill='#ff8800' opacity='0.3'/>
  <circle cx='170' cy='160' r='0.8' fill='#c41a05' opacity='0.3'/>

  <!-- outer ring flame points (decorative) -->
  <circle cx='125' cy='13' r='2' fill='#ff8800' opacity='0.5' filter='url(#glowDL)'/>
  <circle cx='207' cy='95' r='2' fill='#ff8800' opacity='0.4' filter='url(#glowDL)'/>
  <circle cx='125' cy='177' r='2' fill='#ff8800' opacity='0.4' filter='url(#glowDL)'/>
  <circle cx='43' cy='95' r='2' fill='#ff8800' opacity='0.4' filter='url(#glowDL)'/>
</svg>
