<svg xmlns="http://www.w3.org/2000/svg" width="250" height="190" viewBox="0 0 250 190">
  <defs>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg3" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#2a1815"/>
      <stop offset="60%" stop-color="#1a0d08"/>
      <stop offset="100%" stop-color="#0d0604"/>
    </radialGradient>
    <linearGradient id="lin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe060" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff8800" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c41a05" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="250" height="190" fill="url(#bg3)" rx="8"/>
  <ellipse cx="125.0" cy="105.0" rx="120.0" ry="79.8" fill="#e6591a" opacity="0.06"/>
  <circle cx="152.6" cy="52.1" r="1.1" fill="#e6591a" opacity="0.61" filter="url(#glow1)"/>
  <circle cx="78.0" cy="177.4" r="1.5" fill="#e6591a" opacity="0.67" filter="url(#glow1)"/>
  <circle cx="104.9" cy="140.5" r="1.1" fill="#ffe060" opacity="0.25" filter="url(#glow1)"/>
  <circle cx="162.5" cy="55.0" r="0.7" fill="#e6591a" opacity="0.30" filter="url(#glow1)"/>
  <circle cx="228.0" cy="120.8" r="0.8" fill="#ff8800" opacity="0.60"/>
  <circle cx="98.4" cy="57.7" r="0.5" fill="#e6591a" opacity="0.26"/>
  <circle cx="167.2" cy="99.6" r="1.2" fill="#ff8800" opacity="0.34" filter="url(#glow1)"/>
  <circle cx="196.6" cy="31.7" r="0.7" fill="#ff8800" opacity="0.23"/>
  <!-- Stylized horned dragon crest -->
  <path d="M 125,118 C 95,112 87,90 99,70 C 105,58 117,52 125,50 C 133,52 145,58 151,70 C 163,90 155,112 125,118 Z" fill="#331100" opacity="0.85"/>
  <path d="M 125,118 C 95,112 87,90 99,70 C 105,58 117,52 125,50 C 133,52 145,58 151,70 C 163,90 155,112 125,118 Z" fill="none" stroke="#ff8800" stroke-width="2" opacity="0.7" filter="url(#glow1)"/>
  <!-- Horns -->
  <path d="M 105,62 Q 85,50 81,30 Q 95,44 111,54 Z" fill="url(#lin4)" opacity="0.85" filter="url(#glow1)"/>
  <path d="M 145,62 Q 165,50 169,30 Q 155,44 139,54 Z" fill="url(#lin4)" opacity="0.85" filter="url(#glow1)"/>
  <!-- Burning eyes -->
  <path d="M 111,86 Q 116,82 121,86 Q 116,92 111,86 Z" fill="#fff8e0" opacity="0.95" filter="url(#glow1)"/>
  <path d="M 129,86 Q 134,82 139,86 Q 134,92 129,86 Z" fill="#fff8e0" opacity="0.95" filter="url(#glow1)"/>
  <!-- Pressure rings descending outward -->
  <ellipse cx="125" cy="122" rx="70" ry="24.5" fill="none" stroke="#e6591a" stroke-width="1.5" opacity="0.35" filter="url(#soft2)"/>
  <ellipse cx="125" cy="122" rx="90" ry="31.499999999999996" fill="none" stroke="#e6591a" stroke-width="1.5" opacity="0.22" filter="url(#soft2)"/>
  <ellipse cx="125" cy="122" rx="110" ry="38.5" fill="none" stroke="#e6591a" stroke-width="1.5" opacity="0.12" filter="url(#soft2)"/>
  <!-- Flame crown above -->
  <path d="M 107,48 Q 109,36.0 111,28 Q 113,36.0 115,48 Z" fill="url(#lin4)" opacity="0.8" filter="url(#glow1)"/>
  <path d="M 121,48 Q 123,30.0 125,18 Q 127,30.0 129,48 Z" fill="url(#lin4)" opacity="0.8" filter="url(#glow1)"/>
  <path d="M 135,48 Q 137,36.0 139,28 Q 141,36.0 143,48 Z" fill="url(#lin4)" opacity="0.8" filter="url(#glow1)"/>
  <ellipse cx="125.0" cy="178.0" rx="60.0" ry="8.0" fill="#8a2a05" opacity="0.28" filter="url(#soft2)"/>
</svg>
