<svg xmlns='http://www.w3.org/2000/svg' width='250' height='190' viewBox='0 0 250 190'>
  <defs>
    <radialGradient id='bgFB' cx='50%' cy='50%' r='80%'>
      <stop offset='0%' stop-color='#2a1815'/>
      <stop offset='50%' stop-color='#1a0d08'/>
      <stop offset='100%' stop-color='#050201'/>
    </radialGradient>
    <radialGradient id='burstCore' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0'/>
      <stop offset='25%' stop-color='#ffe060'/>
      <stop offset='55%' stop-color='#ff8800'/>
      <stop offset='85%' stop-color='#c41a05' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='impactFB' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#fff8e0' stop-opacity='1'/>
      <stop offset='20%' stop-color='#ffe060' stop-opacity='0.8'/>
      <stop offset='50%' stop-color='#ff8800' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#8a2a05' stop-opacity='0'/>
    </radialGradient>
    <filter id='glowFB'>
      <feGaussianBlur stdDeviation='3' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='bigGlowFB'>
      <feGaussianBlur stdDeviation='6' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='softFB'>
      <feGaussianBlur stdDeviation='10' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>

  <rect width='250' height='190' fill='url(#bgFB)' rx='8'/>

  <!-- Atmospheric heat haze layers -->
  <ellipse cx='125' cy='95' rx='120' ry='80' fill='#e6591a' opacity='0.04' filter='url(#softFB)'/>
  <ellipse cx='125' cy='30' rx='80' ry='20' fill='#ff8800' opacity='0.03'/>
  <ellipse cx='125' cy='160' rx='80' ry='20' fill='#c41a05' opacity='0.03'/>

  <!-- central burst explosion -->
  <circle cx='125' cy='95' r='70' fill='url(#burstCore)' filter='url(#bigGlowFB)' opacity='0.8'/>

  <!-- Background ember particles -->
  <circle cx='30' cy='30' r='1.5' fill='#ff8800' opacity='0.5' filter='url(#glowFB)'/>
  <circle cx='55' cy='15' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='200' cy='25' r='1.2' fill='#ff8800' opacity='0.5'/>
  <circle cx='220' cy='55' r='1' fill='#ffaa30' opacity='0.4'/>
  <circle cx='15' cy='90' r='1' fill='#e6591a' opacity='0.3'/>
  <circle cx='235' cy='100' r='1' fill='#ff8800' opacity='0.3'/>
  <circle cx='20' cy='160' r='1' fill='#c41a05' opacity='0.3'/>
  <circle cx='225' cy='165' r='1' fill='#e6591a' opacity='0.3'/>
  <circle cx='90' cy='20' r='0.8' fill='#ffe060' opacity='0.4'/>
  <circle cx='160' cy='175' r='0.8' fill='#ff8800' opacity='0.3'/>

  <!-- radiating flame tongues -->
  <g filter='url(#glowFB)'>
    <!-- upward -->
    <path d='M 125 95 Q 120 60 125 20 Q 130 60 125 95 Z' fill='#ff8800' opacity='0.7'/>
    <path d='M 125 95 Q 122 65 125 30 Q 128 65 125 95 Z' fill='#ffe060' opacity='0.5'/>
    <path d='M 125 95 Q 124 70 125 40 Q 126 70 125 95 Z' fill='#fff8e0' opacity='0.3'/>

    <!-- downward -->
    <path d='M 125 95 Q 120 130 125 170 Q 130 130 125 95 Z' fill='#ff8800' opacity='0.7'/>
    <path d='M 125 95 Q 122 125 125 160 Q 128 125 125 95 Z' fill='#ffe060' opacity='0.5'/>

    <!-- left -->
    <path d='M 125 95 Q 90 92 50 95 Q 90 98 125 95 Z' fill='#ff8800' opacity='0.6'/>
    <path d='M 125 95 Q 95 93 60 95 Q 95 97 125 95 Z' fill='#ffe060' opacity='0.4'/>

    <!-- right -->
    <path d='M 125 95 Q 160 92 200 95 Q 160 98 125 95 Z' fill='#ff8800' opacity='0.6'/>
    <path d='M 125 95 Q 155 93 190 95 Q 155 97 125 95 Z' fill='#ffe060' opacity='0.4'/>

    <!-- diagonal flames -->
    <path d='M 125 95 Q 100 70 75 45 Q 100 75 125 95 Z' fill='#ff8800' opacity='0.5'/>
    <path d='M 125 95 Q 150 70 175 45 Q 150 75 125 95 Z' fill='#ff8800' opacity='0.5'/>
    <path d='M 125 95 Q 100 120 75 145 Q 100 120 125 95 Z' fill='#ff8800' opacity='0.5'/>
    <path d='M 125 95 Q 150 120 175 145 Q 150 120 125 95 Z' fill='#ff8800' opacity='0.5'/>
  </g>

  <!-- Spark burst lines (radial) -->
  <g filter='url(#glowFB)'>
    <line x1='125' y1='95' x2='125' y2='10' stroke='#fff8e0' stroke-width='1.5' opacity='0.7'/>
    <line x1='125' y1='95' x2='125' y2='180' stroke='#ffe060' stroke-width='1.2' opacity='0.6'/>
    <line x1='125' y1='95' x2='40' y2='95' stroke='#ffaa30' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='95' x2='210' y2='95' stroke='#ffaa30' stroke-width='1' opacity='0.6'/>
    <line x1='125' y1='95' x2='65' y2='35' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='95' x2='185' y2='35' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='95' x2='65' y2='155' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
    <line x1='125' y1='95' x2='185' y2='155' stroke='#ff8800' stroke-width='0.8' opacity='0.5'/>
  </g>

  <!-- small spark particles (火星) bursting outward -->
  <g filter='url(#glowFB)'>
    <circle cx='125' cy='15' r='2.5' fill='#fff8e0' opacity='0.9'/>
    <circle cx='125' cy='175' r='2.5' fill='#fff8e0' opacity='0.85'/>
    <circle cx='45' cy='95' r='2' fill='#ffe060' opacity='0.8'/>
    <circle cx='205' cy='95' r='2' fill='#ffe060' opacity='0.8'/>
    <circle cx='70' cy='40' r='1.8' fill='#ff8800' opacity='0.7'/>
    <circle cx='180' cy='40' r='1.8' fill='#ff8800' opacity='0.7'/>
    <circle cx='70' cy='150' r='1.8' fill='#ff8800' opacity='0.7'/>
    <circle cx='180' cy='150' r='1.8' fill='#ff8800' opacity='0.7'/>
    <circle cx='95' cy='25' r='1.2' fill='#ffaa30' opacity='0.6'/>
    <circle cx='155' cy='25' r='1.2' fill='#ffaa30' opacity='0.6'/>
    <circle cx='95' cy='165' r='1.2' fill='#ffaa30' opacity='0.6'/>
    <circle cx='155' cy='165' r='1.2' fill='#ffaa30' opacity='0.6'/>
  </g>

  <!-- scattered small embers -->
  <g>
    <circle cx='30' cy='30' r='1' fill='#ff8800' opacity='0.5'/>
    <circle cx='220' cy='30' r='1.2' fill='#ffaa30' opacity='0.5'/>
    <circle cx='20' cy='160' r='1' fill='#e6591a' opacity='0.4'/>
    <circle cx='230' cy='160' r='1' fill='#ff8800' opacity='0.4'/>
    <circle cx='90' cy='25' r='0.8' fill='#ffe060' opacity='0.4'/>
    <circle cx='160' cy='170' r='0.8' fill='#ff8800' opacity='0.3'/>
    <circle cx='25' cy='95' r='0.8' fill='#c41a05' opacity='0.3'/>
    <circle cx='225' cy='100' r='0.8' fill='#c41a05' opacity='0.3'/>
    <circle cx='50' cy='60' r='0.8' fill='#e6591a' opacity='0.3'/>
    <circle cx='200' cy='130' r='0.8' fill='#e6591a' opacity='0.3'/>
  </g>

  <!-- impact glow at center -->
  <circle cx='125' cy='95' r='30' fill='url(#impactFB)' filter='url(#glowFB)'/>

  <!-- bright core -->
  <circle cx='125' cy='95' r='12' fill='url(#burstCore)' filter='url(#glowFB)' opacity='0.95'/>
  <circle cx='125' cy='95' r='5' fill='#fff8e0' opacity='0.9'/>
  <circle cx='125' cy='95' r='2' fill='#ffffff'/>

  <!-- Bottom ember glow -->
  <ellipse cx='125' cy='185' rx='45' ry='5' fill='#8a2a05' opacity='0.2'/>
  <circle cx='115' cy='183' r='1.2' fill='#ff8800' opacity='0.4'/>
  <circle cx='135' cy='184' r='1' fill='#ffaa30' opacity='0.3'/>

  <!-- Top ember glow -->
  <ellipse cx='125' cy='5' rx='35' ry='4' fill='#8a2a05' opacity='0.15'/>
</svg>
